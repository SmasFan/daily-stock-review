<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日复盘 · A股</title>
<link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.review();
    const t = d.temperature, s = d.stats;

    // ===== 宏观反馈（2026-08 新增）：读取宏观页结果，给个股/板块打利好/风险标签 =====
    let mIdx = null, mSec = null;
    try {
      const mD = await RV.API.fetch('macro_data.json');
      mIdx = (mD._index || {}).stocks || {};
      mSec = (mD._index || {}).sectors || {};
    } catch (e) {}
    function macroBadge(code) {
      const m = mIdx && mIdx[code];
      if (!m) return '';
      const k = m.score > 0 ? 'bull' : 'risk';
      const cls = m.score > 0 ? 'macro-bull' : 'macro-risk';
      return `<span class="macro-badge ${cls}" title="宏观情绪 ${RV.fmt.num(m.score, 1)}（利好${m.bulls}/风险${m.risks}）">${k === 'bull' ? '宏观利好' : '宏观风险'}</span>`;
    }
    function sectorMacroTag(sec) {
      const m = mSec && mSec[sec];
      if (!m || m.net === 0) return '';
      const k = m.net > 0 ? 'bull' : 'risk';
      const cls = m.net > 0 ? 'macro-bull' : 'macro-risk';
      return `<span class="macro-badge ${cls}" title="宏观情绪 ${RV.fmt.num(m.net, 1)}（利好${m.bulls}/风险${m.risks}）">${k === 'bull' ? '宏观利好' : '宏观风险'}</span>`;
    }

    // 买入推荐强度排序：strong_buy > buy > watch > reduce > sell，同级按评分降序
    const SIG_ORDER = { strong_buy: 0, buy: 1, watch: 2, reduce: 3, sell: 4 };
    function buyStrength(r) {
      return r.signal_key in SIG_ORDER ? SIG_ORDER[r.signal_key] : 5;
    }
    const byStrength = (a, b) => buyStrength(a) - buyStrength(b) || b.score - a.score;
    (d.items || []).sort(byStrength);
    (d.market_items || []).sort(byStrength);

    // ===== 大盘指数模块（2026-08-07 参照推荐页新样式：涨跌强度着色 + 图标 + 评估卡 + 点击弹详情） =====
    const IDX_SHORT = {
      '上证指数': 'SH',
      '深证成指': 'SZ',
      '创业板指': 'CYB',
      '沪深300': 'HS300',
      '恒生指数': 'HSI',
      '道琼斯': 'DJI',
      '纳斯达克': 'NDX',
      '标普500': 'S&P',
    };
    const IDX_ICON = {
      '上证指数': 'landmark',
      '深证成指': 'building-columns',
      '创业板指': 'rocket',
      '沪深300': 'chart-line',
      '恒生指数': 'city',
      '道琼斯': 'building',
      '纳斯达克': 'microchip',
      '标普500': 'star',
    };
    // 扁平配色：柔和红涨绿跌 + 强度分级（与推荐页一致）
    const IDX_PALETTE = {
      up: { bg: ['#fef2f2', '#fee2e2', '#fecaca'], tx: ['#dc2626', '#dc2626', '#b91c1c'] },
      down: { bg: ['#f0fdf4', '#dcfce7', '#bbf7d0'], tx: ['#16a34a', '#16a34a', '#15803d'] },
      neu: { bg: '#f4f5f7', tx: '#4b5563' },
    };
    function idxStyle(change) {
      if (!change) return { bg: IDX_PALETTE.neu.bg, tx: IDX_PALETTE.neu.tx };
      const mag = Math.min(Math.abs(change) / 3, 1);   // 3% 封顶
      const lvl = mag < 0.4 ? 0 : (mag < 0.8 ? 1 : 2);
      const p = change > 0 ? IDX_PALETTE.up : IDX_PALETTE.down;
      return { bg: p.bg[lvl], tx: p.tx[lvl] };
    }
    const idxCards = (d.indices || []).map((i, idx) => {
      const s = idxStyle(i.change_pct);
      const short = IDX_SHORT[i.name] || i.name;
      const ico = IDX_ICON[i.name] ? RV.ui.icon(IDX_ICON[i.name]) : '';
      return `
      <div class="idx-card" data-i="${idx}" style="background:${s.bg};border-top-color:${s.tx}" title="点击查看 ${i.name} 技术详情">
        <span class="idx-short">${ico} ${short}</span>
        <span class="idx-card-pct" style="color:${s.tx}">${RV.fmt.pct(i.change_pct)}</span>
        <span class="idx-card-close">${RV.fmt.num(i.close)}</span>
      </div>`;
    }).join('');

    // 大盘评估（市场热度）：涨跌家数 / 平均涨跌 / 买卖信号（与推荐页同口径）
    function tempColor(score) {
      if (score >= 70) return '#e74c3c';
      if (score >= 55) return '#f39c12';
      if (score >= 40) return '#3498db';
      return '#27ae60';
    }
    function assessCard(tt) {
      if (!tt || tt.score == null) return '';
      const c = tempColor(tt.score);
      return `<div class="idx-assess" style="--ia-color:${c}">
        <div class="ia-left">
          <div>
            <span class="ia-label">${RV.ui.icon('temperature-high', 'fa-xs')} 大盘评估</span>
            <div class="ia-score-row">
              <span class="ia-score" style="color:${c}">${tt.score}</span>
              <span class="ia-tag">${tt.label}</span>
            </div>
          </div>
        </div>
        <div class="ia-mid">
          <div class="tempo-bar"><div class="tempo-fill" style="width:${tt.score}%;background:${c}"></div></div>
          <div class="ia-metrics">
            <span>${RV.ui.icon('arrow-trend-up', 'fa-xs')} 涨家占比 <b>${tt.breadth != null ? tt.breadth + '%' : '--'}</b></span>
            <span>${RV.ui.icon('scale-balanced', 'fa-xs')} 平均涨跌 <b class="${RV.fmt.cls(tt.avg_change)}">${RV.fmt.pct(tt.avg_change)}</b></span>
            <span>${RV.ui.icon('bullseye', 'fa-xs')} 买${tt.bull ?? '--'} / 卖${tt.bear ?? '--'}</span>
          </div>
        </div>
        <span class="ia-hint">${RV.ui.icon('mouse-pointer', 'fa-xs')} 点击指数卡弹出详情</span>
      </div>`;
    }

    // 指数技术因子卡：对有 factor 数据的指数（含纳指/标普）展示趋势/评分/买卖点位/均线偏离
    function indexFactorCard(i) {
      const f = i.factors;
      if (!f) return '';
      const scoreCls = f.score >= 60 ? 'up' : (f.score < 40 ? 'down' : '');
      const trendCls = RV.fmt.cls(f.bias_ma20);
      return `
      <div class="idx-factor-card">
        <div class="idx-f-head">
          <span class="idx-f-name">${i.name}</span>
          <span class="idx-f-price">${RV.fmt.num(i.close)} <span class="${RV.fmt.cls(i.change_pct)}">${RV.fmt.pct(i.change_pct)}</span></span>
          ${RV.ui.signalBadge(f.signal_key, f.signal)}
        </div>
        <div class="idx-f-grid">
          <div class="idx-f-item"><span class="k">评分</span><span class="v ${scoreCls}">${f.score}</span></div>
          <div class="idx-f-item"><span class="k">趋势</span><span class="v">${f.trend_status}</span></div>
          <div class="idx-f-item"><span class="k">MA5 / MA20</span><span class="v">${RV.fmt.num(f.ma5)} / ${RV.fmt.num(f.ma20)}</span></div>
          <div class="idx-f-item"><span class="k">偏离MA20</span><span class="v ${trendCls}">${RV.fmt.pct(f.bias_ma20)}</span></div>
          <div class="idx-f-item"><span class="k">MACD</span><span class="v">${f.macd_status}</span></div>
          <div class="idx-f-item"><span class="k">RSI12</span><span class="v">${RV.fmt.num(f.rsi12, 1)}</span></div>
          <div class="idx-f-item"><span class="k">量能</span><span class="v">${f.volume_status}</span></div>
          <div class="idx-f-item"><span class="k">60日</span><span class="v ${RV.fmt.cls(f.change_60d)}">${RV.fmt.pct(f.change_60d)}</span></div>
        </div>
        <div class="idx-f-points">
          <span>买点 ${RV.fmt.num(f.ideal_buy)}</span>
          <span>次优 ${RV.fmt.num(f.secondary_buy)}</span>
          <span>止损 ${RV.fmt.num(f.stop_loss)}</span>
          <span>止盈 ${RV.fmt.num(f.take_profit)}</span>
        </div>
      </div>`;
    }
    const factorCards = (d.indices || []).map((i, idx) =>
      i.factors ? `<div class="idx-factor-card" data-i="${idx}">${indexFactorCard(i)}</div>` : '').join('');
    const indicesHtml = `<div class="section" data-nav="大盘指数" data-nav-icon="chart-column">
      <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-column')}</span><h2>大盘指数 · 市场评估</h2></div>
      ${assessCard(t)}
      ${d.market_regime && d.market_regime.overheat
        ? `<div class="regime-banner">
            <span>${RV.ui.icon('triangle-exclamation', 'fa-xs')} 普涨过热日</span>
            <span>全市场上涨占比 ${(d.market_regime.breadth_up_ratio * 100).toFixed(0)}%（≥${(d.market_regime.threshold * 100).toFixed(0)}%）</span>
            <span>仅保留跑赢沪深300(${RV.fmt.pct(d.market_regime.benchmark_change)})的买入信号，${d.market_regime.downgraded_count} 只降为观望</span>
          </div>` : ''}
      <div class="idx-cards">${idxCards}</div>
      ${factorCards ? `<div class="idx-factor-grid">${factorCards}</div>` : ''}
    </div>`;

    // ===== 汇总卡片 =====
    const tempoCls = t.score >= 55 ? 'up' : (t.score < 40 ? 'down' : '');
    const summary = `
      <div class="summary-grid">
        <div class="summary-card" style="grid-column:span 2">
          <div class="icon">${RV.ui.icon('temperature-high')}</div>
          <div class="tempo" style="flex:1">
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:baseline">
                <span class="tempo-num ${tempoCls}">${t.score}</span>
                <span class="label" style="font-weight:700">${t.label}</span>
              </div>
              <div class="tempo-bar" style="margin-top:6px"><div class="tempo-fill" style="width:${t.score}%;background:${t.score >= 70 ? '#dc2626' : (t.score >= 55 ? '#d97706' : (t.score >= 40 ? '#2563eb' : '#16a34a'))}"></div></div>
            </div>
          </div>
        </div>
        ${RV.ui.summaryCard('scale-balanced', RV.fmt.pct(t.avg_change), '平均涨跌', RV.fmt.cls(t.avg_change))}
        ${RV.ui.summaryCard('arrow-trend-up', s.up, '上涨标的', 'up')}
        ${RV.ui.summaryCard('arrow-trend-down', s.down, '下跌标的', 'down')}
        ${t.market_total ? RV.ui.summaryCard('users', t.market_up + '<span class="unit">/' + t.market_total + '</span>', '全市场上涨', 'up') : ''}
        ${t.market_total ? RV.ui.summaryCard('bullseye', t.market_down + '<span class="unit">/↓</span>', '全市场下跌', 'down') : ''}
        ${RV.ui.summaryCard('bullseye', t.bull + '<span class="unit">/' + t.total + '</span>', '买入信号')}
      </div>`;

    // ===== 板块分组渲染（先按板块，点开展开股票） =====
    function groupBySector(items) {
      const groups = {};
      (items || []).forEach(r => {
        const sec = r.sector || '其他';
        (groups[sec] = groups[sec] || []).push(r);
      });
      // 板块内按买入推荐强度排序（买强在前），同级按评分降序
      Object.keys(groups).forEach(k => groups[k].sort((a, b) =>
        buyStrength(a) - buyStrength(b) || b.score - a.score));
      return groups;
    }

    // ===== 个股详细评分原因（'?' 弹层） =====
    function stockDetail(r) {
      const rows = [
        ['趋势', r.trend_status, 'MA5/MA10/MA20 排列，强势多头/多头排列加分，空头排列/强势空头大幅减分'],
        ['乖离MA5', RV.fmt.pct(r.bias_ma5), '偏离MA5 越近 0 越健康；正乖离 >5% 严禁追高，负乖离过大可分批低吸'],
        ['量能', r.volume_status + ' · 量比 ' + RV.fmt.num(r.volume_ratio, 2), '量比 >1.5 放量、<0.7 缩量；缩量回调最优，放量下跌最差'],
        ['支撑', (r.support_ma5 ? 'MA5✓ ' : 'MA5✗ ') + (r.support_ma10 ? 'MA10✓' : 'MA10✗'), '现价贴近期均线且获得支撑加 5 分/条，共 +' + ((r.support_ma5 ? 5 : 0) + (r.support_ma10 ? 5 : 0))],
        ['MACD', r.macd_status + ' · DIF ' + RV.fmt.num(r.macd_dif) + ' / DEA ' + RV.fmt.num(r.macd_dea), '零上金叉最优，死叉/下穿零轴最差；红绿柱方向提示动能'],
        ['RSI12', RV.fmt.num(r.rsi12, 1) + ' · ' + r.rsi_status, '>70 超买、<30 超卖；超卖加分，超买不得分'],
        ['综合分', r.score + ' → ' + r.signal, '六维求和：趋势+乖离+量能+支撑+MACD+RSI'],
        ['买卖点位', '买' + RV.fmt.num(r.ideal_buy) + '/' + RV.fmt.num(r.secondary_buy) + ' · 损' + RV.fmt.num(r.stop_loss) + ' · 盈' + RV.fmt.num(r.take_profit), 'MA5 理想买点、MA10 次优、MA20 止损、20日高点止盈'],
        ['资金流', r.fund_flow ? (mf(r.fund_flow.main_net) + ' · 5日' + mf(r.fund_flow.main_net_5d) + ' · 10日' + mf(r.fund_flow.main_net_10d)) : '暂无', '主力=超大单+大单；当日+近5/10日净流入，判断资金是否持续介入'],
      ];
      return rows.map(([k, v, d]) =>
        `<div class="it-row"><span class="k">${k}</span><span class="v">${v}</span></div>
         <div style="color:var(--text-2);font-size:11px;line-height:1.5;padding-bottom:4px">${d}</div>`).join('<hr>');
    }
    const stockDot = r => RV.ui.infoDot(stockDetail(r), r.name + ' · 评分原因');

    // ===== 资金流（2026-08 新增）：当日主力净流入 + 近5日/近10日累计 =====
    const mf = (v) => { if (v === null || v === undefined || isNaN(v)) return '--';
      const neg = v < 0, a = Math.abs(v);
      return (neg ? '-' : '+') + (a >= 1e8 ? (a / 1e8).toFixed(2) + '亿' : (a >= 1e4 ? (a / 1e4).toFixed(1) + '万' : a.toFixed(0))); };
    function fundFlowBadge(r) {
      const f = r.fund_flow;
      if (!f || f.main_net === null || f.main_net === undefined) return '';
      return `<span class="ff-badge ${RV.fmt.cls(f.main_net)}" title="主力=超大单+大单；近5日/10日累计${
        f.cum_source === 'sina_super' ? '（新浪超大单口径）' : ''}">${RV.ui.icon('water', 'fa-xs')} 主力${mf(f.main_net)}</span>`;
    }
    function fundFlowDetail(r) {
      const f = r.fund_flow;
      if (!f) return '';
      const row = (k, v, cls = '') => `<div class="it-row"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
      return row('主力净流入(当日)', mf(f.main_net) + ' · 占 ' + (f.main_ratio != null ? RV.fmt.pct(f.main_ratio) : '--'), RV.fmt.cls(f.main_net)) +
        row('超大单 / 大单', mf(f.super_net) + ' / ' + mf(f.big_net), RV.fmt.cls(f.super_net)) +
        row('中单 / 小单', mf(f.mid_net) + ' / ' + mf(f.small_net)) +
        row('近5日主力累计', mf(f.main_net_5d), RV.fmt.cls(f.main_net_5d)) +
        row('近10日主力累计', mf(f.main_net_10d), RV.fmt.cls(f.main_net_10d)) +
        (f.cum_source === 'sina_super' ? '<div style="color:var(--text-2);font-size:11px;padding-top:4px">近5/10日累计为超大单口径（新浪数据源备用）</div>' : '') +
        '<div style="color:var(--text-2);font-size:11px;padding-top:4px">主力 = 超大单 + 大单；正=净流入，负=净流出</div>';
    }

    function miniCards(items) {
      return `<div class="mini-cards">${items.map((r, i) => `
        <div class="mini-card">
          <div class="mini-head">
            <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${r.name} ${macroBadge(r.code)}</span>
            <span class="mini-head-right">${RV.ui.pctBadge(r.change_pct)} ${fundFlowBadge(r)} ${RV.ui.signalBadge(r.signal_key, r.signal)} ${stockDot(r)}</span>
          </div>
          <div class="mini-tags">
            <span class="date-tag">${r.date}</span>
            <span class="sec-chip">${r.sector || '其他'}</span>
            <span class="date-tag">${r.trend_status}</span>
            <span class="date-tag">${r.volume_status}</span>
          </div>
          <div class="mini-price">
            <span>现价 <b>${RV.fmt.num(r.close)}</b></span>
            <span>开盘 <b>${RV.fmt.num(r.open)}</b></span>
          </div>
          <div class="mini-score">
            <span class="score-num ${r.score >= 60 ? 'up' : (r.score < 40 ? 'down' : '')}">${r.score}</span>
            <div class="mini-score-bar">${RV.ui.progress(r.score)}</div>
          </div>
          <div class="mini-kv">
            <span class="k">MA5 / MA20</span><span class="v">${RV.fmt.num(r.ma5)} / ${RV.fmt.num(r.ma20)}</span>
            <span class="k">乖离MA5</span><span class="v ${RV.fmt.cls(r.bias_ma5)}">${RV.fmt.pct(r.bias_ma5)}</span>
            <span class="k">RSI12</span><span class="v">${RV.fmt.num(r.rsi12, 1)}</span>
            <span class="k">MACD</span><span class="v">${r.macd_status}</span>
            <span class="k">买点(MA5/10)</span><span class="v">${RV.fmt.num(r.ideal_buy)} / ${RV.fmt.num(r.secondary_buy)}</span>
            <span class="k">止损 / 止盈</span><span class="v">${RV.fmt.num(r.stop_loss)} / ${RV.fmt.num(r.take_profit)}</span>
          </div>
        </div>`).join('')}</div>`;
    }

    // 板块汇总详情（'?' 弹层）—— 结构化卡片布局
    function sectorDetail(sec, list) {
      const n = list.length;
      const up = list.filter(r => r.change_pct > 0).length;
      const down = n - up;
      const strongBuy = list.filter(r => r.signal_key === 'strong_buy').length;
      const buy = list.filter(r => r.signal_key === 'buy').length;
      const watch = list.filter(r => r.signal_key === 'watch').length;
      const reduce = list.filter(r => r.signal_key === 'reduce').length;
      const sell = list.filter(r => r.signal_key === 'sell').length;
      const buys = strongBuy + buy;
      const sells = reduce + sell;
      const strong = list.filter(r => r.trend_status === '强势多头' || r.trend_status === '多头排列').length;
      const avgScore = list.reduce((s, r) => s + r.score, 0) / n;
      const avgChg = list.reduce((s, r) => s + r.change_pct, 0) / n;
      const best = list.slice().sort((a, b) => b.score - a.score)[0];
      const worst = list.slice().sort((a, b) => a.score - b.score)[0];

      // 信号分布占比条
      const seg = (cnt, color) => cnt > 0
        ? `<span style="display:block;width:${(cnt / n * 100).toFixed(1)}%;background:${color};height:100%"></span>` : '';
      const distBar = `
        <div style="display:flex;height:8px;border-radius:99px;overflow:hidden;margin:4px 0 8px">
          ${seg(strongBuy, '#b91c1c')}${seg(buy, '#dc2626')}${seg(watch, '#d97706')}${seg(reduce, '#16a34a')}${seg(sell, '#059669')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-2);flex-wrap:wrap;gap:2px 8px">
          ${strongBuy ? `<span><i style="background:#b91c1c;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></i>强买 ${strongBuy}</span>` : ''}
          ${buy ? `<span><i style="background:#dc2626;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></i>买入 ${buy}</span>` : ''}
          ${watch ? `<span><i style="background:#d97706;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></i>观望 ${watch}</span>` : ''}
          ${reduce ? `<span><i style="background:#16a34a;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></i>减仓 ${reduce}</span>` : ''}
          ${sell ? `<span><i style="background:#059669;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></i>卖出 ${sell}</span>` : ''}
        </div>`;

      // 评分条（0-100）
      const scoreBar = `<div style="display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);margin:4px 0 6px"><div style="width:${Math.max(0, Math.min(100, avgScore))}%;background:${avgScore >= 70 ? '#dc2626' : (avgScore >= 55 ? '#d97706' : (avgScore >= 40 ? '#2563eb' : '#16a34a'))};height:100%"></div></div>`;

      // 涨跌/信号/趋势三块统计卡
      const statCard = (icon, title, val, sub, cls = '') => `
        <div style="flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center">
          <div style="font-size:10px;color:var(--text-2)">${title}</div>
          <div style="font-size:17px;font-weight:800;font-variant-numeric:tabular-nums" class="${cls}">${val}</div>
          <div style="font-size:10px;color:var(--text-2)">${sub}</div>
        </div>`;

      const head = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px">
          <span style="font-weight:800;font-size:14px">${sec}</span>
          <span class="${RV.fmt.cls(avgChg)}" style="font-weight:800;font-size:15px;font-variant-numeric:tabular-nums">${RV.fmt.pct(avgChg)}</span>
        </div>`;

      const statRow = `<div style="display:flex;gap:8px;margin-bottom:10px">
        ${statCard('', '标的数', n + ' 只', up + ' 涨 / ' + down + ' 跌')}
        ${statCard('', '平均评分', RV.fmt.num(avgScore, 1), '满分 100')}
        ${statCard('', '买入信号', buys + ' 只', '占 ' + (buys / n * 100).toFixed(0) + '%')}
      </div>`;

      const trendRow = `<div style="display:flex;gap:8px;margin-bottom:10px">
        ${statCard('', '多头排列', strong + ' 只', '强势+多头')}
        ${statCard('', '减仓/卖出', sells + ' 只', '弱信号')}
        ${statCard('', '波动', RV.fmt.pct(avgChg, 1), '平均涨跌')}
      </div>`;

      // 最强/最弱卡
      const pickCard = (r, tag) => r ? `
        <div style="display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px">
          <span style="font-size:11px;font-weight:700;color:var(--text-2);flex-shrink:0">${tag}</span>
          <span style="flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.name}</span>
          <span class="${RV.fmt.cls(r.change_pct)}" style="font-weight:700;font-variant-numeric:tabular-nums">${RV.fmt.pct(r.change_pct)}</span>
          <span style="font-size:12px;font-weight:800;font-variant-numeric:tabular-nums">${r.score}</span>
          ${RV.ui.signalBadge(r.signal_key, r.signal)}
        </div>` : '';

      const note = `<div style="font-size:10px;color:var(--text-2);line-height:1.6;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)">
        板块内按信号强弱（强买>买入>观望>减仓>卖出）排序，同级按评分降序；买入信号 = 强买 + 买入
      </div>`;

      return head + statRow + distBar + '<div style="font-size:11px;color:var(--text-2);margin-bottom:2px">评分分布：' +
        `强买${strongBuy} · 买入${buy} · 观望${watch} · 减仓${reduce} · 卖出${sell}` + '</div>' + scoreBar
        + '<div style="font-size:10px;color:var(--text-2);margin:2px 0 10px;display:flex;justify-content:space-between"><span>0</span><span>均分 ' + RV.fmt.num(avgScore, 1) + '</span><span>100</span></div>'
        + trendRow + pickCard(best, '最强') + pickCard(worst, '最弱') + note;
    }
    const sectorDot = (sec, list) => RV.ui.infoDot(sectorDetail(sec, list), '');

    function sectorSection(items, key) {
      const groups = groupBySector(items);
      // 板块按平均评分倒序（板块评分），同分按数量、名称
      const avgScore = arr => arr.reduce((s, r) => s + (r.score || 0), 0) / arr.length;
      const names = Object.keys(groups).sort((a, b) => {
        const sa = avgScore(groups[a]), sb = avgScore(groups[b]);
        return sb - sa || groups[b].length - groups[a].length || b.localeCompare(a, 'zh');
      });
      const secHtml = names.map(sec => {
        const list = groups[sec];
        const up = list.filter(r => r.change_pct > 0).length;
        const buys = list.filter(r => r.signal_key === 'buy' || r.signal_key === 'strong_buy').length;
        const top = list[0];
        return `
        <div class="sector-group" data-sec="${sec}">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${sec}</span>
            ${sectorMacroTag(sec)}
            ${sectorDot(sec, list)}
            <span class="sec-chip">${list.length}只</span>
            ${top ? RV.ui.signalBadge(top.signal_key, top.signal) : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('arrow-trend-up', 'fa-xs')} ${up} <span class="down">${RV.ui.icon('arrow-trend-down', 'fa-xs')} ${list.length - up}</span></span>
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 买${buys}</span>
              <span>最高分 <b>${top ? top.score : '--'}</b></span>
            </span>
          </div>
          <div class="sector-body">${miniCards(list)}</div>
        </div>`;
      }).join('');
      return `<div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>${key} · 按板块</h2></div>${secHtml}</div>`;
    }

    // ===== 详情卡片（整池，供展开时查看） =====
    function cards(items) {
      return items.map(r => `
      <div class="card">
        <div class="card-header">
          <div><span class="card-title">${r.name}</span> <span class="date-tag">${r.date}</span> <span class="sec-chip">${r.sector || '其他'}</span></div>
          <span style="display:inline-flex;align-items:center;gap:8px">${RV.ui.signalBadge(r.signal_key, r.signal)} ${stockDot(r)}</span>
        </div>
        <div class="card-summary">
          <span class="cs-item"><i>分数</i><b class="${r.score >= 60 ? 'up' : (r.score < 40 ? 'down' : '')}">${r.score}</b></span>
          <span class="cs-item"><i>现价</i><b>${RV.fmt.num(r.close)}</b></span>
          <span class="cs-item"><i>开盘</i><b>${RV.fmt.num(r.open)}</b></span>
          <span class="cs-item"><i>涨幅</i><b class="${RV.fmt.cls(r.change_pct)}">${RV.fmt.pct(r.change_pct)}</b></span>
        </div>
        <div class="card-detail">
        <div class="score-ring">
          <span class="score-num ${r.score >= 60 ? 'up' : (r.score < 40 ? 'down' : '')}">${r.score}</span>
          <div style="flex:1">${RV.ui.progress(r.score)}</div>
          ${RV.ui.pctBadge(r.change_pct)}
        </div>
        <div class="card-kv">
          <span class="k">收盘</span><span class="v">${RV.fmt.money(r.close)}</span>
          <span class="k">趋势</span><span class="v">${r.trend_status}</span>
          <span class="k">MA5 / MA20</span><span class="v">${RV.fmt.num(r.ma5)} / ${RV.fmt.num(r.ma20)}</span>
          <span class="k">乖离MA5</span><span class="v ${RV.fmt.cls(r.bias_ma5)}">${RV.fmt.pct(r.bias_ma5)}</span>
          <span class="k">支撑 / 压力</span><span class="v">${RV.fmt.num(r.support)} / ${RV.fmt.num(r.resistance)}</span>
          <span class="k">MACD</span><span class="v">${r.macd_status}</span>
        </div>
        ${r.fund_flow ? `
        <div class="fund-flow-line" style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px">
          <span>主力 <b class="${RV.fmt.cls(r.fund_flow.main_net)}">${mf(r.fund_flow.main_net)}</b></span>
          <span>超大单 <b class="${RV.fmt.cls(r.fund_flow.super_net)}">${mf(r.fund_flow.super_net)}</b></span>
          <span>大单 <b class="${RV.fmt.cls(r.fund_flow.big_net)}">${mf(r.fund_flow.big_net)}</b></span>
          <span>近5日 <b class="${RV.fmt.cls(r.fund_flow.main_net_5d)}">${mf(r.fund_flow.main_net_5d)}</b></span>
          <span>近10日 <b class="${RV.fmt.cls(r.fund_flow.main_net_10d)}">${mf(r.fund_flow.main_net_10d)}</b></span>
        </div>` : ''}
        <div class="points">
          <div class="point"><span class="p-label">理想买点(MA5)</span><span class="p-val">${RV.fmt.num(r.ideal_buy)}</span></div>
          <div class="point"><span class="p-label">次优买点(MA10)</span><span class="p-val">${RV.fmt.num(r.secondary_buy)}</span></div>
          <div class="point"><span class="p-label">止损(MA20)</span><span class="p-val">${RV.fmt.num(r.stop_loss)}</span></div>
          <div class="point"><span class="p-label">止盈(前高)</span><span class="p-val">${RV.fmt.num(r.take_profit)}</span></div>
        </div>
        </div>
      </div>`).join('');
    }

    // ===== 自选 / 大盘 Tab =====
    let tab = 'watch';
    let page = 0;
    const PAGE_SIZE = 10;
    const pageItems = () => tab === 'watch' ? d.items : (d.market_items || []);
    const pageCount = () => Math.max(1, Math.ceil(pageItems().length / PAGE_SIZE));

    const cardSec = () => {
      const all = pageItems();
      const paged = all.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      const pageNav = `
        <div class="pagination">
          <button class="pg-btn ${page <= 0 ? 'disabled' : ''}" data-pg="prev">${RV.ui.icon('chevron-left', 'fa-xs')} 上一页</button>
          <span class="pg-info">第 ${page + 1} / ${pageCount()} 页 · 共 ${all.length} 只</span>
          <button class="pg-btn ${page >= pageCount() - 1 ? 'disabled' : ''}" data-pg="next">下一页 ${RV.ui.icon('chevron-right', 'fa-xs')}</button>
        </div>`;
      return `<div class="section" data-nav="详情卡片" data-nav-icon="id-card"><div class="section-title"><span class="title-icon">${RV.ui.icon('id-card')}</span><h2>${tab === 'watch' ? '自选股' : '大盘'} · 详情卡片</h2></div>
        ${pageNav}
        <div class="cards">${cards(paged)}</div>
        ${pageNav}</div>`;
    };

    function render() {
      const tabs = `
        <div class="section">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('table-columns')}</span><h2>模块</h2></div>
          <div class="nav" style="justify-content:flex-start;margin-top:0">
            <a href="#" class="nav-link ${tab === 'watch' ? 'active' : ''}" data-tab="watch">${RV.ui.icon('list-check')} 自选（${d.items.length}只）</a>
            <a href="#" class="nav-link ${tab === 'market' ? 'active' : ''}" data-tab="market">${RV.ui.icon('globe')} 大盘（${(d.market_items||[]).length}只）</a>
          </div>
        </div>`;
      const items = pageItems();
      app.innerHTML = RV.ui.header(`${d.market}每日复盘`, '趋势 · 评分 · 买卖点位 · 板块分组', 'review', d.generatedAt)
        + indicesHtml + `<div class="section" data-nav="温度总览" data-nav-icon="temperature-high">${summary}</div>` + tabs
        + `<div data-nav="按板块" data-nav-icon="layer-group">${sectorSection(items, tab === 'watch' ? '自选股' : '大盘')}</div>`
        + cardSec()
        + '<footer>数据口径：MA5/10/20/60 · MACD(12,26,9) · RSI(6,12,24) · 点击板块展开/收起 · 仅供学习研究，不构成投资建议</footer>';      // 板块展开/收起
      RV.ui.initSidebar();
      // 大盘指数卡点击：弹出技术详情弹窗（与推荐页一致）
      function openIdxModal(idx) {
        const src = app.querySelector(`.idx-factor-card[data-i="${idx}"]`);
        if (!src) return;
        const idxObj = (d.indices || [])[idx];
        const body = src.innerHTML;
        const overlay = document.createElement('div');
        overlay.className = 'idx-modal-overlay';
        overlay.innerHTML = `<div class="idx-modal">
          <div class="idx-modal-head">
            <span class="idx-m-name">${RV.ui.icon('chart-line', 'fa-xs')} ${idxObj ? idxObj.name : ''}</span>
            <span class="idx-m-price ${idxObj ? RV.fmt.cls(idxObj.change_pct) : ''}">${idxObj ? RV.fmt.num(idxObj.close) + ' ' + RV.fmt.pct(idxObj.change_pct) : ''}</span>
            <button class="idx-modal-close" aria-label="关闭">${RV.ui.icon('xmark')}</button>
          </div>
          <div class="idx-modal-body">${body}</div>
        </div>`;
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';
        const close = () => { overlay.remove(); document.body.style.overflow = ''; };
        overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
        overlay.querySelector('.idx-modal-close').addEventListener('click', close);
        const esc = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } };
        document.addEventListener('keydown', esc);
      }
      app.querySelectorAll('.idx-card[data-i]').forEach(c => {
        c.addEventListener('click', () => openIdxModal(c.getAttribute('data-i')));
      });
      app.querySelectorAll('.sector-group').forEach(g => {
        g.querySelector('.sector-header').addEventListener('click', ev => {
          if (ev.target.closest('.info-dot')) return;
          g.classList.toggle('open');
        });
      });
      app.querySelectorAll('.pg-btn').forEach(b => b.addEventListener('click', ev => {
        ev.preventDefault();
        if (b.classList.contains('disabled')) return;
        page += b.getAttribute('data-pg') === 'next' ? 1 : -1;
        page = Math.max(0, Math.min(pageCount() - 1, page));
        render();
      }));
      app.querySelectorAll('.nav-link[data-tab]').forEach(a => a.addEventListener('click', ev => {
        ev.preventDefault();
        tab = a.getAttribute('data-tab');
        page = 0;
        render();
      }));
    }
    render();
  } catch (e) {
    app.innerHTML = RV.ui.header('每日复盘', '', 'review') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

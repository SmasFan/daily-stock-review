<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网格回测 · 复盘</title>
<link rel="stylesheet" href="assets/css/common.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* 选择目标：侧边栏（桌面固定右侧，窄屏转顶部横向滚动） */
  .bt-sidebar { position:fixed; right:14px; top:50%; transform:translateY(-50%); width:176px; max-height:72vh;
    display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); z-index:50; padding:8px; }
  .bt-sidebar .bt-title { font-size:11px; color:var(--text-2); font-weight:700; padding:4px 8px 8px;
    display:flex; align-items:center; gap:6px; }
  .bt-sidebar .bt-list { overflow-y:auto; min-height:0; }
  .bt-sidebar a { display:block; font-size:12px; padding:6px 8px; border-radius:8px; color:var(--text);
    text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bt-sidebar a:hover { background:var(--surface-2); }
  .bt-sidebar a.active { background:var(--accent); color:#fff; }
  @media (max-width:1180px) {
    .bt-sidebar { position:static; transform:none; width:auto; max-height:none; display:block; margin-bottom:14px; }
    .bt-sidebar .bt-list { display:flex; flex-wrap:nowrap; overflow-x:auto; gap:6px; padding-bottom:4px; }
    .bt-sidebar a { flex-shrink:0; background:var(--surface-2); }
    .bt-sidebar a.active { background:var(--accent); }
  }
  /* 折叠区块 */
  .bt-collapse-btn { border:1px solid var(--border); background:var(--surface-2); color:var(--accent);
    border-radius:8px; padding:5px 14px; font-size:12px; font-weight:700; cursor:pointer; margin-top:10px; }
  .bt-collapse-btn:hover { background:#f1e4d8; }
  .bt-hidden { display:none; }
  /* 调仓记录 */
  .trade-noop td { color:var(--text-2); }
  /* 周期切换按钮 */
  .bt-range { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .bt-range-btn { border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .bt-range-btn:hover { background:#f1e4d8; }
  .bt-range-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* 区间收益：基准对照小字 */
  .bt-bm { display:block; font-size:10px; font-weight:600; color:var(--text-2); margin-top:2px; }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js?v=2"></script>
<script src="assets/js/rvui.js?v=2"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.backtest();            // 索引：summary + window_returns + overall（小文件，秒开）
    const meta = d.stocks || {};                   // name -> {summary, window_returns, price_only}
    const names = Object.keys(meta);
    let selected = names[0] || null;
    const detailCache = {};                        // name -> 完整单只数据（图表/调仓，按需加载）
    async function loadDetail(name) {
      if (!detailCache[name]) detailCache[name] = await RV.API.backtestStock(name);
      return detailCache[name];
    }
    // 折叠状态：区间收益展开数 / 调仓记录是否全量
    let retShowAll = false;
    let tradeShowAll = false;
    const RET_SHOW = 5;           // 区间收益默认显示前 5 只
    const TRADE_DEFAULT_DAYS = 5; // 调仓记录默认最近一周（5 个交易日）

    // ===== 侧边栏：选择目标 =====
    function targetSidebar() {
      const links = names.map(n => `<a href="#" class="${selected === n ? 'active' : ''}" data-k="${n}">${n}</a>`).join('');
      return `<div class="bt-sidebar">
        <div class="bt-title">${RV.ui.icon('bullseye', 'fa-xs')} 选择目标（${names.length}）</div>
        <div class="bt-list">${links}</div>
      </div>`;
    }

    // ===== 区间收益：默认显示 5 只，其余折叠 =====
    const WINDOWS = ['1周', '1月', '半年', '1年', '3年', '5年'];
    function returnTable() {
      const visible = retShowAll ? names : names.slice(0, RET_SHOW);
      const rows = visible.map(name => {
        const s = meta[name];
        const wr = s.window_returns || {};
        return `<tr>
          <td>${name}${s.price_only ? '<span class="sec-chip" style="margin-left:6px">价格锚</span>' : ''}</td>
          ${WINDOWS.map(w => {
            const wrw = wr[w] || {};
            const r = wrw.strategy, b = wrw.benchmark;
            if (r == null) return '<td style="color:var(--text-2)">--</td>';
            const cls = b == null ? '' : (r > b ? 'up' : (r < b ? 'down' : 'neutral'));
            return `<td><span class="${RV.fmt.cls(r)}">${RV.fmt.pct(r * 100, 1)}</span>${b == null ? '' : `<span class="bt-bm ${cls}">基准 ${RV.fmt.pct(b * 100, 1)}</span>`}</td>`;
          }).join('')}
        </tr>`;
      }).join('');
      const rest = names.length - RET_SHOW;
      const btn = names.length > RET_SHOW
        ? `<button class="bt-collapse-btn" id="bt-ret-toggle">${retShowAll ? RV.ui.icon('chevron-up', 'fa-xs') + ' 收起（显示前' + RET_SHOW + '只）' : RV.ui.icon('chevron-down', 'fa-xs') + ' 展开全部 ' + names.length + ' 只（默认显示前' + RET_SHOW + '只）'}</button>`
        : '';
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-column')}</span><h2>绩效汇总 · 区间收益</h2><span class="sec-chip">${names.length}只 · 默认显示${RET_SHOW}只</span></div>
        <div class="ret-table-wrap"><table class="ret-table">
          <thead><tr><th>标的</th>${WINDOWS.map(w => `<th>最近${w}</th>`).join('')}</tr></thead>
          <tbody>${rows}${retShowAll ? '' : (rest > 0 ? `<tr class="bt-hidden-marker"><td colspan="${WINDOWS.length + 1}" style="color:var(--text-2);text-align:center;padding:10px">… 还有 ${rest} 只已折叠 …</td></tr>` : '')}</tbody>
        </table></div>
        ${btn}
        <div style="font-size:12px;color:var(--text-2);margin-top:8px">${RV.ui.icon('arrows-left-right', 'fa-xs')} 左列固定，可左右滑动查看不同时间段收益；绿色=策略跑赢基准，红色=跑输基准，主数字=策略收益，下方小字=买入持有基准。</div>
      </div>`;
    }

    // ===== 调仓记录：默认最近一周，可展开全部 =====
    function dailyLog(stock) {
      const dates = stock.dates || [];
      const positions = stock.position || [];
      const devs = stock.dev || [];
      const tmap = {};
      (stock.trades || []).forEach(t => { tmap[t.date] = t; });
      const seen = {};
      return dates.map((d, i) => {
        if (seen[d]) return null;
        seen[d] = true;
        const t = tmap[d];
        if (t) return { ...t, noop: false };
        const pos = positions[i];
        return { date: d, side: 'hold', pos_before: pos, pos_after: pos, amount: 0, dev: devs[i], grid_idx: null, noop: true };
      }).filter(r => r && (r.pos_before != null || !r.noop));
    }

    function tradesSection(stock) {
      if (!stock || !stock.trades || !stock.trades.length) return '';
      const log = dailyLog(stock);
      const shown = tradeShowAll ? log.length : Math.min(TRADE_DEFAULT_DAYS, log.length);
      const rows = log.slice(-shown).reverse().map(t => {
        if (t.noop) return `
        <tr class="trade-noop">
          <td><span class="date-tag">${t.date}</span></td>
          <td><span class="signal-badge s-watch">${RV.ui.icon('minus', 'fa-xs')} 持有不动</span></td>
          <td style="font-weight:700;color:var(--text-2)">--</td>
          <td>${t.pos_before != null ? RV.fmt.num(t.pos_before * 100, 1) + '%' : '--'}</td>
          <td>${t.dev != null ? '偏离 ' + RV.fmt.pct(t.dev * 100, 2) : '--'}</td>
          <td>--</td>
        </tr>`;
        return `
        <tr>
          <td><span class="date-tag">${t.date}</span></td>
          <td><span class="signal-badge ${t.side === 'buy' ? 's-buy' : 's-sell'}">${t.side === 'buy' ? RV.ui.icon('cart-plus') + ' 买入' : RV.ui.icon('cart-shopping') + ' 卖出'}</span></td>
          <td style="font-weight:700">${RV.fmt.pct(t.amount * 100)}</td>
          <td>${RV.fmt.num(t.pos_before * 100, 1)}% → ${RV.fmt.num(t.pos_after * 100, 1)}%</td>
          <td>偏离 ${RV.fmt.pct(t.dev * 100, 2)}</td>
          <td>档位 ${t.grid_idx}</td>
        </tr>`;
      }).join('');
      const btn = log.length > TRADE_DEFAULT_DAYS
        ? `<button class="bt-collapse-btn" id="bt-trade-toggle">${tradeShowAll ? RV.ui.icon('chevron-up', 'fa-xs') + ' 收起（默认最近一周）' : RV.ui.icon('chevron-down', 'fa-xs') + ' 展开全部 ' + log.length + ' 条记录'}</button>`
        : '';
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('receipt')}</span><h2>调仓记录 · ${selected}</h2><span class="sec-chip">${tradeShowAll ? log.length + '条（全部）' : '最近一周（' + shown + '条）'}</span></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>日期</th><th>方向</th><th>调仓比例</th><th>仓位变化</th><th>偏离度</th><th>网格档</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        ${btn}
      </div>`;
    }

    // ===== 净值图表：网格净值+基准+收盘价+估值锚+仓位副图+买卖点，默认最近1个月、可拉到3年 =====
    const chartPool = [];
    const RANGES = [['近1月', 22], ['近3月', 66], ['近6月', 132], ['近1年', 250], ['全部', 0]];
    function eqChart(stock, id) {
      const eq = stock.equity || [], bench = stock.benchmark || [], dates = stock.dates || [];
      const close = stock.close || [], pos = stock.position || [], anchor = stock.anchor || [];
      const trades = stock.trades || [];
      if (eq.length < 2) return '';
      const wrapId = 'eq-' + id + '-' + Math.random().toString(36).slice(2, 7);
      const btnId = 'rg-' + id + '-' + Math.random().toString(36).slice(2, 7);
      const idxMap = {};
      dates.forEach((dd, i) => { idxMap[dd] = i; });
      const marks = trades.filter(t => t.price != null && t.date in idxMap);
      const buyPts = marks.filter(t => t.side === 'buy').map(t => [dates.indexOf(t.date), t.price, t.date]);
      const sellPts = marks.filter(t => t.side === 'sell').map(t => [dates.indexOf(t.date), t.price, t.date]);
      // 默认时间轴：最近一个月（约 22 个交易日），按钮/滑块可切换与回拉
      const LOOKBACK = 22;
      const startPct = Math.max(0, (dates.length - LOOKBACK) / dates.length * 100);
      const anchorLine = {
        name: '估值锚', type: 'line', data: anchor, yAxisIndex: 1, showSymbol: false,
        lineStyle: { width: 1, color: '#f59e0b', type: 'dashed', opacity: 0.7 },
        itemStyle: { color: '#f59e0b' }, tooltip: { show: false }
      };
      const rangeBtns = RANGES.map(([label, days], i) =>
        `<button class="bt-range-btn ${i === 0 ? 'active' : ''}" data-i="${i}" data-days="${days}">${label}</button>`).join('');
      const setZoom = (chart, days) => {
        const start = days > 0 ? Math.max(0, (dates.length - days) / dates.length * 100) : 0;
        chart.setOption({ dataZoom: [{ start, end: 100 }, { start, end: 100 }] });
      };
      const opt = {
        animation: false,
        tooltip: {
          trigger: 'axis', axisPointer: { type: 'cross' },
          formatter(params) {
            const i = params[0].dataIndex;
            const dt = dates[i] || '';
            const eqV = eq[i] != null ? eq[i].toFixed(3) : '--';
            const bmV = bench[i] != null ? bench[i].toFixed(3) : '--';
            const px = close[i] != null ? close[i].toFixed(2) : '--';
            const pv = pos[i] != null ? (pos[i] * 100).toFixed(1) + '%' : '--';
            let lines = [`<b>${dt}</b>`, `网格净值: <b>${eqV}</b>`, `基准(持有): ${bmV}`, `收盘价: ${px}`, `仓位: ${pv}`];
            if (anchor[i] != null) lines.push(`估值锚: ${anchor[i].toFixed(2)}（偏离 ${dev[i] != null ? (dev[i] * 100).toFixed(1) + '%' : '--'}）`);
            const t = marks.find(x => x.date === dt);
            if (t) lines.push(t.side === 'buy' ? '🟢 买入 @ ' + t.price : '🔴 卖出 @ ' + t.price);
            return lines.join('<br/>');
          }
        },
        legend: { data: ['网格策略', '买入持有', '估值锚'], textStyle: { color: '#6b6258' } },
        grid: [
          { left: 70, right: 74, top: 36, height: '52%' },
          { left: 70, right: 74, top: '72%', height: '14%' }
        ],
        dataZoom: [
          { type: 'inside', xAxisIndex: [0, 1], start: startPct, end: 100 },
          { type: 'slider', xAxisIndex: [0, 1], height: 16, bottom: 8, start: startPct, end: 100 }
        ],
        xAxis: [
          { type: 'category', data: dates, boundaryGap: false, axisLabel: { color: '#6b6258', formatter: v => v.slice(0, 7) }, axisLine: { lineStyle: { color: '#d1c9bf' } } },
          { type: 'category', gridIndex: 1, data: dates, axisLabel: { show: false }, axisLine: { show: false } }
        ],
        yAxis: [
          { type: 'value', name: '净值', scale: true, axisLabel: { color: '#6b6258' }, splitLine: { lineStyle: { color: '#efe9df' } } },
          { type: 'value', name: '价格', scale: true, axisLabel: { color: '#b0a89d' }, splitLine: { show: false } },
          { gridIndex: 1, name: '仓位', min: 0, max: 1, axisLabel: { color: '#9ca3af', formatter: v => (v * 100).toFixed(0) + '%' }, splitLine: { show: false } }
        ],
        series: [
          {
            name: '网格策略', type: 'line', data: eq, showSymbol: false,
            lineStyle: { width: 2.2, color: '#c78d5a' },
            areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
              colorStops: [{ offset: 0, color: 'rgba(199,141,90,0.28)' }, { offset: 1, color: 'rgba(199,141,90,0.02)' }] } }
          },
          {
            name: '买入持有', type: 'line', data: bench, showSymbol: false,
            lineStyle: { width: 1.6, color: '#9ca3af' }, itemStyle: { color: '#9ca3af' }
          },
          {
            name: '收盘价', type: 'line', data: close, yAxisIndex: 1, showSymbol: false,
            lineStyle: { width: 1, color: '#d6cbbd', opacity: 0.8 }, itemStyle: { color: '#d6cbbd' },
            tooltip: { show: false }
          },
          anchorLine,
          {
            name: '仓位', type: 'line', xAxisIndex: 1, yAxisIndex: 2, data: pos, showSymbol: false,
            lineStyle: { width: 1.4, color: '#60a5fa' }, itemStyle: { color: '#60a5fa' },
            areaStyle: { color: 'rgba(96,165,250,0.12)' }
          },
          {
            name: '买入', type: 'scatter', data: buyPts, symbol: 'triangle', symbolSize: 10,
            itemStyle: { color: '#16a34a' }, xAxisIndex: 0, yAxisIndex: 1
          },
          {
            name: '卖出', type: 'scatter', data: sellPts, symbol: 'triangle', symbolRotate: 180, symbolSize: 10,
            itemStyle: { color: '#dc2626' }, xAxisIndex: 0, yAxisIndex: 1
          }
        ]
      };
      setTimeout(() => {
        const el = document.getElementById(wrapId);
        if (el && window.echarts) {
          const chart = echarts.init(el);
          chart.setOption(opt);
          chartPool.push(chart);
          window.addEventListener('resize', () => chart.resize());
          const btnBox = document.getElementById(btnId);
          if (btnBox) btnBox.querySelectorAll('.bt-range-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              btnBox.querySelectorAll('.bt-range-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              setZoom(chart, parseInt(btn.dataset.days || '0', 10));
            });
          });
        }
      }, 0);
      return `<div class="bt-range" id="${btnId}">${rangeBtns}</div><div id="${wrapId}" style="width:100%;height:440px"></div>`;
    }

    function strategyExplain() {
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('book-open')}</span><h2>回测说明 · 买卖触发规则</h2></div>
        <div style="font-size:13px;line-height:2;color:var(--text)">
          <p>${RV.ui.icon('scale-balanced', 'fa-xs')} <b>均值线（估值锚）</b>：PE40分位 / PB60分位 / ROE60分位 加权几何平均得到"合理估值中枢"；无估值数据时退化为价格均线（<i>价格锚</i>）。偏离度 = 收盘价 ÷ 均值线 − 1。</p>
          <p>${RV.ui.icon('cart-plus', 'fa-xs')} <b>买入（下跌分批）</b>：每跌 <b>0.5%</b> 一档，按 <b>1.04%</b> 仓位加仓（向下摊低成本）；偏离 ≤ <b>−5%</b> 进入<b>半永久锁仓</b>，继续加仓至最大仓位。</p>
          <p>${RV.ui.icon('cart-shopping', 'fa-xs')} <b>卖出（上涨分批）</b>：每涨 <b>0.5%</b> 一档，按 <b>1%</b> 仓位减仓（向上兑现收益）；偏离 ≥ <b>+5%</b> 视为<b>超涨清仓</b>。</p>
          <p>${RV.ui.icon('bullseye', 'fa-xs')} <b>目标仓位</b>：均衡 70% − 斜率 × 偏离度，仓位区间自动收窄在 [最小, 最大]；偏离越大仓位越低。</p>
          <p>${RV.ui.icon('receipt', 'fa-xs')} <b>成本</b>：单边手续费 0.05%；收益已含日股息；基准 = 满仓买入持有（含分红再投资）。</p>
        </div>
      </div>`;
    }

    // ===== 绩效指标卡：summary 里的核心指标 =====
    function perfCards(stock) {
      const s = stock.summary || {};
      if (!s || s.total_return == null) return '';
      const cls = v => RV.fmt.cls(v);
      const cards = [
        RV.ui.metric(RV.fmt.pct(s.total_return * 100, 1), '总收益', cls(s.total_return), 'arrow-trend-up'),
        RV.ui.metric(RV.fmt.pct(s.annual_return * 100, 2), '年化收益', cls(s.annual_return), 'percent'),
        RV.ui.metric(s.sharpe != null ? RV.fmt.num(s.sharpe, 2) : '--', '夏普比率', s.sharpe > 0 ? 'up' : 'down', 'gauge-high'),
        RV.ui.metric(RV.fmt.pct(s.max_drawdown * 100, 1), '最大回撤', 'down', 'arrow-trend-down'),
        RV.ui.metric(s.calmar != null ? RV.fmt.num(s.calmar, 2) : '--', '卡玛比率', s.calmar > 0 ? 'up' : 'down', 'scale-balanced'),
        RV.ui.metric(RV.fmt.pct(s.excess_return * 100, 2), '超额收益', cls(s.excess_return), 'chart-line'),
        RV.ui.metric(RV.fmt.pct(s.benchmark_return * 100, 1), '基准总收益', cls(s.benchmark_return), 'seedling'),
        RV.ui.metric(s.trade_count != null ? RV.fmt.num(s.trade_count, 0) : '--', '交易次数', '', 'repeat'),
      ];
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('gauge-high')}</span><h2>绩效指标 · ${selected}</h2><span class="sec-chip">${s.years != null ? '回测 ' + RV.fmt.num(s.years, 1) + ' 年' : ''} · 平均仓位 ${s.avg_position != null ? RV.fmt.num(s.avg_position * 100, 0) + '%' : '--'} · 网格步长 ${s.grid_step != null ? RV.fmt.pct(s.grid_step * 100, 2) : '--'}</span></div>
        <div class="metric-grid">${cards.join('')}</div>
        <div style="font-size:12px;color:var(--text-2);margin-top:8px">${RV.ui.icon('circle-info', 'fa-xs')} 夏普/卡玛比率 &gt; 1 为良好；基准=满仓买入持有。指标基于回测区间，仅供参考。</div>
      </div>`;
    }

    async function render() {
      const st = selected ? meta[selected] : null;   // 摘要（索引）
      const stock = selected ? await loadDetail(selected) : null;  // 完整数据（按需）
      app.innerHTML = RV.ui.header('网格回测', '均衡偏低均值线 + 不对称网格（移植自 dividend_grid_strategy）', 'backtest', d.generatedAt)
        + targetSidebar()
        + (stock ? tradesSection(stock) : '')
        + (stock && stock.equity && stock.equity.length > 1
            ? `<div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('chart-line')}</span><h2>净值曲线 · ${selected}</h2><span class="sec-chip">默认近1月 · 可切换近1年/全部</span></div>${eqChart(stock, 'eq')}<div style="font-size:12px;color:var(--text-2);margin-top:8px">${RV.ui.icon('location-crosshairs', 'fa-xs')} 橙色虚线=估值锚（均值线），收盘价偏离锚点越远，网格买卖档位越密集。</div></div>` : '')
        + perfCards(st)
        + returnTable()
        + strategyExplain()
        + '<footer>口径：均值线=PE40分位/PB60分位/ROE60分位加权几何平均（缺因子自动归一，无估值用价格锚）· 网格每0.5%一档，涨抛1%跌买1.04% · 半永久锁仓(偏离≤-5%锁定,≥+5%清仓) · 单边成本0.05% · 收益含日股息 · 基准=满仓买入持有 · 不构成投资建议</footer>';

      // 侧边栏选择目标
      app.querySelectorAll('.bt-sidebar a[data-k]').forEach(a => a.addEventListener('click', ev => {
        ev.preventDefault();
        selected = a.getAttribute('data-k') || null;
        retShowAll = false; tradeShowAll = false;
        render();
      }));
      // 区间收益展开/收起
      const retToggle = document.getElementById('bt-ret-toggle');
      if (retToggle) retToggle.addEventListener('click', () => { retShowAll = !retShowAll; render(); });
      // 调仓记录展开/收起
      const tradeToggle = document.getElementById('bt-trade-toggle');
      if (tradeToggle) tradeToggle.addEventListener('click', () => { tradeShowAll = !tradeShowAll; render(); });
    }

    render();
  } catch (e) {
    app.innerHTML = RV.ui.header('网格回测', '', 'backtest') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

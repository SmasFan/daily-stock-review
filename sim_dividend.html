<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>红利低波池 · 实时模拟</title>
<link rel="stylesheet" href="assets/css/common.css?v=4">
<link rel="stylesheet" href="assets/css/smasfx.css?v=1">
<script src="assets/js/common.js?v=3"></script>
<script src="assets/js/smasfx-nav.js?v=1"></script>
<script src="assets/js/echarts.min.js"></script>
<style>
:root{--line:#e3e6ea;--bg:#f2f3f5;--ink:#16181d;--dim:#8a929e;--up:#c62828;--down:#1b7f3b;--gold:#b8860b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header.top{padding:12px 20px;margin-bottom:12px}
header.top h1{font-size:21px;margin:0}
.gen-time{margin-top:4px;font-size:11.5px;color:var(--dim)}
.nav{margin-top:9px;gap:6px}
.nav-link{padding:5px 12px;font-size:12px}
#content{max-width:1400px;margin:0 auto;padding:0 18px 40px}
.ps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.ps .lbl{font-size:11.5px;color:var(--dim);margin-right:4px}
.ps-btn{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:12px;cursor:pointer}
.ps-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ps .upd{margin-left:auto;font-size:11px;color:var(--dim)}
.sec{background:#fff;border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:12px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.sec-t .hint{font-size:11px;color:var(--dim);font-weight:400}
.hero{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;border:1px solid var(--line);background:#fff;border-radius:2px;margin-bottom:12px}
.hero>div{padding:13px 16px;border-right:1px solid var(--line)}
.hero>div:last-child{border-right:0}
.hero .lab{font-size:11px;color:var(--dim);margin-bottom:5px}
.hero .big{font-size:25px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.hero .big small{font-size:13px;font-weight:400;color:var(--dim);margin-left:3px}
.hero .sub{font-size:11.5px;color:var(--dim);margin-top:5px}
.pcl{color:var(--up)} .ncl{color:var(--down)} .zcl{color:var(--dim)}
.holds{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;border:1px solid var(--line);background:#fafbfc;border-radius:2px;padding:3px 7px;white-space:nowrap}
.chip b{font-weight:600;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid #eef0f2;white-space:nowrap}
th{font-size:11px;color:var(--dim);font-weight:500;background:#fafbfc;text-align:right}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10.5px;border:1px solid var(--line);color:var(--dim);background:#fafbfc}
.badge.wait{color:var(--up);border-color:#f0c9c9;background:#fff7f7}
.badge.full{color:var(--dim)}
.badge.lot{color:#1d5fa8;border-color:#c8dcf0;background:#f5f9ff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:0 0 12px}
.kpi{background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:2px}
.kpi .k{font-size:10.5px;color:var(--dim)} .kpi .v{font-size:16px;font-weight:600;margin-top:3px}
.chart-box{height:230px}
details.fold{background:#fff;border:1px solid var(--line);border-radius:2px;margin-bottom:12px}
details.fold>summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:600;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";display:inline-block;margin-right:7px;color:var(--dim)}
details.fold[open]>summary::before{content:"▾"}
details.fold .fold-body{padding:0 14px 14px}
.note{font-size:11.5px;color:var(--dim);line-height:1.7}
.note b{color:var(--ink);font-weight:600}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}
.rule div{border:1px solid var(--line);padding:8px 10px;background:#fafbfc;font-size:11.5px}
.rule b{display:block;font-size:12px;margin-bottom:3px}
@media(max-width:900px){.hero{grid-template-columns:1fr 1fr}.hero>div{border-bottom:1px solid var(--line)}}
@media(max-width:480px){.hero{grid-template-columns:1fr}.hero .big{font-size:21px}#content{padding:0 10px 30px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="content"><div class="sec">数据加载中...</div></div>
<script>
let S=null, chart=null;
const $=s=>document.querySelector(s);
const nf=(v,d=2)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=2)=>v==null||isNaN(v)?'—':(v>=0?'+':'')+Number(v).toFixed(d)+'%';
const cls=v=>v==null||Math.abs(v)<1e-9?'zcl':(v>0?'pcl':'ncl');
const money=v=>'¥'+nf(v,0);
function eqOf(){return S.cash+S.positions.reduce((a,p)=>a+p.shares*(p.last||p.avg),0)}
function curve(){return S.equity_curve||[]}
function todayRet(){const c=curve();if(c.length<2)return 0;return (c.at(-1).equity/c.at(-2).equity-1)*100}
function mdd(){const c=curve();let pk=-1e9,m=0;for(const p of c){pk=Math.max(pk,p.equity);m=Math.max(m,(pk-p.equity)/pk)}return m*100}
function posVal(){return S.positions.reduce((a,p)=>a+p.shares*(p.last||p.avg),0)}
function floatPnl(){return S.positions.reduce((a,p)=>a+(p.last-p.avg)*p.shares,0)}
function posRows(){
  const ps=S.positions||[];
  if(!ps.length)return '<div class="note" style="padding:10px 0">当前空仓，等待回踩买点触发。</div>';
  const pl={};for(const p of S.plan||[])pl[p.code]=p;
  return '<div class="tw"><table><thead><tr><th>标的</th><th>名称</th><th>持股</th><th>成本</th><th>现价</th><th>当日</th><th>浮盈</th><th>盈亏额</th><th>市值</th><th>档位</th><th>买入日</th><th>止盈价</th><th>清仓价</th></tr></thead><tbody>'+
    ps.map(p=>{const g=(p.last/p.avg-1)*100, lv=pl[p.code]||{};
      return `<tr><td>${p.code}</td><td>${p.name}</td><td>${nf(p.shares,0)}</td><td>${nf(p.avg,3)}</td><td>${nf(p.last,3)}</td><td class="${cls(p.last_chg)}">${pct(p.last_chg)}</td><td class="${cls(g)}">${pct(g)}</td><td class="${cls(g)}">${(p.last-p.avg)*p.shares>=0?'+':'-'}¥${nf(Math.abs((p.last-p.avg)*p.shares),0)}</td><td>${money(p.shares*p.last)}</td><td><span class="badge lot">${p.lots}/${S.meta.rule.maxl} 档</span></td><td>${p.buy_date||'—'}</td><td>${nf(p.avg*1.15,3)}</td><td>${nf(lv.exit_price,3)}</td></tr>`}).join('')+
    '</tbody></table></div>';
}
function planRows(){
  const ps=S.plan||[];
  return '<div class="tw"><table><thead><tr><th>标的</th><th>名称</th><th>现价</th><th>MA20</th><th>MA60</th><th>回踩买点</th><th>距买点</th><th>不接飞刀</th><th>清仓线</th><th>档位</th><th>状态</th></tr></thead><tbody>'+
    ps.map(p=>`<tr><td>${p.code}</td><td>${p.name}</td><td>${nf(p.last,3)}</td><td>${nf(p.ma20,3)}</td><td>${nf(p.ma60,3)}</td><td><b>${nf(p.dip_price,3)}</b></td><td class="${p.dist_pct<=0?'pcl':''}">${pct(p.dist_pct)}</td><td>${nf(p.floor_price,3)}</td><td>${nf(p.exit_price,3)}</td><td>${p.lots}/${S.meta.rule.maxl}</td><td><span class="badge ${p.status}">${p.status==='full'?'满档':(p.dist_pct<=0?'可触发':'等待回踩')}</span></td></tr>`).join('')+
    '</tbody></table></div>';
}
function tradeRows(){
  const ts=(S.trades||[]).slice(-60).reverse();
  if(!ts.length)return '<div class="note">暂无成交。</div>';
  return '<div class="tw"><table><thead><tr><th>时间</th><th>标的</th><th>名称</th><th>方向</th><th>价格</th><th>数量</th><th>金额/盈亏</th><th>原因</th></tr></thead><tbody>'+
    ts.map(t=>`<tr><td>${t.ts}</td><td>${t.code}</td><td>${t.name}</td><td class="${t.action==='buy'?'pcl':'ncl'}">${t.action==='buy'?'买入':'卖出'}</td><td>${nf(t.price,3)}</td><td>${nf(t.shares,0)}</td><td class="${cls(t.pnl)}">${t.pnl!=null?nf(t.pnl,2):(t.amount!=null?nf(t.amount,2):'—')}</td><td>${t.reason||'—'}</td></tr>`).join('')+
    '</tbody></table></div>';
}
function backtestBlock(){
  const b=S.meta.backtest||{}, c=b.chosen||{}, h=b.buy_hold||{}, e=b.early_tp||{};
  const row=(n,r)=>`<tr><td style="text-align:left">${n}</td><td class="pcl">${pct((r.total||0)*100,1)}</td><td>${nf((r.mdd||0)*100,1)}%</td><td>${nf(r.sharpe,2)}</td><td>${pct((r.train||0)*100,1)} / ${nf(r.train_sh,2)}</td><td>${pct((r.oos||0)*100,1)} / ${nf(r.oos_sh,2)}</td><td>${r.trades||'—'}</td></tr>`;
  return `<div class="tw"><table><thead><tr><th>方案</th><th>全期</th><th>最大回撤</th><th>Sharpe</th><th>训练 收益/Sh</th><th>样本外 收益/Sh</th><th>笔数</th></tr></thead><tbody>
    ${row('买入持有',h)}${row('回踩+6%早止盈',e)}${row('<b>选定：回踩+长持退出</b>',c)}
    </tbody></table></div>
    <div class="note" style="margin-top:8px">${b.note||''}　窗口 ${b.window||''}，${b.split||''}。口径含一手 100 股取整、单边费 0.08%、MA 只用已收盘 K 线。</div>`;
}
function render(){
  const eq=eqOf(), cum=(eq/S.meta.start_cash-1)*100, tr=todayRet();
  const chgs=(S.positions||[]).map(p=>Number(p.last_chg)).filter(v=>Number.isFinite(v));
  const dayAvg=chgs.length?chgs.reduce((a,b)=>a+b,0)/chgs.length:null;
  const holds=S.positions.map(p=>{
    const g=(p.last/p.avg-1)*100, d=Number(p.last_chg);
    return `<span class="chip">${p.name}<b class="${Number.isFinite(d)?cls(d):''}">${Number.isFinite(d)?pct(d):'—'}</b><i style="font-style:normal;opacity:.62;margin-left:5px">浮盈 ${pct(g)}</i></span>`
  }).join('');
  const R=S.meta.rule||{};
  $('#content').innerHTML=`
  <div class="ps"><span class="lbl">策略</span><button class="ps-btn on">${S.meta.label||'红利回踩·长持'}</button><span class="upd">账本 ${S.meta.updated||''} · 每 60 秒刷新</span></div>
  <div class="hero">
    <div><div class="lab">账户总金额 · 初始本金 ${money(S.meta.start_cash)}</div><div class="big">${money(eq)}</div><div class="sub">累计 <b class="${cls(cum)}">${pct(cum)}</b> · 现金 ${money(S.cash)} · 持仓市值 ${money(posVal())}</div></div>
    <div><div class="lab">今日收益</div><div class="big ${cls(tr)}">${pct(tr)}</div><div class="sub">持仓当日涨幅均值 <b class="${dayAvg===null?'':cls(dayAvg)}">${dayAvg===null?'—':pct(dayAvg)}</b> · 上一净值点 ${curve().length>1?money(curve().at(-2).equity):'—'}</div></div>
    <div><div class="lab">持仓浮盈</div><div class="big ${cls(floatPnl())}">${floatPnl()>=0?'+':'-'}¥${nf(Math.abs(floatPnl()),0)}</div><div class="sub">${S.positions.length} 只 · 最大回撤 ${nf(mdd(),1)}%</div></div>
    <div><div class="lab">当前持股</div><div class="big">${S.positions.length}<small>只</small></div><div class="holds">${holds||'<span class="chip">空仓</span>'}</div></div>
  </div>

  <div class="sec" data-nav="当前持仓"><div class="sec-t">当前持仓 <span class="hint">${S.positions.length} 只 · 累计成交 ${(S.trades||[]).length} 笔</span></div>${posRows()}</div>
  <div class="sec" data-nav="回踩买点"><div class="sec-t">回踩买点 <span class="hint">现价 ≤ MA20×${nf(1-R.dip,2)} 且 > MA60×${nf(1-R.floor,2)} 才买 · 同标的一日最多 1 档</span></div>${planRows()}</div>

  <div class="kpis">
    <div class="kpi"><div class="k">最大回撤</div><div class="v">${nf(mdd(),2)}%</div></div>
    <div class="kpi"><div class="k">净值曲线点</div><div class="v">${curve().length}</div></div>
    <div class="kpi"><div class="k">起始日</div><div class="v" style="font-size:13px">${curve().length?curve()[0].date:'—'}</div></div>
    <div class="kpi"><div class="k">每标预算</div><div class="v" style="font-size:13px">${(()=>{const ps=S.meta.pool||[];const c=ps.find(p=>(p.weight||1)>=1)||{budget:S.meta.start_cash/6};const e=ps.find(p=>(p.weight||1)<1);return money(c.budget)+(e?" / "+money(e.budget):"")})()}</div></div>
    <div class="kpi"><div class="k">分档 / 仓位</div><div class="v">${R.maxl} 档</div></div>
  </div>

  <div class="sec" data-nav="净值曲线"><div class="sec-t">净值曲线 <span class="hint">历史回放 + 盘中实时巡检</span></div><div id="eq-chart" class="chart-box"></div></div>

  <details class="fold" data-nav="买法依据"><summary>买法依据 · 回测对比（同口径：整手 / 费用 / 已收盘 MA）</summary><div class="fold-body">${backtestBlock()}</div></details>
  <details class="fold" data-nav="策略规则"><summary>策略规则 · 运行说明</summary><div class="fold-body">
    <div class="rule">
      <div><b>买</b>现价 ≤ MA20×(1-${nf(R.dip*100,0)}%)，且 &gt; MA60×(1-${nf(R.floor*100,0)}%)，核心 6 只每标 ${R.maxl} 档、每档 ${money(S.meta.start_cash/6/R.maxl)}，扩池 4 只各半份（每档 ${money(S.meta.start_cash*0.5/8/R.maxl)}）（不足一手但现金够则买一手）</div>
      <div><b>减档</b>浮盈 ≥ +${nf(R.tp*100,0)}% 且手上 &gt;1 档 → 卖 1 档，其余继续持有</div>
      <div><b>清仓</b>现价 &lt; MA60×(1-${nf(R.ex*100,0)}%) 或 浮亏 ≤ -${nf(R.sl*100,0)}% → 全清该标</div>
      <div><b>防未来函数</b>MA20/MA60 只用已收盘 K 线（盘中剔除当日未完成 K），实时价仅用于触发</div>
    </div>
    <div class="note" style="margin-top:10px">${S.meta.note||''}<br>核心 6 只（全份）+ 扩池 4 只（半份）：${(S.meta.pool||[]).map(p=>p.code+' '+p.name+(p.weight<1?'（半份）':'')).join(' / ')}。<br>
    数据文件 <b>data/sim_dividend.json</b>，由 <b>sim_dividend.py</b> 生成；盘中每 2 分钟随 <b>scripts/sim_intraday_scan.sh</b> 巡检，本页每 60 秒拉取，改动即时生效。</div>
  </div></details>
  <details class="fold" data-nav="成交流水"><summary>成交流水 · 最近 60 笔</summary><div class="fold-body">${tradeRows()}</div></details>
  <details class="fold" data-nav="运行日志"><summary>运行日志</summary><div class="fold-body"><div class="note">${(S.log||[]).slice(-40).reverse().map(x=>x.ts+' '+x.msg).join('<br>')||'暂无日志'}</div></div></details>
  <div class="note" style="text-align:center;margin-top:16px">历史回测不代表未来收益 · 模拟盘仅用于策略验证，不构成投资建议</div>`;
  drawChart();
}
function drawChart(){
  const el=$('#eq-chart'), c=curve();
  if(!el||!c.length||typeof echarts==='undefined')return;
  if(chart)chart.dispose();
  chart=echarts.init(el);
  chart.setOption({grid:{left:58,right:16,top:14,bottom:26},tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:c.map(x=>x.date),axisLabel:{fontSize:10,color:'#8a929e'}},
    yAxis:{type:'value',scale:true,axisLabel:{fontSize:10,color:'#8a929e',formatter:v=>(v/10000).toFixed(1)+'万'},splitLine:{lineStyle:{color:'#eef0f2'}}},
    series:[{type:'line',data:c.map(x=>x.equity),showSymbol:false,smooth:true,
      lineStyle:{width:1.6,color:'#c62828'},areaStyle:{color:'rgba(198,40,40,.06)'}}]});
}
async function init(){
  $('#app').innerHTML=RV.ui.header('红利低波池 · 实时模拟','核心 6 只 + 扩池 4 只（半份）· 回踩建仓 + 长持退出','divsim','');
  RV.ui.initSidebar?.();
  await load();
  setInterval(load,60000);
  window.addEventListener('resize',()=>chart&&chart.resize());
}
async function load(){
  try{
    const r=await fetch('data/sim_dividend.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    S=await r.json();render();
  }catch(e){$('#content').innerHTML='<div class="sec"><b>数据加载失败</b><div class="note">'+e+'</div><div class="note">请运行 <b>python3 sim_dividend.py --init --replay --plan</b> 生成账本。</div></div>'}
}
init();
</script>
</body>
</html>

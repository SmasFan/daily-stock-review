<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日推荐 · 选股</title>
<link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.recommend();
    const picks = d.picks || [], mpicks = d.market_picks || [], sectors = d.sectors || [];
    const sectorPicks = d.sector_picks || [];
    const gridSignals = d.grid_signals || [];
    if (!picks.length) { app.innerHTML = RV.ui.header('每日推荐', '', 'recommend', d.generatedAt) + RV.ui.empty(); return; }

    // 大盘指数（方块卡片，英文简写，背景按涨跌着色）
    const IDX_SHORT = {
      '上证指数': 'SH',
      '深证成指': 'SZ',
      '创业板指': 'CYB',
      '沪深300': 'HS300',
      '恒生指数': 'HSI',
      '道琼斯': 'DJI',
      '纳斯达克': 'NDX',
      '标普500': 'S&P',
    };
    const idxCards = (d.indices || []).map(i => {
      const cls = RV.fmt.cls(i.change_pct);
      return `
      <div class="idx-card ${cls}">
        <span class="idx-short">${IDX_SHORT[i.name] || i.name}</span>
        <span class="idx-card-pct">${RV.fmt.pct(i.change_pct)}</span>
        <span class="idx-card-close">${RV.fmt.num(i.close)}</span>
      </div>`;
    }).join('');
    const indicesHtml = `<div class="section">
      <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-column')}</span><h2>大盘指数</h2></div>
      <div class="idx-cards">${idxCards}</div></div>`;

    // 网格策略操作提醒（均值线偏离度 → 操作建议）
    const ACTION_META = {
      clear:  { icon: 'right-from-bracket',  cls: 'down',  label: '超涨清仓' },
      buy:    { icon: 'cart-plus',           cls: 'up',    label: '逢低加仓' },
      reduce: { icon: 'cart-shopping',       cls: 'down',  label: '逢高减仓' },
      hold:   { icon: 'pause',               cls: 'neutral', label: '持有观察' },
      wait:   { icon: 'hourglass-half',      cls: 'neutral', label: '空仓等待' },
    };
    function gridActionBadge(s) {
      const m = ACTION_META[s.action_key] || { icon: 'question', cls: 'neutral' };
      const label = s.action || m.label;
      return `<span class="signal-badge s-${s.action_key}">${RV.ui.icon(m.icon, 'fa-xs')} ${label}</span>`;
    }
    function devText(s) {
      if (s.dev === null || s.dev === undefined) return '--';
      return `<span class="${RV.fmt.cls(s.dev)}">${RV.fmt.pct(s.dev * 100, 1)}</span>`;
    }
    function gridSignalSection() {
      if (!gridSignals.length) return '';
      const cards = gridSignals.map((s, i) => `
      <div class="mini-card">
        <div class="mini-head">
          <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${s.name} ${s.is_holding ? holdingBadge(s) : ''}</span>
          <span class="mini-head-right">${gridActionBadge(s)}</span>
        </div>
        <div class="mini-tags">
          <span class="date-tag">${s.date || '--'}</span>
          <span class="sec-chip">${s.price_only ? '价格锚' : '估值锚'}</span>
        </div>
        <div class="mini-kv">
          <span class="k">偏离均值线</span><span class="v">${devText(s)}</span>
          <span class="k">当前 / 目标仓位</span><span class="v">${s.position != null ? RV.fmt.num(s.position * 100, 0) + '%' : '--'} / ${s.target_pos != null ? RV.fmt.num(s.target_pos * 100, 0) + '%' : '--'}</span>
          <span class="k">网格档位</span><span class="v">${s.grid_idx ?? '--'}</span>
          <span class="k">参考价 / 均值线</span><span class="v">${RV.fmt.num(s.close)} / ${RV.fmt.num(s.anchor)}</span>
        </div>
        <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('grid-2', 'fa-xs')} ${s.reason}</div>
      </div>`).join('');
      // 默认折叠：点击标题展开/收起
      const buys = gridSignals.filter(s => s.action_key === 'buy' || s.action_key === 'clear').length;
      const warns = gridSignals.filter(s => s.action_key === 'reduce').length;
      const withTarget = gridSignals.filter(s => s.target_pos != null);
      const avgTarget = withTarget.length ? withTarget.reduce((a, b) => a + b.target_pos, 0) / withTarget.length * 100 : null;
      return `<div class="section">
        <div class="sector-group grid-signal" data-sec="__grid">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${RV.ui.icon('grid-2')} 网格策略 · 操作提醒</span>
            <span class="sec-chip">${gridSignals.length}只</span>
            ${buys ? `<span class="signal-badge s-buy">买${buys}</span>` : ''}
            ${warns ? `<span class="signal-badge s-reduce">减${warns}</span>` : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 目标仓位 ${avgTarget != null ? RV.fmt.num(avgTarget, 0) + '%' : '--'}</span>
            </span>
          </div>
          <div class="sector-body">
            ${RV.ui.infoDot('口径：均值线 = 750日滚动分位估值锚（PE/PB/ROE，缺因子自动归一），无估值数据退化为价格均线。仓位 = 均衡 70% − 斜率×偏离度，每涨 0.5% 抛 1%、每跌 0.5% 买 1.04%。偏离 ≤ −5% 半永久锁仓加仓，≥ +5% 超涨清仓。目标仓位为策略理论值，非持仓建议。')}
            <div class="mini-cards">${cards}</div>
          </div>
        </div>
      </div>`;
    }

    function topCards(list, title) {
      const a = list.filter(p => p.rating === 'A').length;
      const b = list.filter(p => p.rating === 'B').length;
      return `<div class="summary-grid">
        ${RV.ui.summaryCard('bullseye', list.length, '推荐标的')}
        ${RV.ui.summaryCard('medal', a, 'A 级')}
        ${RV.ui.summaryCard('award', b, 'B 级')}
        ${RV.ui.summaryCard('crown', list[0].name, title || '首推', 'up')}
      </div>`;
    }

    function holdingBadge(p) {
      return p.is_holding ? `<span class="signal-badge s-buy">${RV.ui.icon('briefcase', 'fa-xs')} 持仓</span>` : '';
    }

    function listTable(list) {
      const rows = list.map((p, i) => `
      <tr>
        <td class="asset-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${p.name} ${holdingBadge(p)}</td>
        <td><span class="sec-chip">${p.sector || '--'}</span></td>
        <td>${RV.ui.ratingBadge(p.rating)}</td>
        <td style="font-weight:800">${RV.fmt.num(p.total_score, 1)}</td>
        <td>${RV.ui.signalBadge(p.signal_key, p.signal)}</td>
        <td>${RV.ui.pctBadge(p.change_pct)}</td>
        <td>${RV.fmt.amount(p.amount)}</td>
        <td style="max-width:260px;font-size:12px;color:var(--text-2)">${p.reasons || '--'}</td>
      </tr>`).join('');
      const mobileCards = list.map((p, i) => `
      <div class="mini-card">
        <div class="mini-head">
          <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${p.name} ${holdingBadge(p)}</span>
          <span class="mini-head-right">${RV.ui.pctBadge(p.change_pct)} ${RV.ui.signalBadge(p.signal_key, p.signal)}</span>
        </div>
        <div class="mini-tags">
          <span class="sec-chip">${p.sector || '其他'}</span>
          <span class="date-tag">${p.trend_status || '--'}</span>
          ${RV.ui.ratingBadge(p.rating)}
        </div>
        <div class="mini-score">
          <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
          <div class="mini-score-bar">${RV.ui.progress(p.total_score)}</div>
        </div>
        <div class="mini-kv">
          <span class="k">成交额</span><span class="v">${RV.fmt.amount(p.amount)}</span>
          <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
        </div>
        <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('lightbulb', 'fa-xs')} ${p.reasons}</div>
      </div>`).join('');
      return `
        <div class="sector-group" data-sec="__rank">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${RV.ui.icon('table-list')} 推荐榜单</span>
            <span class="sec-chip">${list.length}只</span>
            <span class="sector-stat">
              <span>${RV.ui.icon('bullseye', 'fa-xs')} A${list.filter(p => p.rating === 'A').length}</span>
              <span>${RV.ui.icon('award', 'fa-xs')} B${list.filter(p => p.rating === 'B').length}</span>
              <span>最高分 <b>${RV.fmt.num(Math.max(...list.map(p => p.total_score)), 1)}</b></span>
            </span>
          </div>
          <div class="sector-body">
            <div class="table-desktop"><div class="table-wrap"><table class="data-table">
              <thead><tr><th>标的</th><th>板块</th><th>评级</th><th>综合分</th><th>信号</th><th>涨跌</th><th>成交额</th><th>当日购买原因</th></tr></thead>
              <tbody>${rows}</tbody></table></div></div>
            <div class="cards-mobile"><div class="mini-cards">${mobileCards}</div></div>
          </div>
        </div>`;
    }

    // 板块分组 + 迷你卡片（与复盘一致：点开板块展开个股卡片）
    const SIG_ORDER = { strong_buy: 0, buy: 1, watch: 2, reduce: 3, sell: 4 };
    function buyStrength(r) {
      return r.signal_key in SIG_ORDER ? SIG_ORDER[r.signal_key] : 5;
    }
    function groupBySector(items) {
      const groups = {};
      (items || []).forEach(r => {
        const sec = r.sector || '其他';
        (groups[sec] = groups[sec] || []).push(r);
      });
      Object.keys(groups).forEach(k => groups[k].sort((a, b) =>
        buyStrength(a) - buyStrength(b) || b.total_score - a.total_score));
      return groups;
    }

    function miniCards(list) {
      return `<div class="mini-cards">${list.map((p, i) => `
        <div class="mini-card">
          <div class="mini-head">
            <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${p.name} ${holdingBadge(p)}</span>
            <span class="mini-head-right">${RV.ui.pctBadge(p.change_pct)} ${RV.ui.signalBadge(p.signal_key, p.signal)}</span>
          </div>
          <div class="mini-tags">
            <span class="sec-chip">${p.sector || '其他'}</span>
            <span class="date-tag">${p.trend_status || '--'}</span>
            ${RV.ui.ratingBadge(p.rating)}
          </div>
          <div class="mini-score">
            <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
            <div class="mini-score-bar">${RV.ui.progress(p.total_score)}</div>
          </div>
          <div class="mini-kv">
            <span class="k">现价</span><span class="v">${RV.fmt.money(p.price)}</span>
            <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
            <span class="k">PE / PB</span><span class="v">${RV.fmt.num(p.pe, 1)} / ${RV.fmt.num(p.pb, 2)}</span>
            <span class="k">买点(MA5/10)</span><span class="v">${RV.fmt.num(p.ideal_buy)} / ${RV.fmt.num(p.secondary_buy)}</span>
            <span class="k">止损 / 止盈</span><span class="v">${RV.fmt.num(p.stop_loss)} / ${RV.fmt.num(p.take_profit)}</span>
          </div>
          <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('lightbulb', 'fa-xs')} ${p.reasons}</div>
        </div>`).join('')}</div>`;
    }

    function sectorSection(list, title) {
      const groups = groupBySector(list);
      const names = Object.keys(groups).sort((a, b) => {
        const la = groups[a].length, lb = groups[b].length;
        return lb - la || b.localeCompare(a, 'zh');
      });
      const secHtml = names.map(sec => {
        const items = groups[sec];
        const up = items.filter(r => r.change_pct > 0).length;
        const buys = items.filter(r => r.signal_key === 'buy' || r.signal_key === 'strong_buy').length;
        const top = items[0];
        return `
        <div class="sector-group" data-sec="${sec}">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${sec}</span>
            <span class="sec-chip">${items.length}只</span>
            ${top ? RV.ui.signalBadge(top.signal_key, top.signal) : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('arrow-trend-up', 'fa-xs')} ${up} <span class="down">${RV.ui.icon('arrow-trend-down', 'fa-xs')} ${items.length - up}</span></span>
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 买${buys}</span>
              <span>最高分 <b>${top ? RV.fmt.num(top.total_score, 1) : '--'}</b></span>
            </span>
          </div>
          <div class="sector-body">${miniCards(items)}</div>
        </div>`;
      }).join('');
      return `<div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>${title} · 按板块</h2></div>${secHtml}</div>`;
    }

    function listCards(list) {
      return list.map(p => `
      <div class="card">
        <div class="card-header">
          <div><span class="card-title">${p.name}</span> <span class="sec-chip">${p.sector || ''}</span> <span class="date-tag">${p.trend_status || '--'}</span> ${holdingBadge(p)}</div>
          ${RV.ui.signalBadge(p.signal_key, p.signal)}
        </div>
        <div class="score-ring">
          <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
          <div style="flex:1">${RV.ui.progress(p.total_score)}</div>
          ${RV.ui.pctBadge(p.change_pct)}
        </div>
        <div class="card-kv">
          <span class="k">现价</span><span class="v">${RV.fmt.money(p.price)}</span>
          <span class="k">评级</span><span class="v">${p.rating}</span>
          <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
          <span class="k">PE / PB</span><span class="v">${RV.fmt.num(p.pe, 1)} / ${RV.fmt.num(p.pb, 2)}</span>
        </div>
        <div class="points">
          <div class="point"><span class="p-label">理想买点</span><span class="p-val">${RV.fmt.num(p.ideal_buy)}</span></div>
          <div class="point"><span class="p-label">次优买点</span><span class="p-val">${RV.fmt.num(p.secondary_buy)}</span></div>
          <div class="point"><span class="p-label">止损</span><span class="p-val">${RV.fmt.num(p.stop_loss)}</span></div>
          <div class="point"><span class="p-label">止盈</span><span class="p-val">${RV.fmt.num(p.take_profit)}</span></div>
        </div>
        <div class="reason">${RV.ui.icon('lightbulb', 'fa-xs')} 当日购买原因：${p.reasons}</div>
      </div>`).join('');
    }

    // 板块推荐（估值 + 动量）—— 复盘风格：可展开的板块分组卡片
    function sectorRecSection() {
      if (!sectors.length) return '';
      const cards = sectors.map((s, i) => `
        <div class="sector-group sector-reco" data-sec="${s.name}">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${s.name}</span>
            <span class="sec-chip">${s.category}</span>
            ${s.highlight ? `<span class="signal-badge s-strong_buy">推荐</span>` : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 分 <b>${RV.fmt.num(s.sector_score, 2)}</b></span>
              <span class="${RV.fmt.cls(s.change)}">${RV.fmt.pct(s.change)}</span>
            </span>
          </div>
          <div class="sector-body">
            <div class="sector-detail">
              <div class="s-item"><span class="k">PE</span><span class="v">${RV.fmt.num(s.pe, 1)}</span></div>
              <div class="s-item"><span class="k">PB</span><span class="v">${RV.fmt.num(s.pb, 2)}</span></div>
              <div class="s-item"><span class="k">估值</span><span class="v">${s.level || '--'}</span></div>
              <div class="s-item"><span class="k">涨跌</span><span class="v ${RV.fmt.cls(s.change)}">${RV.fmt.pct(s.change)}</span></div>
            </div>
          </div>
        </div>`).join('');
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('book-open')}</span><h2>板块推荐（估值 + 动量）</h2></div>
        ${cards}
      </div>`;
    }

    // 板块推荐对应个股（Top5，复盘卡片样式）
    function sectorPickSection() {
      if (!sectorPicks.length) return '';
      const cards = sectorPicks.map((p, i) => `
      <div class="card">
        <div class="card-header">
          <div><span class="card-title">${p.name}</span> <span class="sec-chip">${p.sector || ''}</span> <span class="date-tag">${p.trend_status || '--'}</span> ${holdingBadge(p)}</div>
          ${RV.ui.signalBadge(p.signal_key, p.signal)}
        </div>
        <div class="score-ring">
          <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
          <div style="flex:1">${RV.ui.progress(p.total_score)}</div>
          ${RV.ui.pctBadge(p.change_pct)}
        </div>
        <div class="card-kv">
          <span class="k">现价</span><span class="v">${RV.fmt.money(p.price)}</span>
          <span class="k">评级</span><span class="v">${p.rating}</span>
          <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
          <span class="k">PE / PB</span><span class="v">${RV.fmt.num(p.pe, 1)} / ${RV.fmt.num(p.pb, 2)}</span>
        </div>
        <div class="points">
          <div class="point"><span class="p-label">理想买点</span><span class="p-val">${RV.fmt.num(p.ideal_buy)}</span></div>
          <div class="point"><span class="p-label">次优买点</span><span class="p-val">${RV.fmt.num(p.secondary_buy)}</span></div>
          <div class="point"><span class="p-label">止损</span><span class="p-val">${RV.fmt.num(p.stop_loss)}</span></div>
          <div class="point"><span class="p-label">止盈</span><span class="p-val">${RV.fmt.num(p.take_profit)}</span></div>
        </div>
        <div class="reason">${RV.ui.icon('lightbulb', 'fa-xs')} ${p.reasons}</div>
      </div>`).join('');
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('tags')}</span><h2>板块推荐 · 对应个股 Top${sectorPicks.length}</h2></div>
        <div class="cards">${cards}</div>
      </div>`;
    }

    let mod = 'stock';      // 顶层模块: sector 板块 / stock 个股
    let tab = 'watch';      // 二级: watch 自选 / market 大盘
    function render() {
      const list = tab === 'watch' ? picks : mpicks;
      const modTabs = `
        <div class="section">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('table-columns')}</span><h2>模块</h2></div>
          <div class="nav" style="justify-content:flex-start;margin-top:0">
            <a href="#" class="nav-link ${mod === 'sector' ? 'active' : ''}" data-mod="sector">${RV.ui.icon('layer-group')} 板块推荐</a>
            <a href="#" class="nav-link ${mod === 'stock' ? 'active' : ''}" data-mod="stock">${RV.ui.icon('bullseye')} 个股推荐</a>
          </div>
        </div>`;
      const stockTabs = `
        <div class="section">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('list-ul')}</span><h2>股票范围</h2></div>
          <div class="nav" style="justify-content:flex-start;margin-top:0">
            <a href="#" class="nav-link ${tab === 'watch' ? 'active' : ''}" data-tab="watch">${RV.ui.icon('list-check')} 自选推荐（${picks.length}）</a>
            <a href="#" class="nav-link ${tab === 'market' ? 'active' : ''}" data-tab="market">${RV.ui.icon('globe')} 大盘推荐（${mpicks.length}）</a>
          </div>
        </div>`;
      const sectorHtml = sectorRecSection() + sectorPickSection();
      const stockHtml = stockTabs
        + topCards(list, tab === 'watch' ? '自选首推' : '大盘首推')
        + `<div class="section">${listTable(list)}</div>`
        + sectorSection(list, tab === 'watch' ? '自选推荐' : '大盘推荐')
        + `<div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('id-card')}</span><h2>${tab === 'watch' ? '自选' : '大盘'} · 推荐详情</h2></div><div class="cards">${listCards(list)}</div></div>`;
      app.innerHTML = RV.ui.header('每日推荐 · 选股', '多因子横截面打分 + 技术信号 + 板块轮动', 'recommend', d.generatedAt)
        + indicesHtml + gridSignalSection() + modTabs
        + (mod === 'sector' ? sectorHtml : stockHtml)
        + '<footer>硬过滤剔除 ST/退市/无报价 · 评分=技术50%+横截面50% · 板块按估值+动量排序 · 点击板块展开/收起 · 不构成投资建议</footer>';
      app.querySelectorAll('.sector-group').forEach(g => {
        g.querySelector('.sector-header').addEventListener('click', () => g.classList.toggle('open'));
      });
      app.querySelectorAll('.nav-link[data-tab]').forEach(a => a.addEventListener('click', ev => {
        ev.preventDefault();
        tab = a.getAttribute('data-tab');
        render();
      }));
      app.querySelectorAll('.nav-link[data-mod]').forEach(a => a.addEventListener('click', ev => {
        ev.preventDefault();
        mod = a.getAttribute('data-mod');
        render();
      }));
    }
    render();
  } catch (e) {
    app.innerHTML = RV.ui.header('每日推荐', '', 'recommend') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

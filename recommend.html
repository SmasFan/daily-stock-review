<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日推荐 · 选股</title>
<link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js?v=2"></script>
<script src="assets/js/rvui.js?v=3"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.recommend();
    const picks = d.picks || [], mpicks = d.market_picks || [], sectors = d.sectors || [];
    const sectorStocks = d.sector_stocks || {};
    const gridSignals = d.grid_signals || [];
    if (!picks.length) { app.innerHTML = RV.ui.header('每日推荐', '', 'recommend', d.generatedAt) + RV.ui.empty(); return; }

    // ===== 宏观反馈（2026-08 新增）：宏观页利好/风险 → 个股与板块标签 =====
    let mIdx = null, mSec = null;
    try {
      const mD = await RV.API.fetch('macro_data.json');
      mIdx = (mD._index || {}).stocks || {};
      mSec = (mD._index || {}).sectors || {};
    } catch (e) {}
    function macroBadge(code) {
      const m = mIdx && mIdx[code];
      if (!m) return '';
      const k = m.score > 0 ? 'bull' : 'risk';
      return `<span class="macro-badge ${k === 'bull' ? 'macro-bull' : 'macro-risk'}" data-macro-code="${code}" title="点击查看相关新闻 · 宏观情绪 ${RV.fmt.num(m.score, 1)}（利好${m.bulls}/风险${m.risks}）" style="cursor:pointer">${k === 'bull' ? '宏观利好' : '宏观风险'}</span>`;
    }
    function sectorMacroTag(sec) {
      const m = mSec && mSec[sec];
      if (!m || m.net === 0) return '';
      const k = m.net > 0 ? 'bull' : 'risk';
      return `<span class="macro-badge ${k === 'bull' ? 'macro-bull' : 'macro-risk'}" data-macro-sector="${sec}" title="点击查看相关新闻 · 宏观情绪 ${RV.fmt.num(m.net, 1)}（利好${m.bulls}/风险${m.risks}）" style="cursor:pointer">${k === 'bull' ? '宏观利好' : '宏观风险'}</span>`;
    }

    // 推荐强度排序：strong_buy > buy > watch > reduce > sell，同级按综合分降序
    const SIG_ORDER = { strong_buy: 0, buy: 1, watch: 2, reduce: 3, sell: 4 };
    function buyStrength(r) {
      return r.signal_key in SIG_ORDER ? SIG_ORDER[r.signal_key] : 5;
    }
    const byStrength = (a, b) => buyStrength(a) - buyStrength(b) || b.total_score - a.total_score;
    picks.sort(byStrength);
    mpicks.sort(byStrength);
    Object.keys(sectorStocks).forEach(k => sectorStocks[k].sort(byStrength));

    // 大盘指数（方块卡片：图标 + 热度/涨幅背景，默认只显示涨跌卡片，点击展开下方技术详情）
    const IDX_SHORT = {
      '上证指数': 'SH',
      '深证成指': 'SZ',
      '创业板指': 'CYB',
      '沪深300': 'HS300',
      '恒生指数': 'HSI',
      '道琼斯': 'DJI',
      '纳斯达克': 'NDX',
      '标普500': 'S&P',
    };
    const IDX_ICON = {
      '上证指数': 'landmark',
      '深证成指': 'building-columns',
      '创业板指': 'rocket',
      '沪深300': 'chart-line',
      '恒生指数': 'city',
      '道琼斯': 'building',
      '纳斯达克': 'microchip',
      '标普500': 'star',
    };
    const marketTemp = d.temperature || null;
    // 扁平配色：柔和红涨绿跌 + 强度分级（Flat Design 色板）
    const IDX_PALETTE = {
      up: { bg: ['#fef2f2', '#fee2e2', '#fecaca'], tx: ['#dc2626', '#dc2626', '#b91c1c'] },
      down: { bg: ['#f0fdf4', '#dcfce7', '#bbf7d0'], tx: ['#16a34a', '#16a34a', '#15803d'] },
      neu: { bg: '#f4f5f7', tx: '#4b5563' },
    };
    function idxStyle(change) {
      if (!change) return { bg: IDX_PALETTE.neu.bg, tx: IDX_PALETTE.neu.tx };
      const mag = Math.min(Math.abs(change) / 3, 1);   // 3% 封顶
      const lvl = mag < 0.4 ? 0 : (mag < 0.8 ? 1 : 2);
      const p = change > 0 ? IDX_PALETTE.up : IDX_PALETTE.down;
      return { bg: p.bg[lvl], tx: p.tx[lvl] };
    }
    const idxCards = (d.indices || []).map((i, idx) => {
      const s = idxStyle(i.change_pct);
      const short = IDX_SHORT[i.name] || i.name;
      const ico = IDX_ICON[i.name] ? RV.ui.icon(IDX_ICON[i.name]) : '';
      return `
      <div class="idx-card" data-i="${idx}" style="background:${s.bg};border-top-color:${s.tx}" title="点击查看 ${i.name} 技术详情">
        <span class="idx-short">${ico} ${short}</span>
        <span class="idx-card-pct" style="color:${s.tx}">${RV.fmt.pct(i.change_pct)}</span>
        <span class="idx-card-close">${RV.fmt.num(i.close)}</span>
      </div>`;
    }).join('');

    // 大盘评估（市场热度）：复用复盘温度计口径（涨跌家数/平均涨跌/买卖信号）
    function tempColor(score) {
      if (score >= 70) return '#e74c3c';
      if (score >= 55) return '#f39c12';
      if (score >= 40) return '#3498db';
      return '#27ae60';
    }
    function assessCard(t) {
      if (!t || t.score == null) return '';
      const c = tempColor(t.score);
      return `<div class="idx-assess" style="--ia-color:${c}">
        <div class="ia-left">
          <div>
            <span class="ia-label">${RV.ui.icon('temperature-high', 'fa-xs')} 大盘评估</span>
            <div class="ia-score-row">
              <span class="ia-score" style="color:${c}">${t.score}</span>
              <span class="ia-tag">${t.label}</span>
            </div>
          </div>
        </div>
        <div class="ia-mid">
          <div class="tempo-bar"><div class="tempo-fill" style="width:${t.score}%;background:${c}"></div></div>
          <div class="ia-metrics">
            <span>${RV.ui.icon('arrow-trend-up', 'fa-xs')} 涨家占比 <b>${t.breadth != null ? t.breadth + '%' : '--'}</b></span>
            <span>${RV.ui.icon('scale-balanced', 'fa-xs')} 平均涨跌 <b class="${RV.fmt.cls(t.avg_change)}">${RV.fmt.pct(t.avg_change)}</b></span>
            <span>${RV.ui.icon('bullseye', 'fa-xs')} 买${t.bull ?? '--'} / 卖${t.bear ?? '--'}</span>
          </div>
        </div>
        <span class="ia-hint">${RV.ui.icon('mouse-pointer', 'fa-xs')} 点击指数卡弹出详情</span>
      </div>`;
    }

    // 指数技术因子卡：对有 factor 数据的指数（含纳指/标普）展示趋势/评分/买卖点位/均线偏离
    function indexFactorCard(i) {
      const f = i.factors;
      if (!f) return '';
      const scoreCls = f.score >= 60 ? 'up' : (f.score < 40 ? 'down' : '');
      const trendCls = RV.fmt.cls(f.bias_ma20);
      return `
        <div class="idx-f-head">
          <span class="idx-f-name">${RV.ui.icon('chart-line', 'fa-xs')} ${i.name}</span>
          <span class="idx-f-price">${RV.fmt.num(i.close)} <span class="${RV.fmt.cls(i.change_pct)}">${RV.fmt.pct(i.change_pct)}</span></span>
          ${RV.ui.signalBadge(f.signal_key, f.signal)}
        </div>
        <div class="idx-f-grid">
          <div class="idx-f-item"><span class="k">评分</span><span class="v ${scoreCls}">${f.score}</span></div>
          <div class="idx-f-item"><span class="k">趋势</span><span class="v">${f.trend_status}</span></div>
          <div class="idx-f-item"><span class="k">MA5 / MA20</span><span class="v">${RV.fmt.num(f.ma5)} / ${RV.fmt.num(f.ma20)}</span></div>
          <div class="idx-f-item"><span class="k">偏离MA20</span><span class="v ${trendCls}">${RV.fmt.pct(f.bias_ma20)}</span></div>
          <div class="idx-f-item"><span class="k">MACD</span><span class="v">${f.macd_status}</span></div>
          <div class="idx-f-item"><span class="k">RSI12</span><span class="v">${RV.fmt.num(f.rsi12, 1)}</span></div>
          <div class="idx-f-item"><span class="k">量能</span><span class="v">${f.volume_status}</span></div>
          <div class="idx-f-item"><span class="k">60日</span><span class="v ${RV.fmt.cls(f.change_60d)}">${RV.fmt.pct(f.change_60d)}</span></div>
        </div>
        <div class="idx-f-points">
          <span>买点 ${RV.fmt.num(f.ideal_buy)}</span>
          <span>次优 ${RV.fmt.num(f.secondary_buy)}</span>
          <span>止损 ${RV.fmt.num(f.stop_loss)}</span>
          <span>止盈 ${RV.fmt.num(f.take_profit)}</span>
        </div>`;
    }
    const factorCards = (d.indices || []).map((i, idx) =>
      i.factors ? `<div class="idx-factor-card" data-i="${idx}">${indexFactorCard(i)}</div>` : '').join('');
    const indicesHtml = `<div class="section" data-nav="大盘指数" data-nav-icon="chart-column">
      <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-column')}</span><h2>大盘指数 · 市场评估</h2></div>
      ${assessCard(marketTemp)}
      ${d.market_regime && d.market_regime.overheat
        ? `<div class="regime-banner">
            <span>${RV.ui.icon('triangle-exclamation', 'fa-xs')} 普涨过热日</span>
            <span>全市场上涨占比 ${(d.market_regime.breadth_up_ratio * 100).toFixed(0)}%（≥${(d.market_regime.threshold * 100).toFixed(0)}%）</span>
            <span>仅保留跑赢沪深300(${RV.fmt.pct(d.market_regime.benchmark_change)})的买入信号，${d.market_regime.downgraded_count} 只降为观望</span>
          </div>` : ''}
      <div class="idx-cards">${idxCards}</div>
      ${factorCards ? `<div class="idx-factor-grid">${factorCards}</div>` : ''}
    </div>`;

    // 宽基指数模块（2026-08）：沪深300/中证500/A500/科创50/恒生科技/创新药/中概/纳指/标普/医药
    let wideHtml = '';
    try {
      const wd = await RV.API.fetch('wide_index_data.json');
      wideHtml = RV.ui.wideIndexSection(wd);
    } catch (e) {}

    // 网格策略操作提醒（均值线偏离度 → 操作建议）
    const ACTION_META = {
      clear:  { icon: 'right-from-bracket',  cls: 'down',  label: '超涨清仓' },
      buy:    { icon: 'cart-plus',           cls: 'up',    label: '逢低加仓' },
      reduce: { icon: 'cart-shopping',       cls: 'down',  label: '逢高减仓' },
      hold:   { icon: 'pause',               cls: 'neutral', label: '持有观察' },
      wait:   { icon: 'hourglass-half',      cls: 'neutral', label: '空仓等待' },
    };
    function gridActionBadge(s) {
      const m = ACTION_META[s.action_key] || { icon: 'question', cls: 'neutral' };
      const label = s.action || m.label;
      return `<span class="signal-badge s-${s.action_key}">${RV.ui.icon(m.icon, 'fa-xs')} ${label}</span>`;
    }
    function devText(s) {
      if (s.dev === null || s.dev === undefined) return '--';
      return `<span class="${RV.fmt.cls(s.dev)}">${RV.fmt.pct(s.dev * 100, 1)}</span>`;
    }
    function gridSignalSection() {
      if (!gridSignals.length) return '';
      const cards = gridSignals.map((s, i) => `
      <div class="mini-card">
        <div class="mini-head">
          <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${nameBlock(s)} ${s.is_holding ? holdingBadge(s) : ''}</span>
          <span class="mini-head-right">${gridActionBadge(s)}</span>
        </div>
        <div class="mini-tags">
          <span class="date-tag">${s.date || '--'}</span>
          <span class="sec-chip">${s.price_only ? '价格锚' : '估值锚'}</span>
        </div>
        <div class="mini-kv">
          <span class="k">偏离均值线</span><span class="v">${devText(s)}</span>
          <span class="k">当前 / 目标仓位</span><span class="v">${s.position != null ? RV.fmt.num(s.position * 100, 0) + '%' : '--'} / ${s.target_pos != null ? RV.fmt.num(s.target_pos * 100, 0) + '%' : '--'}</span>
          <span class="k">网格档位</span><span class="v">${s.grid_idx ?? '--'}</span>
          <span class="k">参考价 / 均值线</span><span class="v">${RV.fmt.num(s.close)} / ${RV.fmt.num(s.anchor)}</span>
        </div>
        <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('grid-2', 'fa-xs')} ${s.reason}</div>
      </div>`).join('');
      // 默认折叠：点击标题展开/收起
      const buys = gridSignals.filter(s => s.action_key === 'buy' || s.action_key === 'clear').length;
      const warns = gridSignals.filter(s => s.action_key === 'reduce').length;
      const withTarget = gridSignals.filter(s => s.target_pos != null);
      const avgTarget = withTarget.length ? withTarget.reduce((a, b) => a + b.target_pos, 0) / withTarget.length * 100 : null;
      return `<div class="section" data-nav="网格策略" data-nav-icon="grid-2">
        <div class="sector-group grid-signal" data-sec="__grid">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${RV.ui.icon('grid-2')} 网格策略 · 操作提醒</span>
            <span class="sec-chip">${gridSignals.length}只</span>
            ${buys ? `<span class="signal-badge s-buy">买${buys}</span>` : ''}
            ${warns ? `<span class="signal-badge s-reduce">减${warns}</span>` : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 目标仓位 ${avgTarget != null ? RV.fmt.num(avgTarget, 0) + '%' : '--'}</span>
            </span>
          </div>
          <div class="sector-body">
            ${RV.ui.infoDot('口径：均值线 = 750日滚动分位估值锚（PE/PB/ROE，缺因子自动归一），无估值数据退化为价格均线。仓位 = 均衡 70% − 斜率×偏离度，每涨 0.5% 抛 1%、每跌 0.5% 买 1.04%。偏离 ≤ −5% 半永久锁仓加仓，≥ +5% 超涨清仓。目标仓位为策略理论值，非持仓建议。')}
            <div class="mini-cards">${cards}</div>
          </div>
        </div>
      </div>`;
    }

    function topCards(list, title) {
      const a = list.filter(p => p.rating === 'A').length;
      const b = list.filter(p => p.rating === 'B').length;
      return `<div class="summary-grid">
        ${RV.ui.summaryCard('bullseye', list.length, '推荐标的')}
        ${RV.ui.summaryCard('medal', a, 'A 级')}
        ${RV.ui.summaryCard('award', b, 'B 级')}
        ${RV.ui.summaryCard('crown', list[0] ? list[0].name : '--', title || '首推', 'up')}
      </div>`;
    }

    function holdingBadge(p) {
      return p.is_holding ? `<span class="signal-badge s-buy">${RV.ui.icon('briefcase', 'fa-xs')} 持仓</span>` : '';
    }

    // 股票名称 + 代码小字（附温度&走势按钮）
    function nameBlock(p, suffix) {
      return `<span class="sname" style="cursor:pointer;color:var(--accent);font-weight:700" onclick="window.__stock('${p.code}')" title="专业行情">${p.name}</span>${suffix || ''}${p.code ? RV.ui.heatBtn(p.code, p.name, 'stock') : ''}<span class="stock-code">${p.code}</span>`;
    }

    // 个股推荐评分原因（'?' 弹层，与复盘页一致）
    function recDetail(p) {
      const rows = [
        ['综合分', p.total_score + ' → ' + p.signal + ' · ' + p.rating + '级', '技术分×50% + 横截面分×50%'],
        ['技术分', p.tech_score, '趋势/乖离/量能/支撑/MACD/RSI 六维技术评分'],
        ['趋势', p.trend_status || '--', 'MA5/MA10/MA20 排列，多头排列加分、空头排列减分'],
        ['动量', RV.fmt.num(p.momentum_score, 1), '当日涨跌 + 60日趋势（>45% 过热、<-20% 破位惩罚）'],
        ['价值', RV.fmt.num(p.value_score, 1), 'PE/PB 横截面分位，越低越好'],
        ['流动性', RV.fmt.num(p.liquidity_score, 1), '成交额横截面分位，越高越好'],
        ['活跃度', RV.fmt.num(p.activity_score, 1), '量比/换手率，理想区间加分'],
        ['稳定性', RV.fmt.num(p.stability_score, 1), '低波动/低回撤加分'],
        ['横截面分', RV.fmt.num(p.cross_score, 1), '动量+价值+流动性+活跃度+稳定性 加权'],
        ['量比', RV.fmt.num(p.volume_ratio, 2), '>1.5 放量、<0.7 缩量'],
        ['60日涨跌', RV.fmt.pct(p.change_60d), '近60个交易日累计涨跌幅'],
        ['买卖点位', '买' + RV.fmt.num(p.ideal_buy) + '/' + RV.fmt.num(p.secondary_buy) + ' · 损' + RV.fmt.num(p.stop_loss) + ' · 盈' + RV.fmt.num(p.take_profit), 'MA5 理想买点、MA10 次优、MA20 止损、20日高点止盈'],
      ];
      // 宏观因素（2026-08 新增）：宏观页结果反馈到个股详情
      const m = mIdx && mIdx[p.code];
      if (m) {
        rows.push(['宏观因素', (m.score > 0 ? '宏观利好' : '宏观风险') + ' · 净情绪 ' + RV.fmt.num(m.score, 1) + '（利好' + m.bulls + ' / 风险' + m.risks + '）', '宏观页：政策与新闻词典法情绪加权分，正分偏多、负分偏空，与所属板块共享']);
        const mKeys = (m.key || []).slice(0, 2).map(k =>
          `<span class="${k.kind === 'bull' ? 'up' : 'down'}">${k.kind === 'bull' ? '[利好]' : '[风险]'}</span> ${k.title.length > 24 ? k.title.slice(0, 24) + '…' : k.title}`).join('<br>');
        if (mKeys) rows.push(['关键提醒', mKeys, '所属板块近期命中的政策/新闻标题（详见宏观页）']);
      }
      // 同花顺财务指标（2026-08 新增）
      const fin = (d.financials || {})[p.code];
      if (fin) {
        const pf = (v, suf = '%') => v != null && v !== '' ? RV.fmt.num(parseFloat(v), 2) + suf : '--';
        rows.push(['财务指标（同花顺）',
          `ROE ${pf(fin.roe)} · 毛利率 ${pf(fin.gross_margin)} · 净利率 ${pf(fin.net_margin)}`,
          `营收YoY ${pf(fin.revenue_yoy)} · 净利YoY ${pf(fin.profit_yoy)} · 资产负债率 ${pf(fin.debt_ratio)}`]);
      }
      return rows.map(([k, v, d]) =>
        `<div class="it-row"><span class="k">${k}</span><span class="v">${v}</span></div>
         <div style="color:var(--text-2);font-size:11px;line-height:1.5;padding-bottom:4px">${d}</div>`).join('<hr>');
    }
    const recDot = p => RV.ui.infoDot(recDetail(p), p.name + ' · 推荐评分原因');

    function listTable(list) {
      const rows = list.map((p, i) => `
      <tr>
        <td class="asset-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${nameBlock(p)} ${macroBadge(p.code)} ${holdingBadge(p)}</td>
        <td><span class="sec-chip">${p.sector || '--'}</span></td>
        <td>${RV.ui.ratingBadge(p.rating)}</td>
        <td style="font-weight:800">${RV.fmt.num(p.total_score, 1)}</td>
        <td>${RV.ui.signalBadge(p.signal_key, p.signal)}</td>
        <td>${RV.ui.pctBadge(p.change_pct)}</td>
        <td>${RV.fmt.amount(p.amount)}</td>
        <td style="max-width:260px;font-size:12px;color:var(--text-2)">${p.reasons || '--'}</td>
      </tr>`).join('');
      const mobileCards = list.map((p, i) => `
      <div class="mini-card">
        <div class="mini-head">
          <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${nameBlock(p)} ${holdingBadge(p)}</span>
          <span class="mini-head-right">${RV.ui.pctBadge(p.change_pct)} ${RV.ui.signalBadge(p.signal_key, p.signal)} ${recDot(p)}</span>
        </div>
        <div class="mini-tags">
          <span class="sec-chip">${p.sector || '其他'}</span>
          ${macroBadge(p.code)}
          <span class="date-tag">${p.trend_status || '--'}</span>
          ${RV.ui.ratingBadge(p.rating)}
        </div>
        <div class="mini-price">
          <span>现价 <b>${RV.fmt.num(p.price)}</b></span>
          <span>开盘 <b>${RV.fmt.num(p.open)}</b></span>
        </div>
        <div class="mini-score">
          <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
          <div class="mini-score-bar">${RV.ui.progress(p.total_score)}</div>
        </div>
        <div class="mini-kv">
          <span class="k">成交额</span><span class="v">${RV.fmt.amount(p.amount)}</span>
          <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
        </div>
        <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('lightbulb', 'fa-xs')} ${p.reasons}</div>
      </div>`).join('');
      return `
        <div class="sector-group" data-sec="__rank">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${RV.ui.icon('table-list')} 推荐榜单</span>
            <span class="sec-chip">${list.length}只</span>
            <span class="sector-stat">
              <span>${RV.ui.icon('bullseye', 'fa-xs')} A${list.filter(p => p.rating === 'A').length}</span>
              <span>${RV.ui.icon('award', 'fa-xs')} B${list.filter(p => p.rating === 'B').length}</span>
              <span>最高分 <b>${list.length ? RV.fmt.num(Math.max(...list.map(p => p.total_score)), 1) : '--'}</b></span>
            </span>
          </div>
          <div class="sector-body">
            <div class="table-desktop"><div class="table-wrap"><table class="data-table">
              <thead><tr><th>标的</th><th>板块</th><th>评级</th><th>综合分</th><th>信号</th><th>涨跌</th><th>成交额</th><th>当日购买原因</th></tr></thead>
              <tbody>${rows}</tbody></table></div></div>
            <div class="cards-mobile"><div class="mini-cards">${mobileCards}</div></div>
          </div>
        </div>`;
    }

    // 板块分组 + 迷你卡片（与复盘一致：点开板块展开个股卡片）
    function groupBySector(items) {
      const groups = {};
      (items || []).forEach(r => {
        const sec = r.sector || '其他';
        (groups[sec] = groups[sec] || []).push(r);
      });
      Object.keys(groups).forEach(k => groups[k].sort((a, b) =>
        buyStrength(a) - buyStrength(b) || b.total_score - a.total_score));
      return groups;
    }

    function miniCards(list) {
      return `<div class="mini-cards">${list.map((p, i) => `
        <div class="mini-card">
          <div class="mini-head">
            <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${nameBlock(p)} ${macroBadge(p.code)} ${holdingBadge(p)}</span>
            <span class="mini-head-right">${RV.ui.pctBadge(p.change_pct)} ${RV.ui.signalBadge(p.signal_key, p.signal)} ${recDot(p)}</span>
          </div>
          <div class="mini-tags">
            <span class="sec-chip">${p.sector || '其他'}</span>
            <span class="date-tag">${p.trend_status || '--'}</span>
            ${RV.ui.ratingBadge(p.rating)}
          </div>
          <div class="mini-price">
            <span>现价 <b>${RV.fmt.num(p.price)}</b></span>
            <span>开盘 <b>${RV.fmt.num(p.open)}</b></span>
          </div>
          <div class="mini-score">
            <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
            <div class="mini-score-bar">${RV.ui.progress(p.total_score)}</div>
          </div>
          <div class="mini-kv">
            <span class="k">现价</span><span class="v">${RV.fmt.money(p.price)}</span>
            <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
            <span class="k">PE / PB</span><span class="v">${RV.fmt.num(p.pe, 1)} / ${RV.fmt.num(p.pb, 2)}</span>
            <span class="k">买点(MA5/10)</span><span class="v">${RV.fmt.num(p.ideal_buy)} / ${RV.fmt.num(p.secondary_buy)}</span>
            <span class="k">止损 / 止盈</span><span class="v">${RV.fmt.num(p.stop_loss)} / ${RV.fmt.num(p.take_profit)}</span>
          </div>
          <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('lightbulb', 'fa-xs')} ${p.reasons}</div>
        </div>`).join('')}</div>`;
    }

    // 板块汇总详情（'?' 弹层，与复盘页一致）：结构化卡片布局
    function sectorDetail(sec, list) {
      const n = list.length;
      const up = list.filter(r => r.change_pct > 0).length;
      const down = n - up;
      const strongBuy = list.filter(r => r.signal_key === 'strong_buy').length;
      const buy = list.filter(r => r.signal_key === 'buy').length;
      const buys = strongBuy + buy;
      const avgScore = list.reduce((s, r) => s + (r.total_score || 0), 0) / n;
      const avgChg = list.reduce((s, r) => s + (r.change_pct || 0), 0) / n;
      const best = list.slice().sort((a, b) => (b.total_score || 0) - (a.total_score || 0))[0];
      const worst = list.slice().sort((a, b) => (a.total_score || 0) - (b.total_score || 0))[0];
      const RATING_COLOR = { A: '#dc2626', B: '#ea580c', C: '#d97706', D: '#16a34a', E: '#6b7280' };
      const ratingCnt = list.reduce((m, r) => { m[r.rating] = (m[r.rating] || 0) + 1; return m; }, {});
      const ratings = Object.keys(RATING_COLOR).map(k =>
        ratingCnt[k] ? `<span><i style="background:${RATING_COLOR[k]};display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px"></i>${k} ${ratingCnt[k]}</span>` : '').join('');

      const distBar = `<div style="display:flex;height:8px;border-radius:99px;overflow:hidden;margin:4px 0 8px">` +
        Object.keys(RATING_COLOR).map(k => ratingCnt[k]
          ? `<span style="display:block;width:${(ratingCnt[k] / n * 100).toFixed(1)}%;background:${RATING_COLOR[k]};height:100%"></span>` : '').join('') + `</div>`;

      const scoreBar = `<div style="display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);margin:4px 0 6px"><div style="width:${Math.max(0, Math.min(100, avgScore))}%;background:${avgScore >= 70 ? '#dc2626' : (avgScore >= 55 ? '#d97706' : (avgScore >= 40 ? '#2563eb' : '#16a34a'))};height:100%"></div></div>`;

      const statCard = (icon, title, val, sub, cls = '') => `
        <div style="flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center">
          <div style="font-size:10px;color:var(--text-2)">${title}</div>
          <div style="font-size:17px;font-weight:800;font-variant-numeric:tabular-nums" class="${cls}">${val}</div>
          <div style="font-size:10px;color:var(--text-2)">${sub}</div>
        </div>`;

      const head = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px">
          <span style="font-weight:800;font-size:14px">${sec}</span>
          <span class="${RV.fmt.cls(avgChg)}" style="font-weight:800;font-size:15px;font-variant-numeric:tabular-nums">${RV.fmt.pct(avgChg)}</span>
        </div>`;

      const statRow = `<div style="display:flex;gap:8px;margin-bottom:10px">
        ${statCard('', '标的数', n + ' 只', up + ' 涨 / ' + down + ' 跌')}
        ${statCard('', '平均综合分', RV.fmt.num(avgScore, 1), '技术50% + 截面50%')}
        ${statCard('', '买入信号', buys + ' 只', '强买 + 买入')}
      </div>`;

      // 宏观因素（2026-08 新增）：板块宏观净情绪 + 关键提醒
      const mac = mSec && mSec[sec];
      const macroBlock = mac && mac.net !== 0 ? `
        <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:11px;font-weight:700;color:var(--text-2)">宏观</span>
            <span class="${mac.net > 0 ? 'up' : 'down'}" style="font-weight:800">${mac.net > 0 ? '宏观利好' : '宏观风险'} ${RV.fmt.num(mac.net, 1)}</span>
            <span style="font-size:11px;color:var(--text-2)">利好 ${mac.bulls} · 风险 ${mac.risks}</span>
          </div>
          ${(mac.key || []).slice(0, 2).map(k => `<div style="font-size:11px;margin-top:4px;color:var(--text-2);line-height:1.5"><span class="${k.kind === 'bull' ? 'up' : 'down'}" style="font-weight:700">${k.kind === 'bull' ? '[利好]' : '[风险]'}</span> ${k.title.length > 24 ? k.title.slice(0, 24) + '…' : k.title}</div>`).join('')}
        </div>` : '';

      const pickCard = (r, tag) => r ? `
        <div style="display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px">
          <span style="font-size:11px;font-weight:700;color:var(--text-2);flex-shrink:0">${tag}</span>
          <span style="flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.name}</span>
          <span class="${RV.fmt.cls(r.change_pct)}" style="font-weight:700;font-variant-numeric:tabular-nums">${RV.fmt.pct(r.change_pct)}</span>
          <span style="font-size:12px;font-weight:800;font-variant-numeric:tabular-nums">${RV.fmt.num(r.total_score, 1)}</span>
          ${RV.ui.ratingBadge(r.rating)}${RV.ui.signalBadge(r.signal_key, r.signal)}
        </div>` : '';

      const note = `<div style="font-size:10px;color:var(--text-2);line-height:1.6;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)">
        板块内按买入强度（强买>买入>观望>减仓>卖出）排序，同级按综合分降序；综合分 = 技术分×50% + 横截面分×50%
      </div>`;

      return head + macroBlock + statRow + distBar + '<div style="font-size:11px;color:var(--text-2);margin-bottom:2px">评级分布：' + ratings + '</div>' + scoreBar
        + '<div style="font-size:10px;color:var(--text-2);margin:2px 0 10px;display:flex;justify-content:space-between"><span>0</span><span>均分 ' + RV.fmt.num(avgScore, 1) + '</span><span>100</span></div>'
        + pickCard(best, '最强') + pickCard(worst, '最弱') + note;
    }
    const sectorDot = (sec, list) => RV.ui.infoDot(sectorDetail(sec, list), '');

    function sectorSection(list, title) {
      const groups = groupBySector(list);
      // 板块按平均综合分倒序（板块评分），同分按数量、名称
      const avgScore = arr => arr.reduce((s, r) => s + (r.total_score || 0), 0) / arr.length;
      const names = Object.keys(groups).sort((a, b) => {
        const sa = avgScore(groups[a]), sb = avgScore(groups[b]);
        return sb - sa || groups[b].length - groups[a].length || b.localeCompare(a, 'zh');
      });
      const secHtml = names.map(sec => {
        const items = groups[sec];
        const up = items.filter(r => r.change_pct > 0).length;
        const buys = items.filter(r => r.signal_key === 'buy' || r.signal_key === 'strong_buy').length;
        const top = items[0];
        return `
        <div class="sector-group" data-sec="${sec}">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${sec}</span>
            ${sectorDot(sec, items)}
            ${sectorMacroTag(sec)}
            <span class="sec-chip">${items.length}只</span>
            ${top ? RV.ui.signalBadge(top.signal_key, top.signal) : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('arrow-trend-up', 'fa-xs')} ${up} <span class="down">${RV.ui.icon('arrow-trend-down', 'fa-xs')} ${items.length - up}</span></span>
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 买${buys}</span>
              <span>最高分 <b>${top ? RV.fmt.num(top.total_score, 1) : '--'}</b></span>
            </span>
          </div>
          <div class="sector-body">${miniCards(items)}</div>
        </div>`;
      }).join('');
      return `<div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>${title} · 按板块</h2></div>${secHtml}</div>`;
    }

    function listCards(list) {
      return list.map(p => `
      <div class="card">
        <div class="card-header">
          <div><span class="card-title">${nameBlock(p)}</span> ${macroBadge(p.code)} <span class="sec-chip">${p.sector || ''}</span> <span class="date-tag">${p.trend_status || '--'}</span> ${holdingBadge(p)}</div>
          <span style="display:inline-flex;align-items:center;gap:8px">${RV.ui.signalBadge(p.signal_key, p.signal)} ${recDot(p)}</span>
        </div>
        <div class="card-summary">
          <span class="cs-item"><i>分数</i><b class="${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</b></span>
          <span class="cs-item"><i>现价</i><b>${RV.fmt.num(p.price)}</b></span>
          <span class="cs-item"><i>开盘</i><b>${RV.fmt.num(p.open)}</b></span>
          <span class="cs-item"><i>涨幅</i><b class="${RV.fmt.cls(p.change_pct)}">${RV.fmt.pct(p.change_pct)}</b></span>
        </div>
        <div class="card-detail">
        <div class="score-ring">
          <span class="score-num ${p.total_score >= 60 ? 'up' : ''}">${RV.fmt.num(p.total_score, 1)}</span>
          <div style="flex:1">${RV.ui.progress(p.total_score)}</div>
          ${RV.ui.pctBadge(p.change_pct)}
        </div>
        <div class="card-kv">
          <span class="k">现价</span><span class="v">${RV.fmt.money(p.price)}</span>
          <span class="k">评级</span><span class="v">${p.rating}</span>
          <span class="k">技术 / 截面</span><span class="v">${RV.fmt.num(p.tech_score, 0)} / ${RV.fmt.num(p.cross_score, 0)}</span>
          <span class="k">PE / PB</span><span class="v">${RV.fmt.num(p.pe, 1)} / ${RV.fmt.num(p.pb, 2)}</span>
        </div>
        <div class="points">
          <div class="point"><span class="p-label">理想买点</span><span class="p-val">${RV.fmt.num(p.ideal_buy)}</span></div>
          <div class="point"><span class="p-label">次优买点</span><span class="p-val">${RV.fmt.num(p.secondary_buy)}</span></div>
          <div class="point"><span class="p-label">止损</span><span class="p-val">${RV.fmt.num(p.stop_loss)}</span></div>
          <div class="point"><span class="p-label">止盈</span><span class="p-val">${RV.fmt.num(p.take_profit)}</span></div>
        </div>
        <div class="reason">${RV.ui.icon('lightbulb', 'fa-xs')} 当日购买原因：${p.reasons}</div>
        </div>
      </div>`).join('');
    }

    // 板块推荐（估值 + 动量）—— 复盘风格：可展开的板块分组卡片
    function sectorRecSection() {
      if (!sectors.length) return '';
      const cards = sectors.map((s, i) => {
        const stocks = sectorStocks[s.name] || [];
        return `
        <div class="sector-group sector-reco" data-sec="${s.name}">
          <div class="sector-header">
            <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
            <span class="sector-name">${s.name}${RV.ui.heatBtn(s.name, s.name, 'sector')}</span>
            ${sectorMacroTag(s.name)}
            <span class="sec-chip">${s.category}</span>
            ${s.highlight ? `<span class="signal-badge s-strong_buy">推荐</span>` : ''}
            ${stocks.length ? `<span class="sec-chip">${stocks.length}只</span>` : ''}
            <span class="sector-stat">
              <span>${RV.ui.icon('bullseye', 'fa-xs')} 分 <b>${RV.fmt.num(s.sector_score, 2)}</b></span>
              <span class="${RV.fmt.cls(s.change)}">${RV.fmt.pct(s.change)}</span>
            </span>
          </div>
          <div class="sector-body">
            <div class="sector-detail">
              <div class="s-item"><span class="k">PE</span><span class="v">${RV.fmt.num(s.pe, 1)}</span></div>
              <div class="s-item"><span class="k">PB</span><span class="v">${RV.fmt.num(s.pb, 2)}</span></div>
              <div class="s-item"><span class="k">估值</span><span class="v">${s.level || '--'}</span></div>
              <div class="s-item"><span class="k">涨跌</span><span class="v ${RV.fmt.cls(s.change)}">${RV.fmt.pct(s.change)}</span></div>
            </div>
            ${stocks.length ? miniCards(stocks) : ''}
          </div>
        </div>`;
      }).join('');
      return `<div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('book-open')}</span><h2>板块推荐（估值 + 动量）</h2></div>
        ${cards}
      </div>`;
    }

    let mod = 'stock';      // 顶层模块: sector 板块 / stock 个股
    let tab = 'watch';      // 二级: watch 自选 / market 大盘
    let query = '';         // 搜索关键词
    const matches = (p, q) => (p.name || '').includes(q) || (p.code || '').includes(q) || ((p.sector || '') + '').includes(q);
    function render() {
      const prevScroll = window.scrollY;
      const wasSearching = document.activeElement && document.activeElement.id === 'rc-search';
      const base = tab === 'watch' ? picks : mpicks;
      const list = query ? base.filter(p => matches(p, query)) : base;
      const modTabs = `
        <div class="section">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('table-columns')}</span><h2>模块</h2></div>
          <div class="nav" style="justify-content:flex-start;margin-top:0">
            <a href="#" class="nav-link ${mod === 'sector' ? 'active' : ''}" data-mod="sector">${RV.ui.icon('layer-group')} 板块推荐</a>
            <a href="#" class="nav-link ${mod === 'stock' ? 'active' : ''}" data-mod="stock">${RV.ui.icon('bullseye')} 个股推荐</a>
          </div>
        </div>`;
      const stockTabs = `
        <div class="section">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('list-ul')}</span><h2>股票范围</h2></div>
          <div class="nav" style="justify-content:flex-start;margin-top:0">
            <a href="#" class="nav-link ${tab === 'watch' ? 'active' : ''}" data-tab="watch">${RV.ui.icon('list-check')} 自选推荐（${picks.length}）</a>
            <a href="#" class="nav-link ${tab === 'market' ? 'active' : ''}" data-tab="market">${RV.ui.icon('globe')} 大盘推荐（${mpicks.length}）</a>
          </div>
          <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
            <input id="rc-search" type="text" placeholder="搜索名称 / 代码 / 板块…" value="${query}" style="flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:13px">
            ${query ? `<button id="rc-search-clear" style="border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer">清除</button>` : ''}
          </div>
        </div>`;
      const sectorHtml = `<div data-nav="板块推荐" data-nav-icon="layer-group">${sectorRecSection()}</div>`;
      const stockHtml = stockTabs
        + `<div data-nav="首推总览" data-nav-icon="crown">${topCards(list, tab === 'watch' ? '自选首推' : '大盘首推')}</div>`
        + `<div data-nav="按板块" data-nav-icon="layer-group">${sectorSection(list, tab === 'watch' ? '自选推荐' : '大盘推荐')}</div>`
        + `<div data-nav="推荐榜单" data-nav-icon="table-list">${listTable(list.slice(0, 20))}</div>`
        + `<div data-nav="推荐详情" data-nav-icon="id-card"><div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('id-card')}</span><h2>${tab === 'watch' ? '自选' : '大盘'} · 推荐详情</h2></div><div class="cards">${listCards(list.slice(0, 20))}</div></div></div>`;
      app.innerHTML = RV.ui.header('每日推荐 · 选股', '多因子横截面打分 + 技术信号 + 板块轮动', 'recommend', d.generatedAt)
        + indicesHtml + wideHtml + gridSignalSection() + modTabs
        + (mod === 'sector' ? sectorHtml : stockHtml)
        + '<footer>硬过滤剔除 ST/退市/无报价 · 评分=技术50%+横截面50% · 板块按估值+动量排序 · 点击板块展开/收起 · 不构成投资建议</footer>';
      RV.ui.initSidebar();
      // 宏观利好/风险标签：点击弹出相关新闻（2026-08）
      app.addEventListener('click', ev => {
        const el = ev.target.closest('.macro-badge[data-macro-code], .macro-badge[data-macro-sector]');
        if (!el) return;
        ev.stopPropagation();
        const info = el.getAttribute('data-macro-code')
          ? (mIdx || {})[el.getAttribute('data-macro-code')]
          : (mSec || {})[el.getAttribute('data-macro-sector')];
        if (!info) return;
        RV.ui.macroNewsModal({
          title: (info.name ? info.name + ' · ' : '') + (info.sector || '') || (info.sector || '宏观'),
          score: info.score != null ? info.score : info.net,
          bulls: info.bulls, risks: info.risks, key: info.key,
        });
      });
      // 大盘指数卡点击：弹出技术详情弹窗
      function openIdxModal(idx) {
        const src = app.querySelector(`.idx-factor-card[data-i="${idx}"]`);
        if (!src) return;
        const idxObj = (d.indices || [])[idx];
        const body = src.innerHTML;
        const overlay = document.createElement('div');
        overlay.className = 'idx-modal-overlay';
        overlay.innerHTML = `<div class="idx-modal">
          <div class="idx-modal-head">
            <span class="idx-m-name">${RV.ui.icon('chart-line', 'fa-xs')} ${idxObj ? idxObj.name : ''}</span>
            <span class="idx-m-price ${idxObj ? RV.fmt.cls(idxObj.change_pct) : ''}">${idxObj ? RV.fmt.num(idxObj.close) + ' ' + RV.fmt.pct(idxObj.change_pct) : ''}</span>
            <button class="idx-modal-close" aria-label="关闭">${RV.ui.icon('xmark')}</button>
          </div>
          <div class="idx-modal-body">${body}</div>
        </div>`;
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';
        const close = () => { overlay.remove(); document.body.style.overflow = ''; };
        overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
        overlay.querySelector('.idx-modal-close').addEventListener('click', close);
        const esc = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } };
        document.addEventListener('keydown', esc);
      }
      app.querySelectorAll('.idx-card[data-i]').forEach(c => {
        c.addEventListener('click', () => openIdxModal(c.getAttribute('data-i')));
      });
      app.querySelectorAll('.sector-group').forEach(g => {
        g.querySelector('.sector-header').addEventListener('click', () => g.classList.toggle('open'));
      });
      app.querySelectorAll('.nav-link[data-tab]').forEach(a => a.addEventListener('click', ev => {
        ev.preventDefault();
        tab = a.getAttribute('data-tab');
        render();
      }));
      const search = document.getElementById('rc-search');
      if (search) {
        let composing = false;   // 中文输入法组合中：不重建 DOM（否则 IME 被打断）
        search.addEventListener('compositionstart', () => { composing = true; });
        search.addEventListener('compositionend', () => {
          composing = false;
          query = search.value.trim();
          render();
        });
        search.addEventListener('input', () => {
          query = search.value.trim();
          if (composing) return;
          render();
        });
      }
      const clearBtn = document.getElementById('rc-search-clear');
      if (clearBtn) clearBtn.addEventListener('click', ev => {
        ev.preventDefault();
        query = '';
        render();
      });
      // 搜索框焦点/滚动恢复（render 重建 DOM 后保持输入体验）
      window.scrollTo(0, prevScroll);
      if (wasSearching) {
        const el = document.getElementById('rc-search');
        if (el) { const len = el.value.length; el.focus(); el.setSelectionRange(len, len); }
      }
      app.querySelectorAll('.nav-link[data-mod]').forEach(a => a.addEventListener('click', ev => {
        ev.preventDefault();
        mod = a.getAttribute('data-mod');
        render();
      }));
    }
    render();
  } catch (e) {
    app.innerHTML = RV.ui.header('每日推荐', '', 'recommend') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金 · A股</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
  .ff-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .ff-big { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; }
  .ff-sub { font-size:12px; color:var(--text-2); margin-top:4px; }
  .ff-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .ff-note { font-size:11px; color:var(--text-2); margin-top:8px; line-height:1.6; }
  /* 表格：与回测/跟踪页一致（横向滑动 + sticky 表头/首列，无序号，宽度=内容防拉伸空白） */
  .tk-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; min-width:0; }
  .tk-table-wrap .ret-table { font-size:14px; width:max-content; }
  .tk-table-wrap .ret-table th, .tk-table-wrap .ret-table td { padding:10px 14px; white-space:nowrap; text-align:right; line-height:1.6; }
  .tk-table-wrap .ret-table th:first-child, .tk-table-wrap .ret-table td:first-child {
    text-align:left; position:sticky; left:0; z-index:1; background:var(--surface);
    font-weight:700; box-shadow:1px 0 0 var(--border);
    white-space:normal; word-break:break-word; line-height:1.5; height:auto;
    width:auto; max-width:calc(50vw - 46px); min-width:8em;
  }
  .tk-table-wrap .ret-table th:first-child { z-index:3; background:var(--surface-2); }
  .tk-table-wrap .ret-table tbody tr:hover td:first-child { background:var(--surface-2); }
  /* grid 布局下让表格容器正确收缩（否则被内容撑破无法滚动） */
  .two-col > div, .ff-grid > * { min-width:0; }
  /* 机构持仓类型卡片（可展开明细） */
  .inst-type { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .inst-type summary { display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; list-style:none; }
  .inst-type summary::-webkit-details-marker { display:none; }
  .inst-type summary .icon { color:var(--accent); width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:8px; }
  .inst-type summary .label { font-size:13px; font-weight:700; }
  .inst-type summary .count { background:var(--surface-2); padding:2px 8px; border-radius:6px; font-size:12px; color:var(--text-2); }
  .inst-type summary .chev { margin-left:auto; transition:transform .2s; color:var(--text-2); font-size:12px; }
  .inst-type[open] summary .chev { transform:rotate(90deg); }
  .inst-type summary:hover { background:var(--surface-2); }
  .inst-type-body { padding:0 12px 12px; }
  .inst-type-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  @media (max-width:760px) { .inst-type-grid { grid-template-columns:1fr; } }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .sec-title { margin:6px 0 10px; font-size:13px; font-weight:700; color:var(--text-2); display:flex; align-items:center; gap:6px; }
  .sec-title i { color:var(--accent); }
  @media (max-width:760px) { .two-col { grid-template-columns:1fr; } }
  /* 策略回测模块样式 */
  .st-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .st-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .st-num { font-size:clamp(18px, 2.4vw, 26px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; overflow-wrap:anywhere; }
  .st-label { font-size:12px; color:var(--text-2); margin-top:3px; }
  .st-tag { display:inline-block; padding:3px 9px; border-radius:6px; font-size:12px; font-weight:700; margin-left:6px; }
  .st-tag.eff { background:var(--buy-bg); color:var(--buy); }
  .st-tag.bad { background:var(--sell-bg); color:var(--sell); }
  .st-tag.mid { background:var(--watch-bg); color:var(--watch); }
  .st-note { font-size:11px; color:var(--text-2); line-height:1.7; margin-top:10px; }
  .st-verdict { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.8; margin-top:12px; }
  .st-verdict b { color:var(--accent); }
  .hold-compare { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
  .hold-compare > * { min-width:0; }
  .hold-compare .st-grid { grid-template-columns:repeat(auto-fit,minmax(0,1fr)); }
  @media (max-width:760px) { .hold-compare { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.fetch('institution_data.json');
    let s = null;
    try { s = await RV.API.fetch('strategy_results.json'); } catch (e) {}
    const o = d.overview || {};
    const mf = (v) => { if (v === null || v === undefined || isNaN(v)) return '--';
      const neg = v < 0;
      const a = Math.abs(v);
      return (neg ? '-' : '') + (a >= 1e8 ? (a/1e8).toFixed(2) + '亿' : (a >= 1e4 ? (a/1e4).toFixed(1) + '万' : a.toFixed(0))); };
    const cls = v => v > 0 ? 'up' : (v < 0 ? 'down' : 'neutral');

    // ===== 全市场主力资金概览 =====
    const mainNet = o.main_net ?? null;
    const overviewHtml = `
      <div class="section" data-nav="全市场概览" data-nav-icon="chart-column">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-column')}</span><h2>全市场主力资金概览</h2></div>
        <div class="ff-grid">
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">两市主力净流入（${o.basis || '行业板块求和'}）</div>
            <div class="ff-big ${cls(mainNet)}">${mainNet === null ? '--' : mf(mainNet)}</div>
            <div class="ff-sub">主力 = 超大单 + 大单 · 正值流入 / 负值流出</div>
          </div>
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">净流入板块</div>
            <div class="ff-big up">${o.inflow_sectors ?? '--'}</div>
            <div class="ff-sub">/ ${o.sectors ?? '--'} 个行业板块</div>
          </div>
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">净流出板块</div>
            <div class="ff-big down">${o.outflow_sectors ?? '--'}</div>
            <div class="ff-sub">资金面分化的板块数量</div>
          </div>
          ${d.north ? `
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">沪深港通（额度快照）</div>
            <div class="ff-big">${d.north.date || '--'}</div>
            <div class="ff-sub">北向实时净买入已停止披露，仅供参考</div>
          </div>` : ''}
        </div>
        <div class="ff-note">数据源：东方财富资金流向（主力=超大单+大单）。全市场净流入以行业板块主力净流入求和近似。</div>
      </div>`;

    // ===== 板块资金排行 =====
    function rankTable(rows, withPct = true) {
      if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
      return `<div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>名称</th><th>主力净流入</th>${withPct ? '<th>净占比</th><th>涨跌</th>' : ''}</tr></thead><tbody>` +
        rows.map(r => `<tr>
          <td>${r.name || r.code}</td>
          <td class="${cls(r.main_net)}">${mf(r.main_net)}</td>
          ${withPct ? `<td class="${cls(r.main_ratio)}">${RV.fmt.pct(r.main_ratio)}</td>
          <td class="${RV.fmt.cls(r.change_pct)}">${RV.fmt.pct(r.change_pct)}</td>` : ''}
        </tr>`).join('') + '</tbody></table></div>';
    }
    const sector = d.sector || {};
    const sectorHtml = `
      <div class="section" data-nav="板块资金" data-nav-icon="layer-group">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>板块主力资金排行</h2></div>
        <div class="two-col">
          <div><div class="sec-title">${RV.ui.icon('industry')} 行业 · 净流入 Top10</div>${rankTable(sector.industry && sector.industry.inflow)}</div>
          <div><div class="sec-title">${RV.ui.icon('industry')} 行业 · 净流出 Top10</div>${rankTable(sector.industry && sector.industry.outflow)}</div>
        </div>
        <div class="two-col" style="margin-top:14px">
          <div><div class="sec-title">${RV.ui.icon('lightbulb')} 概念 · 净流入 Top10</div>${rankTable(sector.concept && sector.concept.inflow)}</div>
          <div><div class="sec-title">${RV.ui.icon('lightbulb')} 概念 · 净流出 Top10</div>${rankTable(sector.concept && sector.concept.outflow)}</div>
        </div>
      </div>`;

    // ===== 个股资金排行 =====
    const sr = d.stock_rank || {};
    const stockRankHtml = `
      <div class="section" data-nav="个股资金" data-nav-icon="ranking-star">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('ranking-star')}</span><h2>个股主力净流入 / 净流出 Top20</h2></div>
        <div class="two-col">
          <div><div class="sec-title">${RV.ui.icon('arrow-trend-up')} 主力净流入 Top20</div>${rankTable(sr.inflow)}</div>
          <div><div class="sec-title">${RV.ui.icon('arrow-trend-down')} 主力净流出 Top20</div>${rankTable(sr.outflow)}</div>
        </div>
      </div>`;

    // ===== 龙虎榜机构席位 =====
    const bb = d.billboard || {};
    function instTable(rows) {
      if (!rows || !rows.length) return '<div class="empty">当日无机构席位参与</div>';
      return `<div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>股票</th><th>机构买入</th><th>机构卖出</th><th>机构净额</th></tr></thead><tbody>` +
        rows.map(r => `<tr>
          <td>${r.name || r.code}</td>
          <td class="up">${mf(r.inst_buy)}</td>
          <td class="down">${mf(r.inst_sell)}</td>
          <td class="${cls(r.inst_net)}"><b>${mf(r.inst_net)}</b></td>
        </tr>`).join('') + '</tbody></table></div>';
    }
    const billboardHtml = `
      <div class="section" data-nav="龙虎榜机构" data-nav-icon="landmark">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('landmark')}</span><h2>龙虎榜 · 机构专用席位动向</h2></div>
        <div class="ff-card">
          <div style="font-size:12px;color:var(--text-2)">最近交易日：<b>${bb.date || '--'}</b>（机构专用席位净买入/净卖出合并）</div>
          <div class="ff-grid" style="margin-top:10px">
            <div class="ff-card" style="background:var(--surface-2)">
              <div style="font-size:12px;color:var(--text-2)">机构净买入 Top</div>
              ${instTable((bb.net_list || []).filter(x => x.inst_net > 0).slice(0, 10))}
            </div>
            <div class="ff-card" style="background:var(--surface-2)">
              <div style="font-size:12px;color:var(--text-2)">机构净卖出 Top</div>
              ${instTable((bb.net_list || []).filter(x => x.inst_net < 0).slice(0, 10))}
            </div>
          </div>
        </div>
      </div>`;

    // ===== 国家队/机构持股扫描 =====
    const inst = d.institution || {};
    const CAT_LABEL = { central_hj: '中央汇金', central_zj: '证金公司', social_security: '社保基金',
                        pension: '养老金', insurance: '保险机构', qfii: 'QFII/外资', fund: '公募基金',
                        broker: '券商', company: '央企/国家队' };
    const CAT_ICON = { central_hj: 'shield-halved', central_zj: 'shield', social_security: 'umbrella',
                       pension: 'person-cane', insurance: 'house-medical', qfii: 'globe', fund: 'sack-dollar',
                       broker: 'handshake', company: 'flag' };
    const sum = inst.summary || {};
    const nat = inst.national || [];
    const byType = inst.by_type || {};
    function natTable(rows) {
      if (!rows.length) return '<div class="empty">暂无数据</div>';
      const seen = new Set();
      return `<div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>股票</th><th>机构</th><th>持股比例</th><th>变动</th></tr></thead><tbody>` +
        rows.map(r => {
          const key = r.code + r.holder;
          if (seen.has(key)) return '';
          seen.add(key);
          return `<tr><td>${r.name || r.code}</td><td>${r.holder}</td>
            <td>${RV.fmt.num(r.hold_ratio, 2)}%</td>
            <td class="${r.change === '增持' ? 'up' : (r.change === '减持' ? 'down' : '')}">${r.change || '--'}</td></tr>`;
        }).join('') + '</tbody></table></div>';
    }
    // 持仓类型卡片：每类可展开明细
    const summaryCards = Object.entries(CAT_LABEL).map(([k, label]) => {
      const rows = byType[k] || [];
      if (!rows.length) return '';
      return `<details class="inst-type">
        <summary>
          <span class="icon">${RV.ui.icon(CAT_ICON[k] || 'landmark')}</span>
          <span class="label">${label}持仓</span><span class="count">${rows.length}条</span>
          <span class="chev">${RV.ui.icon('chevron-right', 'fa-xs')}</span>
        </summary>
        <div class="inst-type-body">${natTable(rows)}</div>
      </details>`;
    }).join('');
    const natDetail = nat.length ? `
      <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--accent);font-weight:700">
        ${RV.ui.icon('chevron-down', 'fa-xs')} 国家队持仓明细（汇金/证金/社保/养老金 · ${nat.length} 条）</summary>
        <div style="margin-top:8px">${natTable(nat)}</div></details>` : '';
    const instHtml = `
      <div class="section" data-nav="机构持股" data-nav-icon="landmark">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('landmark')}</span><h2>国家队与机构持股扫描</h2></div>
        <div class="ff-note" style="margin-bottom:10px">基于股票池（${d.scanned_codes} 只）最新财报十大流通股东扫描；数据按季度披露，反映存量筹码结构，非当日资金。点击各类型卡片展开持仓明细。</div>
        <div class="inst-type-grid">${summaryCards}</div>
        ${natDetail}
      </div>`;

    // ===== 策略回测模块（2021-08 ~ 2026-08 · 5年，数据缺失时整块隐藏） =====
    const pct1 = v => RV.fmt.pct(v * 100, 1);
    const pct2 = v => RV.fmt.pct(v * 100, 2);
    const A = [['A_1d','持有1日'],['A_5d','持有5日'],['A_10d','持有10日'],['A_20d','持有20日']];
    let stratHtml = '';
    if (s) {
      const overviewRows = A.map(([k, hd]) => {
        const r = s[k];
        if (!r || !r.trades) return '';
        const verdict = r.win_rate >= 0.5 && r.avg_ret > 0 ? '<span class="st-tag eff">有效</span>' :
                        (r.win_rate < 0.45 ? '<span class="st-tag bad">失效</span>' : '<span class="st-tag mid">中性</span>');
        return `<tr><td>龙虎榜机构净买入 → ${hd}</td><td>${r.trades}</td>
          <td class="${cls(r.win_rate - 0.5)}">${(r.win_rate * 100).toFixed(1)}%</td>
          <td class="${cls(r.avg_ret)}">${pct2(r.avg_ret)}</td>
          <td class="${cls(r.median_ret)}">${pct2(r.median_ret)}</td>
          <td class="${cls(r.day_annual)}">${pct1(r.day_annual)}</td><td>${verdict}</td></tr>`;
      }).join('');
      const E = s.E_national;
      const C = s.C_ma20;
      const stratOverview = `
        <div class="section" data-nav="策略总览" data-nav-icon="flask-vial">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('flask-vial')}</span><h2>策略回测总览（2021-08 ~ 2026-08 · 5年）</h2></div>
          <div class="st-card" style="padding:6px 14px">
            <div class="tk-table-wrap"><table class="ret-table">
              <thead><tr><th>策略</th><th>样本数</th><th>胜率</th><th>平均单笔</th><th>中位单笔</th><th>5年组合年化*</th><th>判定</th></tr></thead>
              <tbody>${overviewRows}${E && E.trades ? `
              <tr><td>国家队(社保/汇金/证金/养老)季度增持/新进 → 持有一季度</td><td>${E.trades}</td>
                <td class="${cls(E.win_rate - 0.5)}">${(E.win_rate * 100).toFixed(1)}%</td>
                <td class="${cls(E.avg_ret)}">${pct2(E.avg_ret)}</td>
                <td class="${cls(E.median_ret)}">${pct2(E.median_ret)}</td>
                <td class="${cls(E.day_annual)}">${pct1(E.day_annual)}</td>
                <td><span class="st-tag eff">有效</span></td></tr>` : ''}${C ? `
              <tr><td>沪深300 MA20 趋势择时（对比满仓）</td><td>${C.trades}</td>
                <td>${(C.strategy.win * 100).toFixed(0)}% / ${(C.benchmark.win * 100).toFixed(0)}%</td>
                <td colspan="2" style="color:var(--text-2)">择时 ${pct1(C.strategy.cum)} vs 满仓 ${pct1(C.benchmark.cum)}</td>
                <td class="down">${pct1(C.strategy.annual)}</td>
                <td><span class="st-tag bad">无效</span></td></tr>` : ''}</tbody>
            </table></div>
            <div class="st-note">* 年化为「每日等权组合」口径（当日信号组等权、次日轮换），用于横向比较信号强弱；实际年化需扣除资金占用与滑点。
            单笔收益已含双边 0.1% 成本。主力资金流选股策略因历史资金流接口限流无法回测（未列）。</div>
          </div>
        </div>`;
      const holdCard = (k, hd, note) => {
        const r = s[k];
        if (!r || !r.trades) return '';
        return `<div class="st-card">
          <div style="font-size:13px;font-weight:800">持有 ${hd}${note || ''}</div>
          <div class="st-grid" style="margin-top:10px">
            <div><div class="st-num ${cls(r.avg_ret)}">${pct2(r.avg_ret)}</div><div class="st-label">平均单笔收益</div></div>
            <div><div class="st-num">${(r.win_rate * 100).toFixed(1)}%</div><div class="st-label">胜率</div></div>
            <div><div class="st-num ${cls(r.day_annual)}">${pct1(r.day_annual)}</div><div class="st-label">组合年化</div></div>
            <div><div class="st-num ${cls(r.best)}">${pct2(r.best)}</div><div class="st-label">最好 / 最差 ${pct2(r.worst)}</div></div>
          </div></div>`;
      };
      const A_1d = s.A_1d;
      const bbStrategy = `
        <div class="section" data-nav="龙虎榜策略" data-nav-icon="landmark">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('landmark')}</span><h2>龙虎榜机构净买入策略 · 持有期对比</h2></div>
          <div class="hold-compare">${A.map(([k, hd]) => holdCard(k, hd)).join('')}</div>
          <div class="st-verdict">
            <b>结论：机构净买入是「消息兑现型」短线信号。</b>持有 1 日胜率 56.9%、平均 +1.48%（${s.A_1d ? s.A_1d.trades : 0} 笔样本）；
            持有 5 日已衰减到 +0.42%，10 日转负，20 日胜率仅 38.1%、平均 -1.25%。
            机构上榜买入后 <b>次日冲高即可兑现，绝不长持</b>。
            ${A_1d && A_1d.sample ? '近期样例（T+1）：' + A_1d.sample.slice(0, 5).map(t => t.code + '(' + (t.ret * 100 >= 0 ? '+' : '') + (t.ret * 100).toFixed(1) + '%)').join('、') : ''}
          </div>
        </div>`;
      const natStrategy = `
        <div class="section" data-nav="国家队策略" data-nav-icon="shield-halved">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('shield-halved')}</span><h2>国家队季度增持 / 新进策略</h2></div>
          <div class="st-grid">
            <div class="st-card"><div class="st-num up">${E ? (E.avg_ret * 100).toFixed(2) : '--'}%</div><div class="st-label">平均单季收益（含成本，60交易日）</div></div>
            <div class="st-card"><div class="st-num">${E ? (E.win_rate * 100).toFixed(1) : '--'}%</div><div class="st-label">单季胜率</div></div>
            <div class="st-card"><div class="st-num up">${E ? pct1(E.day_annual) : '--'}</div><div class="st-label">季度调仓组合年化</div></div>
            <div class="st-card"><div class="st-num">${E ? E.trades : '--'}</div><div class="st-label">5年样本数（季度信号）</div></div>
          </div>
          ${E && E.sample ? `
          <div class="st-card" style="padding:6px 14px;margin-top:12px">
            <div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>股票</th><th>机构</th><th>变动</th><th>信号日</th><th>单季收益</th></tr></thead><tbody>
            ${E.sample.map(t => `<tr><td>${t.code}</td><td>${t.holder}</td><td>${t.chg}</td><td>${t.date}</td>
              <td class="${cls(t.ret)}">${pct2(t.ret)}</td></tr>`).join('')}</tbody></table></div>
          </div>` : ''}
          <div class="st-verdict">
            <b>结论：国家队（社保/汇金/证金/养老金）增持/新进是有效的中线信号。</b>${E ? E.trades : 0} 个季度信号平均 +6.98%/季，胜率 51.2%，
            显著优于市场。适用周期为一季度（约 60 交易日）。注意：回测按季报截止日买入，实际披露滞后约一个月，实盘收益略低于回测。
          </div>
        </div>`;
      const th = (s.D_overheat || {}).thresholds || {};
      const overheatRows = Object.entries(th).map(([k, t]) => {
        const f1 = t.fwd1, f5 = t.fwd5, f10 = t.fwd10;
        return `<tr><td>≥${(t.threshold * 100).toFixed(1)}%</td><td>${(t.days || []).length}</td>
          <td class="${cls(f1.avg)}">${pct2(f1.avg)}<br><small>胜率${(f1.win * 100).toFixed(0)}%</small></td>
          <td class="${cls(f5.avg)}">${pct2(f5.avg)}<br><small>胜率${(f5.win * 100).toFixed(0)}%</small></td>
          <td class="${cls(f10.avg)}">${pct2(f10.avg)}<br><small>胜率${(f10.win * 100).toFixed(0)}%</small></td></tr>`;
      }).join('');
      const overheat = `
        <div class="section" data-nav="普涨过热" data-nav-icon="fire">
          <div class="section-title"><span class="title-icon">${RV.ui.icon('fire')}</span><h2>普涨过热日统计（上证指数大涨后指数表现）</h2></div>
          <div class="st-card" style="padding:6px 14px">
            <div class="tk-table-wrap"><table class="ret-table">
              <thead><tr><th>上证单日涨幅</th><th>过热日数</th><th>后1日</th><th>后5日</th><th>后10日</th></tr></thead>
              <tbody>${overheatRows}</tbody>
            </table></div>
            <div class="st-verdict">
              <b>结论：指数层面普涨后惯性向上而非回踩</b>（≥2% 时后5日平均 +1.48%、胜率 64%；≥3% 后1日胜率 86%）。
              但个股层面普涨日买入成本高，普涨次日分歧仍是常态，「普涨降级闸门」保留合理性——不必恐慌减仓，也不宜追高。
            </div>
          </div>
        </div>`;
      stratHtml = stratOverview + bbStrategy + natStrategy + overheat;
    }

    app.innerHTML = RV.ui.header('资金', '主力资金 · 龙虎榜机构 · 策略回测 · 国家队持股', 'institution', d.generatedAt)
      + overviewHtml + sectorHtml + stockRankHtml + billboardHtml + stratHtml + instHtml
      + '<footer>主力=超大单+大单 · 龙虎榜/股东数据来自交易所披露 · 回测含双边0.1%成本 · 数据仅供学习研究，不构成投资建议</footer>';
    RV.ui.initSidebar();
  } catch (e) {
    app.innerHTML = RV.ui.header('资金', '', 'institution') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

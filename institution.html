<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金 · A股</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
  .ff-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .ff-big { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; }
  .ff-sub { font-size:12px; color:var(--text-2); margin-top:4px; }
  .ff-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .ff-note { font-size:11px; color:var(--text-2); margin-top:8px; line-height:1.6; }
  /* 表格：与回测/跟踪页一致（横向滑动 + sticky 表头/首列，无序号，宽度=内容防拉伸空白） */
  .tk-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; min-width:0; }
  .tk-table-wrap .ret-table { font-size:14px; width:max-content; }
  .tk-table-wrap .ret-table th, .tk-table-wrap .ret-table td { padding:10px 14px; white-space:nowrap; text-align:right; line-height:1.6; }
  .tk-table-wrap .ret-table th:first-child, .tk-table-wrap .ret-table td:first-child {
    text-align:left; position:sticky; left:0; z-index:1; background:var(--surface);
    font-weight:700; box-shadow:1px 0 0 var(--border);
    white-space:normal; word-break:break-word; line-height:1.5; height:auto;
    width:auto; max-width:calc(50vw - 46px); min-width:8em;
  }
  .tk-table-wrap .ret-table th:first-child { z-index:3; background:var(--surface-2); }
  .tk-table-wrap .ret-table tbody tr:hover td:first-child { background:var(--surface-2); }
  /* grid 布局下让表格容器正确收缩（否则被内容撑破无法滚动） */
  .two-col > div, .ff-grid > * { min-width:0; }
  /* 机构持仓类型卡片（可展开明细） */
  .inst-type { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .inst-type summary { display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; list-style:none; }
  .inst-type summary::-webkit-details-marker { display:none; }
  .inst-type summary .icon { color:var(--accent); width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:8px; }
  .inst-type summary .label { font-size:13px; font-weight:700; }
  .inst-type summary .count { background:var(--surface-2); padding:2px 8px; border-radius:6px; font-size:12px; color:var(--text-2); }
  .inst-type summary .chev { margin-left:auto; transition:transform .2s; color:var(--text-2); font-size:12px; }
  .inst-type[open] summary .chev { transform:rotate(90deg); }
  .inst-type summary:hover { background:var(--surface-2); }
  .inst-type-body { padding:0 12px 12px; }
  .inst-type-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  @media (max-width:760px) { .inst-type-grid { grid-template-columns:1fr; } }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .sec-title { margin:6px 0 10px; font-size:13px; font-weight:700; color:var(--text-2); display:flex; align-items:center; gap:6px; }
  .sec-title i { color:var(--accent); }
  @media (max-width:760px) { .two-col { grid-template-columns:1fr; } }
  /* 策略回测模块样式 */
  .st-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .st-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .st-num { font-size:clamp(18px, 2.4vw, 26px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.3; overflow-wrap:anywhere; }
  .st-num-sub { font-size:0.62em; font-weight:700; display:block; }
  .st-label { font-size:12px; color:var(--text-2); margin-top:3px; }
  .st-tag { display:inline-block; padding:3px 9px; border-radius:6px; font-size:12px; font-weight:700; margin-left:6px; }
  .st-tag.eff { background:var(--buy-bg); color:var(--buy); }
  .st-tag.bad { background:var(--sell-bg); color:var(--sell); }
  .st-tag.mid { background:var(--watch-bg); color:var(--watch); }
  .st-note { font-size:11px; color:var(--text-2); line-height:1.7; margin-top:10px; }
  .st-verdict { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.8; margin-top:12px; }
  .st-verdict b { color:var(--accent); }
  .hold-compare { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
  .hold-compare > * { min-width:0; }
  .hold-compare .st-grid { grid-template-columns:repeat(auto-fit,minmax(0,1fr)); }
  @media (max-width:760px) { .hold-compare { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js"></script>
<script src="assets/js/rvui.js?v=2"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.fetch('institution_data.json');
    let s = null;
    try { s = await RV.API.fetch('strategy_results.json'); } catch (e) {}
    const o = d.overview || {};
    const mf = (v) => { if (v === null || v === undefined || isNaN(v)) return '--';
      const neg = v < 0;
      const a = Math.abs(v);
      return (neg ? '-' : '') + (a >= 1e8 ? (a/1e8).toFixed(2) + '亿' : (a >= 1e4 ? (a/1e4).toFixed(1) + '万' : a.toFixed(0))); };
    const cls = v => v > 0 ? 'up' : (v < 0 ? 'down' : 'neutral');

    // ===== 股票详情弹窗：点击股票名查看当日行情 + 持仓 + 迷你K线 =====
    function stockModal(x) {
      const money = v => (v > 0 ? '+' : '') + RV.fmt.money(v);
      const kv = (k, v, c = '') => `<div class="it-row"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`;
      const rows = [
        kv('代码', x.code || x.ticker || '--'),
        kv('现价', x.price != null ? RV.fmt.num(x.price, x.price < 5 ? 3 : 2) : '--', cls(x.change_pct)),
        kv('当日涨跌', x.change_pct != null ? RV.fmt.pct(x.change_pct) : '--', cls(x.change_pct)),
      ];
      if (x.inst_net != null) rows.push(kv('机构净买', mf(x.inst_net), cls(x.inst_net)));
      if (x.inst_buy != null) rows.push(kv('机构买入 / 卖出', mf(x.inst_buy) + ' / ' + mf(x.inst_sell), cls(x.inst_net)));
      if (x.hold_ratio != null) rows.push(kv('持股比例', RV.fmt.num(x.hold_ratio, 2) + '%'));
      if (x.change != null) rows.push(kv('持仓变动', String(x.change), cls(x.change_ratio || 0)));
      if (x.holder) rows.push(kv('机构', x.holder));
      if (x.report) rows.push(kv('报告期', x.report + ' · ' + (x.end_date || '')));
      if (x.amount != null) rows.push(kv('成交额', RV.fmt.amount(x.amount)));
      if (x.turnover != null) rows.push(kv('换手率', RV.fmt.num(x.turnover, 2) + '%'));
      if (x.heat != null) rows.push(kv('热度', RV.fmt.num(x.heat)));
      if (x.limit_up_times != null) rows.push(kv('连板', x.limit_up_times));
      if (x.analysis_content) rows.push(kv('异动原因', x.analysis_content));
      const overlay = document.createElement('div');
      overlay.className = 'idx-modal-overlay';
      overlay.innerHTML = `<div class="idx-modal">
        <div class="idx-modal-head">
          <span class="idx-m-name">${x.name || x.ticker || ''} <span style="font-size:12px;color:var(--text-2)">${x.code || x.ticker || ''}</span></span>
          <span class="idx-m-price ${cls(x.change_pct)}">${x.price != null ? RV.fmt.num(x.price, x.price < 5 ? 3 : 2) : '--'} ${x.change_pct != null ? RV.fmt.pct(x.change_pct) : ''}</span>
          <button class="idx-modal-close" aria-label="关闭">${RV.ui.icon('xmark')}</button>
        </div>
        <div class="idx-modal-body">
          <div class="card-kv" style="display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:13px">${rows.join('')}</div>
          <div id="inst-kline-${x.code || x.ticker}" style="width:100%;height:200px;margin-top:12px"></div>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      const close = () => { overlay.remove(); document.body.style.overflow = ''; };
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      overlay.querySelector('.idx-modal-close').addEventListener('click', close);
      const esc = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } };
      document.addEventListener('keydown', esc);
      // 迷你K线
      const code6 = String(x.code || x.ticker || '').replace(/\D/g, '').padStart(6, '0').slice(-6);
      if (code6 && window.RV.loadEcharts) {
        window.RV.loadEcharts().then(() => {
          fetch('data/cache/kline_' + code6 + '.json').then(r => r.ok ? r.json() : null)
            .then(k => {
              if (!k || !k.closes || !k.closes.length) return;
              const el = document.getElementById('inst-kline-' + (x.code || x.ticker));
              if (!el || !window.echarts) return;
              const ch = window.echarts.init(el);
              const n = k.closes.length;
              const dates = k.dates.slice(Math.max(0, n - 120));
              const closes = k.closes.slice(Math.max(0, n - 120));
              ch.setOption({
                animation: false, tooltip: { trigger: 'axis' },
                grid: { left: 10, right: 10, top: 24, bottom: 20, containLabel: true },
                xAxis: { type: 'category', data: dates, boundaryGap: false, axisLabel: { color: '#6b6258', fontSize: 10, interval: Math.max(0, Math.ceil(dates.length / 6) - 1) } },
                yAxis: { type: 'value', scale: true, axisLabel: { color: '#6b6258', fontSize: 10 } },
                dataZoom: [{ type: 'inside' }],
                series: [{ name: '收盘', type: 'line', data: closes, showSymbol: false, lineStyle: { width: 1.6, color: '#5b8fd6' }, itemStyle: { color: '#5b8fd6' } }],
              });
            }).catch(() => {});
        }).catch(() => {});
      }
    }

    // 股票名链接：可点击弹详情
    function stockLink(x) {
      const code = x.code || x.ticker || '';
      return `<a href="#" class="stock-link" data-code="${code}" style="color:inherit;text-decoration:none" title="点击查看详情">${x.name || code}</a>`;
    }
    // 当日涨跌单元格
    function chgCell(x) {
      if (x.change_pct == null) return '';
      return `<td class="${cls(x.change_pct)}" style="font-weight:700">${RV.fmt.pct(x.change_pct)}</td>`;
    }

    // ===== 全市场主力资金概览 =====
    const mainNet = o.main_net ?? null;
    const overviewHtml = `
      <div class="section" data-nav="全市场概览" data-nav-icon="chart-column">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-column')}</span><h2>全市场主力资金概览</h2></div>
        <div class="ff-grid">
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">两市主力净流入（${o.basis || '行业板块求和'}）</div>
            <div class="ff-big ${cls(mainNet)}">${mainNet === null ? '--' : mf(mainNet)}</div>
            <div class="ff-sub">主力 = 超大单 + 大单 · 正值流入 / 负值流出</div>
          </div>
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">净流入板块</div>
            <div class="ff-big up">${o.inflow_sectors ?? '--'}</div>
            <div class="ff-sub">/ ${o.sectors ?? '--'} 个行业板块</div>
          </div>
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">净流出板块</div>
            <div class="ff-big down">${o.outflow_sectors ?? '--'}</div>
            <div class="ff-sub">资金面分化的板块数量</div>
          </div>
          ${d.north ? `
          <div class="ff-card">
            <div style="font-size:12px;color:var(--text-2)">沪深港通（额度快照）</div>
            <div class="ff-big">${d.north.date || '--'}</div>
            <div class="ff-sub">北向实时净买入已停止披露，仅供参考</div>
          </div>` : ''}
        </div>
        <div class="ff-note">数据源：东方财富资金流向（主力=超大单+大单）。全市场净流入以行业板块主力净流入求和近似。</div>
      </div>`;

    // ===== 板块资金速览：一眼看清资金去向（卡片式） =====
    function fundQuick() {
      const ind = (d.sector || {}).industry || {};
      const inn = (ind.inflow || []).slice(0, 6);
      const out = (ind.outflow || []).slice(0, 6);
      if (!inn.length && !out.length) return '';
      const maxAbs = Math.max(1, ...inn.concat(out).map(x => Math.abs(x.main_net || 0)));
      const bar = (x, color) => {
        const w = Math.min(100, Math.abs(x.main_net || 0) / maxAbs * 100);
        return `<div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="flex:0 0 74px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.name || ''}</span>
          <div style="flex:1;height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative">
            <div style="width:${w}%;height:100%;background:${color};opacity:.85"></div>
            <span style="position:absolute;left:${Math.min(w + 3, 92)}%;top:50%;transform:translateY(-50%);font-size:10px;white-space:nowrap;color:var(--text-2)">${RV.fmt.pct(x.change_pct)}</span>
          </div>
          <span style="flex:0 0 64px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:${color}">${mf(x.main_net)}</span>
        </div>`;
      };
      return `<div class="section" data-nav="资金速览" data-nav-icon="gauge-high">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('gauge-high')}</span><h2>板块资金速览 · 钱去哪了</h2>
          <span class="sec-chip">主力净额 <b class="${cls(mainNet)}">${mf(mainNet)}</b></span></div>
        <div class="fund-quick-grid">
          <div>
            <div class="sec-title">${RV.ui.icon('arrow-trend-up')} 净流入 Top6 <span style="font-size:11px;color:var(--text-2)">（条=流入规模，右侧=板块涨跌）</span></div>
            ${inn.map(x => bar(x, 'var(--up,#dc2626)')).join('') || '<div class="empty">暂无</div>'}
          </div>
          <div>
            <div class="sec-title">${RV.ui.icon('arrow-trend-down')} 净流出 Top6 <span style="font-size:11px;color:var(--text-2)">（条=流出规模，右侧=板块涨跌）</span></div>
            ${out.map(x => bar(x, 'var(--down,#16a34a)')).join('') || '<div class="empty">暂无</div>'}
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-2);margin-top:10px">${RV.ui.icon('circle-info', 'fa-xs')} 资金速览是市场风格切换的第一信号：流出板块（高位）→ 流入板块（低位/防御）的高低切，通常领先指数方向。</div>
      </div>`;
    }

    // ===== 板块资金排行 =====
    function rankTable(rows, withPct = true) {
      if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
      return `<div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>名称</th>${withPct ? '<th>当日</th><th>主力净流入</th><th>净占比</th>' : '<th>主力净流入</th>'}</tr></thead><tbody>` +
        rows.map(r => `<tr>
          <td>${stockLink(r)}</td>
          ${withPct ? `<td class="${cls(r.change_pct)}">${RV.fmt.pct(r.change_pct)}</td>` : ''}
          <td class="${cls(r.main_net)}">${mf(r.main_net)}</td>
          ${withPct ? `<td class="${cls(r.main_ratio)}">${RV.fmt.pct(r.main_ratio)}</td>` : ''}
        </tr>`).join('') + '</tbody></table></div>';
    }
    const sector = d.sector || {};
    const sectorHtml = `
      <div class="section" data-nav="板块资金" data-nav-icon="layer-group">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>板块主力资金排行</h2></div>
        <div class="two-col">
          <div><div class="sec-title">${RV.ui.icon('industry')} 行业 · 净流入 Top10</div>${rankTable(sector.industry && sector.industry.inflow)}</div>
          <div><div class="sec-title">${RV.ui.icon('industry')} 行业 · 净流出 Top10</div>${rankTable(sector.industry && sector.industry.outflow)}</div>
        </div>
        <div class="two-col" style="margin-top:14px">
          <div><div class="sec-title">${RV.ui.icon('lightbulb')} 概念 · 净流入 Top10</div>${rankTable(sector.concept && sector.concept.inflow)}</div>
          <div><div class="sec-title">${RV.ui.icon('lightbulb')} 概念 · 净流出 Top10</div>${rankTable(sector.concept && sector.concept.outflow)}</div>
        </div>
      </div>`;

    // ===== 个股资金排行 =====
    const sr = d.stock_rank || {};
    const stockRankHtml = `
      <div class="section" data-nav="个股资金" data-nav-icon="ranking-star">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('ranking-star')}</span><h2>个股主力净流入 / 净流出 Top20</h2></div>
        <div class="two-col">
          <div><div class="sec-title">${RV.ui.icon('arrow-trend-up')} 主力净流入 Top20</div>${rankTable(sr.inflow)}</div>
          <div><div class="sec-title">${RV.ui.icon('arrow-trend-down')} 主力净流出 Top20</div>${rankTable(sr.outflow)}</div>
        </div>
      </div>`;

    // ===== 龙虎榜机构席位 =====
    const bb = d.billboard || {};
    function instTable(rows) {
      if (!rows || !rows.length) return '<div class="empty">当日无机构席位参与</div>';
      return `<div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>股票</th><th>当日</th><th>机构买入</th><th>机构卖出</th><th>机构净额</th></tr></thead><tbody>` +
        rows.map(r => `<tr>
          <td>${stockLink(r)}</td>
          ${chgCell(r)}
          <td class="up">${mf(r.inst_buy)}</td>
          <td class="down">${mf(r.inst_sell)}</td>
          <td class="${cls(r.inst_net)}"><b>${mf(r.inst_net)}</b></td>
        </tr>`).join('') + '</tbody></table></div>';
    }

    // ===== 机构资金明确标的（龙虎榜机构净买 + 国家队增持 + 机构增持） =====
    function instPicks() {
      const picks = [];
      (d.billboard.net_list || [])
        .filter(x => (x.inst_net || 0) > 0)
        .sort((a, b) => b.inst_net - a.inst_net)
        .slice(0, 8)
        .forEach(x => picks.push({ code: x.code, name: x.name, type: '龙虎榜机构净买', value: x.inst_net, unit: '元', change_pct: x.change_pct, price: x.price, inst_buy: x.inst_buy, inst_sell: x.inst_sell, inst_net: x.inst_net, amount: x.amount, turnover: x.turnover }));
      const nat = (d.institution && d.institution.national) || [];
      const seen = {};
      nat
        .filter(x => {
          const r = x.change_ratio || 0;
          const c = String(x.change || '');
          return r > 0.5 || c.includes('增') || c.includes('新进') || c.includes('增加');
        })
        .sort((a, b) => (b.change_ratio || 0) - (a.change_ratio || 0))
        .slice(0, 8)
        .forEach(x => {
          if (seen[x.code]) return;
          seen[x.code] = 1;
          picks.push({ code: x.code, name: x.name, type: '国家队·' + (x.holder_type || '机构'), value: x.change_ratio || 0, unit: '%', detail: (x.holder || '') + ' ' + (x.report || ''), change_pct: x.change_pct, price: x.price, hold_ratio: x.hold_ratio, change: x.change, holder: x.holder, report: x.report, end_date: x.end_date });
        });
      const bt = (d.institution && d.institution.by_type) || {};
      const best = {};
      Object.values(bt).forEach(list => {
        (list || []).forEach(x => {
          const r = x.change_ratio || 0;
          if (r <= 0.5) return;
          if (!best[x.code] || r > best[x.code].r) best[x.code] = { code: x.code, name: x.name, r, holder: x.holder_type || '', report: x.report || '' };
        });
      });
      Object.values(best).sort((a, b) => b.r - a.r).slice(0, 8).forEach(x => {
        if (seen[x.code]) return;
        seen[x.code] = 1;
        picks.push({ code: x.code, name: x.name, type: '机构增持·' + (x.holder || ''), value: x.r, unit: '%', detail: x.report, change_pct: x.change_pct, price: x.price, hold_ratio: x.hold_ratio, change: x.change, holder: x.holder, report: x.report, end_date: x.end_date });
      });
      if (!picks.length) return '';
      const rows = picks.map((p, i) => `
        <tr>

        </div>` : ''}
        ${skyRows ? `<div class="st-card" style="padding:6px 14px;margin-top:12px">
          <div class="sec-title">${RV.ui.icon('rocket')} 飙升榜 Top30</div>
          <div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>#</th><th>股票</th><th>现价</th><th>涨跌幅</th></tr></thead><tbody>${skyRows}</tbody></table></div>
        </div>` : ''}
        ${luRows ? `<div class="st-card" style="padding:6px 14px;margin-top:12px">
          <div class="sec-title">${RV.ui.icon('bolt')} 涨停池（${lu.date || ''}）</div>
          <div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>股票</th><th>连板</th><th>现价</th></tr></thead><tbody>${luRows}</tbody></table></div>
        </div>` : ''}
        ${anomRows ? `<div class="st-card" style="padding:6px 14px;margin-top:12px">
          <div class="sec-title">${RV.ui.icon('triangle-exclamation')} 当日个股异动（${(ths.anomaly || []).length} 条）</div>
          <div class="tk-table-wrap"><table class="ret-table"><thead><tr><th>股票</th><th>异动原因</th></tr></thead><tbody>${anomRows}</tbody></table></div>
        </div>` : ''}
        <div class="ff-note">数据源：同花顺官方金融数据服务（fuyao.aicubes.cn）。</div>
      </div>`;
    }

    app.innerHTML = RV.ui.header('资金', '主力资金 · 龙虎榜机构 · 策略回测 · 国家队持股', 'institution', d.generatedAt)
      + overviewHtml + fundQuick() + instPicks() + sectorHtml + stockRankHtml + billboardHtml + stratHtml + instHtml
      + thsSection()
      + '<footer>主力=超大单+大单 · 龙虎榜/股东数据来自交易所披露 · 回测含双边0.1%成本 · 数据仅供学习研究，不构成投资建议</footer>';
    RV.ui.initSidebar();

    // 股票名点击 → 详情弹窗
    document.addEventListener('click', e => {
      const link = e.target.closest('.stock-link[data-code]');
      if (!link) return;
      e.preventDefault();
      e.stopPropagation();
      const code = link.getAttribute('data-code');
      // 在 d 各列表中找该股票对象
      let hit = null;
      const scan = (x) => { if (!hit && x && (x.code === code || x.ticker === code)) hit = x; };
      (d.billboard.net_list || []).forEach(scan);
      (d.billboard.buys || []).forEach(scan);
      (d.billboard.sells || []).forEach(scan);
      (d.institution.national || []).forEach(scan);
      Object.values(d.institution.by_type || {}).forEach(l => (l || []).forEach(scan));
      Object.values(d.ths || {}).forEach(v => {
        const items = (v && v.items) || (Array.isArray(v) ? v : null);
        (items || []).forEach(scan);
      });
      // 统一个股卡：优先走全局悬浮专业行情卡；失败回退旧 modal
      if (code && typeof window.__stock === 'function') { try { window.__stock(code); return; } catch (err) {} }
      if (hit) stockModal(hit);
    });
  } catch (e) {
    app.innerHTML = RV.ui.header('资金', '', 'institution') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持仓跟踪 · 盘中/盘后</title>
<link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const d = await RV.API.holdings();
    const items = d.items || [];

    // 操作徽章（对齐推荐页网格提醒）
    const ACTION_META = {
      clear:  { icon: 'right-from-bracket',  cls: 'down',  label: '超涨清仓' },
      buy:    { icon: 'cart-plus',           cls: 'up',    label: '逢低加仓' },
      reduce: { icon: 'cart-shopping',       cls: 'down',  label: '逢高减仓' },
      hold:   { icon: 'pause',               cls: 'neutral', label: '持有观察' },
      wait:   { icon: 'hourglass-half',      cls: 'neutral', label: '空仓等待' },
    };
    function actionBadge(g) {
      if (!g) return RV.ui.signalBadge('watch', '--');
      const m = ACTION_META[g.action_key] || { icon: 'question', cls: 'neutral' };
      const label = g.action || m.label;
      return `<span class="signal-badge s-${g.action_key}">${RV.ui.icon(m.icon, 'fa-xs')} ${label}</span>`;
    }

    // 汇总卡片
    const dayPnlCls = RV.fmt.cls(d.total_day_pnl || 0);
    const totalPnlCls = RV.fmt.cls(d.total_pnl || 0);
    const pnlMoney = (v) => {
      if (v === null || v === undefined || isNaN(v)) return '--';
      return (v > 0 ? '+' : '') + RV.fmt.money(v);
    };
    const summary = `
      <div class="summary-grid">
        ${RV.ui.summaryCard('wallet', RV.fmt.money(d.total_market), '总市值')}
        ${RV.ui.summaryCard('chart-line', items.length + ' 只', '持仓标的')}
        ${RV.ui.summaryCard('calendar-day', `<span class="${dayPnlCls}">${pnlMoney(d.total_day_pnl)}</span>`, '今日盈亏')}
        ${RV.ui.summaryCard('piggy-bank', `<span class="${totalPnlCls}">${pnlMoney(d.total_pnl)}</span>`, '累计盈亏')}
      </div>`;

    // 持仓详情弹窗：点击股票名查看完整信息 + 迷你K线
    function stockDetailModal(p) {
      const g = p.grid || {};
      const money = v => (v > 0 ? '+' : '') + RV.fmt.money(v);
      const kv = (k, v, cls = '') => `<div class="it-row"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
      const rows = [
        kv('代码', p.code),
        kv('现价', RV.fmt.num(p.price, p.price < 5 ? 3 : 2), RV.fmt.cls(p.change_pct)),
        kv('当日涨跌', RV.fmt.pct(p.change_pct), RV.fmt.cls(p.change_pct)),
        kv('持仓份额', RV.fmt.num(p.shares, 0)),
        kv('成本均价', p.cost ? RV.fmt.num(p.cost, 3) : '--'),
        kv('当日盈亏', money(p.day_pnl), RV.fmt.cls(p.day_pnl)),
        kv('持仓市值', RV.fmt.money(p.market_value)),
        kv('累计盈亏', money(p.total_pnl) + (p.total_pnl_pct != null ? ' (' + RV.fmt.pct(p.total_pnl_pct) + ')' : ''), totalPnlCls),
      ];
      if (g.action || g.reason) {
        rows.push(kv('网格建议', g.action || '--'));
        rows.push(`<div style="color:var(--text-2);font-size:11px;line-height:1.5;padding:4px 0">${RV.ui.icon('grid-2', 'fa-xs')} ${g.reason || '--'}</div>`);
      }
      const overlay = document.createElement('div');
      overlay.className = 'idx-modal-overlay';
      overlay.innerHTML = `<div class="idx-modal">
        <div class="idx-modal-head">
          <span class="idx-m-name">${p.name} <span style="font-size:12px;color:var(--text-2)">${p.code}</span></span>
          <span class="idx-m-price ${RV.fmt.cls(p.change_pct)}">${RV.fmt.num(p.price, p.price < 5 ? 3 : 2)} ${RV.fmt.pct(p.change_pct)}</span>
          <button class="idx-modal-close" aria-label="关闭">${RV.ui.icon('xmark')}</button>
        </div>
        <div class="idx-modal-body">
          <div class="card-kv" style="display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:13px">${rows.join('')}</div>
          <div id="hd-kline-${p.code}" style="width:100%;height:220px;margin-top:12px"></div>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      const close = () => { overlay.remove(); document.body.style.overflow = ''; };
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      overlay.querySelector('.idx-modal-close').addEventListener('click', close);
      const esc = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } };
      document.addEventListener('keydown', esc);
      // 迷你K线（复用 echarts 加载器）
      const loadEcharts = window.RV.loadEcharts || (() => Promise.reject(new Error('echarts 未就绪')));
      loadEcharts().then(() => {
        fetch('data/cache/kline_' + p.code + '.json')
          .then(r => r.ok ? r.json() : null)
          .then(k => { if (!k || !k.closes || !k.closes.length) return; renderKline(p.code, k); })
          .catch(() => {});
      }).catch(() => {});
      function renderKline(code, k) {
        const el = document.getElementById('hd-kline-' + code);
        if (!el || !window.echarts) return;
        const ch = window.echarts.init(el);
        const n = k.closes.length;
        const dates = k.dates.slice(Math.max(0, n - 120));
        const closes = k.closes.slice(Math.max(0, n - 120));
        const ma5 = closes.map((_, i) => i < 4 ? null : +(closes.slice(i - 4, i + 1).reduce((a, b) => a + b, 0) / 5).toFixed(3));
        const ma20 = closes.map((_, i) => i < 19 ? null : +(closes.slice(i - 19, i + 1).reduce((a, b) => a + b, 0) / 20).toFixed(3));
        ch.setOption({
          animation: false,
          tooltip: { trigger: 'axis' },
          grid: { left: 10, right: 10, top: 24, bottom: 20, containLabel: true },
          xAxis: { type: 'category', data: dates, boundaryGap: false, axisLabel: { color: '#6b6258', fontSize: 10, interval: Math.max(0, Math.ceil(dates.length / 6) - 1) } },
          yAxis: { type: 'value', scale: true, axisLabel: { color: '#6b6258', fontSize: 10 } },
          dataZoom: [{ type: 'inside' }],
          series: [
            { name: '收盘', type: 'line', data: closes, showSymbol: false, lineStyle: { width: 1.6, color: '#5b8fd6' }, itemStyle: { color: '#5b8fd6' } },
            { name: 'MA5', type: 'line', data: ma5, showSymbol: false, lineStyle: { width: 1, color: '#e8a33d' } },
            { name: 'MA20', type: 'line', data: ma20, showSymbol: false, lineStyle: { width: 1, color: '#dc2626' } },
          ],
        });
      }
    }

    // 股票名可点击弹详情
    function nameLink(p) {
      return `<a href="#" class="stock-link" data-hd-code="${p.code}" style="color:inherit;text-decoration:none" title="点击查看详情">${p.name}</a>`;
    }

    // 持仓卡片
    const cards = items.map((p, i) => {
      const g = p.grid || {};
      return `
      <div class="card">
        <div class="card-header">
          <div><span class="card-title">${nameLink(p)}</span> <span class="sec-chip">${p.sector || ''}</span> <span class="date-tag">${p.code}</span></div>
          ${actionBadge(p.grid)}
        </div>
        <div class="card-summary">
          <span class="cs-item"><i>现价</i><b>${RV.fmt.num(p.price, p.price < 5 ? 3 : 2)}</b></span>
          <span class="cs-item"><i>涨幅</i><b class="${RV.fmt.cls(p.change_pct)}">${RV.fmt.pct(p.change_pct)}</b></span>
          <span class="cs-item"><i>市值</i><b>${RV.fmt.money(p.market_value)}</b></span>
          <span class="cs-item"><i>今日盈亏</i><b class="${RV.fmt.cls(p.day_pnl)}">${pnlMoney(p.day_pnl)}</b></span>
        </div>
        <div class="card-detail">
        <div class="points" style="grid-template-columns:repeat(3,1fr)">
          <div class="point"><span class="p-label">持仓</span><span class="p-val">${RV.fmt.num(p.shares, 0)}</span></div>
          <div class="point"><span class="p-label">市值</span><span class="p-val">${RV.fmt.money(p.market_value)}</span></div>
          <div class="point"><span class="p-label">成本</span><span class="p-val">${p.cost ? RV.fmt.num(p.cost, 3) : '--'}</span></div>
          <div class="point"><span class="p-label">累计盈亏</span><span class="p-val ${RV.fmt.cls(p.total_pnl)}">${pnlMoney(p.total_pnl)} (${RV.fmt.pct(p.total_pnl_pct)})</span></div>
        </div>
        ${g.dev !== undefined && g.dev !== null ? `
        <div class="reason" style="margin-top:10px">${RV.ui.icon('grid-2', 'fa-xs')} 网格：${g.reason}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    // 网格提醒区块（操作优先级排序后的明细）
    const reminderRows = items.map((p, i) => {
      const g = p.grid || {};
      const dev = g.dev;
      return `
      <tr>
        <td class="asset-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${p.name}${RV.ui.heatBtn(p.code, p.name, 'stock')}</td>
        <td>${actionBadge(p.grid)}</td>
        <td style="font-weight:800">${dev !== null && dev !== undefined ? RV.fmt.pct(dev * 100, 1) : '--'}</td>
        <td>${g.target_pos != null ? RV.fmt.num(g.target_pos * 100, 0) + '%' : '--'}</td>
        <td>${g.grid_idx ?? '--'}</td>
        <td style="max-width:300px;font-size:12px;color:var(--text-2)">${g.reason || '--'}</td>
      </tr>`;
    }).join('');

    const reminderTable = items.length ? `
      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('grid-2')}</span><h2>网格策略 · 操作提醒</h2>
          ${RV.ui.infoDot('口径：均值线 = 750日滚动分位估值锚（PE/PB/ROE），无估值退化为价格均线。仓位 = 均衡70% − 斜率×偏离度，每涨0.5%抛1%、每跌0.5%买1.04%。偏离≤−5%半永久锁仓加仓，≥+5%超涨清仓。目标仓位为策略理论值。')}
        </div>
        <div class="table-desktop"><div class="table-wrap"><table class="data-table">
          <thead><tr><th>标的</th><th>操作建议</th><th>偏离均值线</th><th>目标仓位</th><th>网格档</th><th>说明</th></tr></thead>
          <tbody>${reminderRows}</tbody></table></div></div>
        <div class="cards-mobile"><div class="mini-cards">${items.map((p, i) => {
          const g = p.grid || {};
          const devCls = RV.fmt.cls(g.dev);
          return `
          <div class="mini-card">
            <div class="mini-head">
              <span class="mini-name"><span class="row-num">${String(i + 1).padStart(2, '0')}</span>${p.name}${RV.ui.heatBtn(p.code, p.name, 'stock')}</span>
              <span class="mini-head-right">${actionBadge(p.grid)}</span>
            </div>
            <div class="mini-kv">
              <span class="k">偏离均值线</span><span class="v ${devCls}">${g.dev !== null && g.dev !== undefined ? RV.fmt.pct(g.dev * 100, 1) : '--'}</span>
              <span class="k">目标仓位</span><span class="v">${g.target_pos != null ? RV.fmt.num(g.target_pos * 100, 0) + '%' : '--'}</span>
            </div>
            <div class="reason" style="margin-top:10px;font-size:12px">${RV.ui.icon('grid-2', 'fa-xs')} ${g.reason || '--'}</div>
          </div>`;
        }).join('')}</div></div>
      </div>` : '';

    // 配置说明
    const configSection = `
      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('gear')}</span><h2>持仓配置</h2></div>
        <div class="reason">${RV.ui.icon('pen-to-square', 'fa-xs')} 编辑项目根目录 <code>holdings.json</code> 添加/修改持仓：
        <br>{"holdings": [{"name": "长江电力", "code": "600900", "cost": 28.5, "shares": 1000}]}
        <br>修改后运行 <code>python run_review.py --mode holdings</code> 重新生成数据。</div>
      </div>`;

    const emptyMsg = items.length ? '' : RV.ui.empty('暂无持仓配置，请编辑 holdings.json');

    app.innerHTML = RV.ui.header('持仓跟踪', `盘中实时跟踪 · 盘后复盘 · 网格提醒`, 'holdings', d.generatedAt)
      + `<div class="section">${summary}</div>`
      + reminderTable
      + `<div class="section"><div class="section-title"><span class="title-icon">${RV.ui.icon('briefcase')}</span><h2>持仓详情</h2></div>
         ${emptyMsg}<div class="cards">${cards}</div></div>`
      + configSection
      + '<footer>网格建议来自均值线偏离策略 · 目标仓位为理论值非投资建议 · 不构成投资建议</footer>';

    // 股票名点击 → 详情弹窗
    document.addEventListener('click', e => {
      const link = e.target.closest('.stock-link[data-hd-code]');
      if (!link) return;
      e.preventDefault();
      e.stopPropagation();
      const code = link.getAttribute('data-hd-code');
      const p = items.find(x => x.code === code);
      if (p) stockDetailModal(p);
    });
  } catch (e) {
    app.innerHTML = RV.ui.header('持仓跟踪', '', 'holdings') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

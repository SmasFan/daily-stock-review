<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时模拟盘 · 盘中触发</title>
<link rel="stylesheet" href="assets/css/common.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; }
  .kpi .k-label { font-size:11px; color:var(--text-2); }
  .kpi .k-val { font-size:20px; font-weight:800; margin-top:4px; }
  .kpi .k-sub { font-size:10.5px; color:var(--text-2); margin-top:2px; }
  .sec { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
  .sec-title { font-size:15px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sec-title .ti { color:var(--accent); }
  .sec-chip { font-size:11px; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:1px 8px; font-weight:600; white-space:nowrap; }
  .data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .data-table th { text-align:left; color:var(--text-2); font-size:11.5px; padding:7px 8px; border-bottom:2px solid var(--border); white-space:nowrap; }
  .data-table td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .data-table tr:hover td { background:var(--surface-2); }
  .up{color:var(--up);} .down{color:var(--down);} .neutral{color:var(--neutral);}
  .tag { display:inline-block; font-size:10.5px; font-weight:700; border-radius:6px; padding:1px 7px; }
  .tag-buy{background:#fef2f2;color:#dc2626;} .tag-sell{background:#f0fdf4;color:#16a34a;}
  .tag-pend{background:#fffbeb;color:#d97706;} .tag-block{background:#f1f5f9;color:#64748b;}
  .tag-replay{background:#f0fdf4;color:#15803d;}
  .reason { font-size:11px; color:var(--text-2); line-height:1.5; }
  .chart-box { height:300px; }
  .timeline { display:flex; flex-direction:column; gap:6px; font-size:12px; }
  .tl-step { display:flex; gap:8px; align-items:baseline; }
  .tl-idx { color:var(--accent); font-weight:800; width:22px; flex:none; }
  .note-item { padding:6px 0; border-bottom:1px dashed var(--border); font-size:12px; }
  .note-item:last-child { border:none; }
  .nd { font-weight:700; }
  .revbox { background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.7; margin-bottom:10px; white-space:pre-line; }
  .chart-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:900px){ .chart-row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div class="loading" id="loading">数据加载中…</div>
  <div id="content" style="display:none"></div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/rvui.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');
  const fmt = (v, d) => v == null ? '--' : Number(v).toFixed(d == null ? 2 : d);
  function pnlCls(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'neutral'); }
  let S = null;
  try {
    S = await RV.API.fetch('sim_live.json');
    const m = S.meta;
    app.innerHTML = RV.ui.header('实时模拟盘 · 盘中触发', '5万 · 盘中实时价触发成交 · 每笔记时分秒/现价/涨跌/理由', 'simlive', m.created);
    loading.style.display = 'none';
    content.style.display = 'block';
    render(S);
  } catch (e) {
    app.innerHTML = RV.ui.header('实时模拟盘 · 盘中触发', '', 'simlive');
    loading.innerHTML = '数据加载失败：' + e.message;
    loading.style.display = 'block';
  }

  function render(s) {
    const m = s.meta, st = m.strategy;
    const eqc = s.equity_curve || [];
    const positions = s.positions || [];
    const trades = s.trades || [];
    const plan = (s.plan || []).filter(p => p.status === 'wait' || p.status === 'filled');
    const waitPlan = plan.filter(p => p.status === 'wait');
    const closedSells = trades.filter(t => t.action === 'sell');
    const realized = closedSells.reduce((a, t) => a + (t.pnl || 0), 0);
    content.innerHTML = `
      <div class="sec" style="padding:14px 18px;background:linear-gradient(90deg,var(--surface),#faf5ef)">
        <div class="sec-title" style="margin-bottom:8px"><span class="ti">${RV.ui.icon('timeline')}</span>运行机制 <span class="sec-chip">盘中触发单 · 不做盘后挂单</span></div>
        <div class="timeline">
          <div class="tl-step"><span class="tl-idx">①</span><span>盘前/收盘后 <code>--plan</code>：按最近信号生成<b>回踩买点 + ATR 止损 + 止盈</b>价位</span></div>
          <div class="tl-step"><span class="tl-idx">②</span><span>交易时段每 5 分钟 <code>--intraday</code>：拉<b>实时快照</b>，价格<b>触及买点即买入</b>（现价≤买点），破止损/到止盈即卖出</span></div>
          <div class="tl-step"><span class="tl-idx">③</span><span>每笔记录 <b>真实时分秒 + 成交现价 + 当时涨跌幅 + 触发理由</b>，股数 100 整数倍</span></div>
          <div class="tl-step"><span class="tl-idx">④</span><span>收盘 <code>--review</code>：持仓市值按收盘价更新净值 + 平仓自动自我复盘</span></div>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi"><div class="k-label">账户净值</div><div class="k-val">¥${fmt(eqc.length?eqc[eqc.length-1].equity:(m.cash||m.start_cash))}</div><div class="k-sub">起始 ¥${fmt(m.start_cash)}</div></div>
        <div class="kpi"><div class="k-label">现金</div><div class="k-val">¥${fmt(m.cash)}</div><div class="k-sub">可用资金</div></div>
        <div class="kpi"><div class="k-label">持仓</div><div class="k-val">${positions.length} / 5</div><div class="k-sub">${positions.length?('持'+positions.map(p=>p.name).join('、')):'空仓'}</div></div>
        <div class="kpi"><div class="k-label">待触发买点</div><div class="k-val">${waitPlan.length} 单</div><div class="k-sub">现价回踩到即买入</div></div>
        <div class="kpi"><div class="k-label">已成交</div><div class="k-val">${trades.length} 笔</div><div class="k-sub">买${trades.filter(t=>t.action==='buy').length}/卖${closedSells.length}</div></div>
        <div class="kpi"><div class="k-label">已实现盈亏</div><div class="k-val ${pnlCls(realized)}">${realized>0?'+':''}¥${fmt(realized)}</div><div class="k-sub">策略 v${st.version} ${st.name}</div></div>
      </div>

      <div class="sec">
        <div class="sec-title"><span class="ti">${RV.ui.icon('chart-line')}</span>账户净值</div>
        <div class="chart-box" id="eq-chart"></div>
        <div class="reason">🔺红三角=买入 🔻绿三角=卖出 · 点击图上任意点 → 看当日每笔成交（时间/价/涨跌/理由）</div>
      </div>

      <div class="chart-row">
        <div class="sec">
          <div class="sec-title"><span class="ti">${RV.ui.icon('briefcase')}</span>当前持仓</div>
          ${positions.length ? `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>股票</th><th>买入日</th><th>买入时间</th><th>股数</th><th>成本</th><th>信号分</th><th>ATR止损</th><th>止盈</th></tr></thead><tbody>
            ${positions.map(p=>`<tr><td style="font-weight:700">${p.name}</td><td><span class="sec-chip">${p.buy_date}</span></td><td>${p.buy_time||'--'}</td><td>${p.shares}</td><td>${fmt(p.cost)}</td><td>${p.score||'--'}</td><td class="down">${p.stop_atr!=null?fmt(p.stop_atr):'--'}</td><td class="up">${p.tp!=null?fmt(p.tp):'--'}</td></tr>`).join('')}
          </tbody></table></div>` : '<div class="neutral" style="padding:8px">空仓 · 持币等回踩触发</div>'}
        </div>
        <div class="sec">
          <div class="sec-title"><span class="ti">${RV.ui.icon('crosshairs')}</span>待触发买点（现价 ≤ 买点即买入）</div>
          ${waitPlan.length ? `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>股票</th><th>信号</th><th>分</th><th>现价基准</th><th>回踩买点≤</th><th>预算</th><th>触发逻辑</th></tr></thead><tbody>
            ${waitPlan.map(b=>`<tr><td style="font-weight:700">${b.name}</td><td>${b.signal}</td><td>${b.score}</td><td>${b.close!=null?fmt(b.close):'--'}</td><td class="up">${fmt(b.buy_below)}</td><td>¥${fmt(b.budget)}</td><td class="reason">${(b.reason||'').slice(0,60)}</td></tr>`).join('')}
          </tbody></table></div>` : '<div class="neutral" style="padding:8px">无待触发单（收盘后 --plan 重建）</div>'}
        </div>
      </div>

      <div class="sec">
        <div class="sec-title"><span class="ti">${RV.ui.icon('receipt')}</span>成交流水 <span class="sec-chip">${trades.length} 笔</span> <span class="sec-chip">时间=成交时分秒 · 含盘中回放标注</span></div>
        ${trades.length ? `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>成交日</th><th>时分秒</th><th>方向</th><th>股票</th><th>价格</th><th>数量</th><th>当时涨跌</th><th>盈亏</th><th>策略</th><th>触发原因 / 记录</th></tr></thead><tbody>
          ${trades.slice().reverse().map(t=>`<tr>
            <td>${t.date}</td><td class="neutral">${t.time||'--'}</td>
            <td>${t.action==='buy'?'<span class="tag tag-buy">买入</span>':'<span class="tag tag-sell">卖出</span>'}</td>
            <td style="font-weight:700">${t.name}</td><td>${t.price!=null?fmt(t.price):'--'}</td><td>${t.shares||''}股</td>
            <td class="${t.chg_at_fill!=null?pnlCls(t.chg_at_fill):'neutral'}">${t.chg_at_fill!=null?RV.fmt.pct(t.chg_at_fill):'--'}</td>
            <td class="${t.action==='sell'?pnlCls(t.pnl):'neutral'}">${t.action==='sell'?RV.fmt.pct(t.pnl_pct):'--'}</td>
            <td><span class="sec-chip">${t.strategy_ver||'--'}</span></td>
            <td class="reason">${(t.reason||'').includes('回放')?'<span class="tag tag-replay">回放</span> ':''}${t.reason||''}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="neutral" style="padding:8px">暂无成交</div>'}
      </div>

      <div class="chart-row">
        <div class="sec">
          <div class="sec-title"><span class="ti">${RV.ui.icon('brain')}</span>复盘学习</div>
          ${(s.review_log||[]).length ? s.review_log.map(r=>`<div class="revbox"><b>复盘 ${r.date}</b>\n${r.note}</div>`).join('') : '<div class="neutral">有平仓后自动产出（亏损主因/改进建议）</div>'}
          <div class="sec-title" style="margin-top:12px"><span class="ti">${RV.ui.icon('arrows-rotate')}</span>策略版本史</div>
          ${(s.version_history||[]).length ? s.version_history.map(v=>`<div class="note-item"><b>${v.from} → ${v.to}</b> ${v.date}<div class="reason">${v.change}</div></div>`).join('') : '<div class="neutral">尚无变更</div>'}
        </div>
        <div class="sec">
          <div class="sec-title"><span class="ti">${RV.ui.icon('magnifying-glass-chart')}</span>操作逻辑 · 分析点</div>
          <div style="font-size:12px;line-height:1.9">
            <div>· <b>何时买：</b>现价回踩到计划买点（≤买点价）才触发，高开冲高&gt;3%不追</div>
            <div>· <b>何时卖：</b>现价破 ATR 止损 / 到止盈价 / 峰值回落8%（曾+8%以上）</div>
            <div>· <b>买多少：</b>单票≤18%预算、最多5只、100股整倍数</div>
            <div>· <b>风控：</b>大盘空头或普涨过热日不加新仓</div>
            <div>· <b>留证：</b>每笔 时分秒/成交价/当时涨跌幅/触发理由/策略版本</div>
            <div style="margin-top:6px" class="reason">待触发：${waitPlan.length ? waitPlan.map(b=>b.name+'≤'+fmt(b.buy_below)).join('、') : '（收盘 --plan 重建）'}<br>持仓止损：${positions.length ? positions.map(p=>p.name+' ≤'+fmt(p.stop_atr||0)).join('、') : '—'}</div>
          </div>
        </div>
      </div>

      <footer style="text-align:center;color:var(--text-2);font-size:12px;padding:8px 0 4px">账本由 <code>python3 sim_live.py --plan/--intraday/--review</code> 维护 · 盘中触发模拟仅供学习研究 · 不构成投资建议</footer>`;
    drawChart(s);
  }

  function dayTradesHTML(s, date) {
    const trades = (s.trades || []).filter(t => t.date === date);
    if (!trades.length) return '<div class="neutral">该日无成交</div>';
    return `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>时间</th><th>方向</th><th>股票</th><th>价格</th><th>数量</th><th>当时涨跌</th><th>盈亏</th><th>触发原因</th></tr></thead><tbody>
      ${trades.map(t=>`<tr><td class="neutral">${t.time||'--'}</td>
        <td>${t.action==='buy'?'<span class="tag tag-buy">买入</span>':'<span class="tag tag-sell">卖出</span>'}</td>
        <td style="font-weight:700">${t.name}</td><td>${fmt(t.price)}</td><td>${t.shares}股</td>
        <td class="${t.chg_at_fill!=null?pnlCls(t.chg_at_fill):'neutral'}">${t.chg_at_fill!=null?RV.fmt.pct(t.chg_at_fill):'--'}</td>
        <td class="${t.action==='sell'?pnlCls(t.pnl):'neutral'}">${t.action==='sell'?RV.fmt.pct(t.pnl_pct):'--'}</td>
        <td class="reason">${t.reason||''}</td></tr>`).join('')}
    </tbody></table></div>`;
  }

  function drawChart(s) {
    const ec = s.equity_curve || [];
    const dates = ec.map(p=>p.date), eq = ec.map(p=>p.equity);
    const el = document.getElementById('eq-chart');
    if (!el || !dates.length) return;
    const c = echarts.init(el);
    const buyPts = [], sellPts = [];
    (s.trades||[]).forEach(t => { const i = dates.indexOf(t.date); if (i >= 0) (t.action==='buy'?buyPts:sellPts).push([i, eq[i]]); });
    c.setOption({
      animation:false,
      tooltip:{trigger:'axis',axisPointer:{type:'cross'},
        formatter(p){const i=p[0].dataIndex;const d=ec[i]||{};const dt=(s.trades||[]).filter(t=>t.date===dates[i]);
          let x=dates[i]+'<br>净值 ¥'+RV.fmt.num(eq[i])+'（'+RV.fmt.pct(d.daily_return)+'）<br>持仓 '+(d.pos_count||0)+'只';
          if(dt.length)x+='<br><b>当日'+dt.length+'笔</b> '+dt.map(t=>(t.action==='buy'?'🔺买':'🔻卖')+t.name+'@'+t.time).join('、');
          x+='<br><span style="color:var(--text-2)">点击看每笔成交</span>';return x;}},
      grid:{left:60,right:20,top:20,bottom:26},
      xAxis:{type:'category',data:dates,axisLabel:{fontSize:10}},
      yAxis:{type:'value',scale:true,axisLabel:{fontSize:10,formatter:v=>'¥'+v}},
      dataZoom:[{type:'inside'},{type:'slider',height:16,bottom:0}],
      series:[{name:'净值',type:'line',data:eq,showSymbol:false,
        lineStyle:{width:2,color:'#7c3aed'},areaStyle:{opacity:0.08,color:'#7c3aed'},
        markPoint:{data:[
          ...buyPts.map(pt=>({coord:pt,symbol:'triangle',symbolSize:10,itemStyle:{color:'#dc2626'},label:{show:false}})),
          ...sellPts.map(pt=>({coord:pt,symbol:'triangle',symbolSize:10,symbolRotate:180,itemStyle:{color:'#16a34a'},label:{show:false}}))
        ]}}]
    });
    c.on('click', p => { if (p && p.dataIndex != null) {
      const date = dates[p.dataIndex];
      RVX.popupCard('#eq-chart', dayTradesHTML(s, date), `<b>${date}</b> <span class="sec-chip">净值 ¥${fmt(ec[p.dataIndex].equity)}</span>`, '#7c3aed');
    }});
    window.__liveChart = c;
    window.addEventListener('resize',()=>c.resize());
  }
})();
</script>
</body>
</html>

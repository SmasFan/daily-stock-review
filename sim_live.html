<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时模拟盘 · 四账户盘中触发</title>
<link rel="stylesheet" href="assets/css/common.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:16px 0; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; }
  .kpi .k-label { font-size:11px; color:var(--text-2); }
  .kpi .k-val { font-size:20px; font-weight:800; margin-top:4px; }
  .kpi .k-sub { font-size:10.5px; color:var(--text-2); margin-top:2px; }
  .sec { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
  .sec-title { font-size:15px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sec-title .ti { color:var(--accent); }
  .sec-chip { font-size:11px; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:1px 8px; font-weight:600; white-space:nowrap; }
  .data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .data-table th { text-align:left; color:var(--text-2); font-size:11.5px; padding:7px 8px; border-bottom:2px solid var(--border); white-space:nowrap; }
  .data-table td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .data-table tr:hover td { background:var(--surface-2); }
  .up{color:var(--up);} .down{color:var(--down);} .neutral{color:var(--neutral);}
  .tag { display:inline-block; font-size:10.5px; font-weight:700; border-radius:6px; padding:1px 7px; }
  .tag-buy{background:#fef2f2;color:#dc2626;} .tag-sell{background:#f0fdf4;color:#16a34a;}
  .tag-wait{background:#fffbeb;color:#d97706;} .tag-block{background:#f1f5f9;color:#64748b;}
  .tag-miss{background:#fff7ed;color:#c2410c;}
  .tag-llm{background:#f5f3ff;color:#6d28d9;}
  .tag-reduce{background:#fef3c7;color:#b45309;}
  .reason { font-size:11px; color:var(--text-2); line-height:1.5; }
  .chart-box { height:320px; }
  .strat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin:16px 0; }
  .strat-card { background:var(--surface); border:2px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:border-color .15s; }
  .strat-card.active { border-color:var(--accent); }
  .strat-card:hover { transform:translateY(-1px); }
  .sc-badge { display:inline-block; font-size:11px; font-weight:800; border-radius:20px; padding:3px 11px; color:#fff; }
  .sc-kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .sc-kpi .v { font-size:17px; font-weight:800; } .sc-kpi .l { font-size:10px; color:var(--text-2); }
  .timeline { display:flex; flex-direction:column; gap:6px; font-size:12px; }
  .tl-step { display:flex; gap:8px; align-items:baseline; } .tl-idx { color:var(--accent); font-weight:800; width:22px; flex:none; }
  .note-item { padding:6px 0; border-bottom:1px dashed var(--border); font-size:12px; }
  .note-item:last-child { border:none; } .nd { font-weight:700; }
  .revbox { background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px 12px; font-size:12px; margin-bottom:10px; white-space:pre-line; }
  .chart-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:900px){ .chart-row{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(2,1fr);} }

  @media (max-width:640px) {
    .strat-cards { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  }
  @media (max-width:480px) {
    .strat-cards { grid-template-columns:1fr; }
    .kpi { padding:10px 12px; }
    .kpi .k-val { font-size:17px; }
    .sec { padding:12px 12px; overflow-x:auto; }
    .sec-title { font-size:14px; }
    .timeline { font-size:11px; }
    .data-table { font-size:11.5px; }
    .data-table th, .data-table td { padding:5px 6px; }
    .chart-row { grid-template-columns:1fr; }
    .kpis { grid-template-columns:repeat(2,1fr); gap:8px; }
    .kpis .kpi:nth-child(odd) { }
    .sc-kpis { grid-template-columns:repeat(3,1fr); }
    .sc-kpi .v { font-size:15px; }
    body { overflow-x:hidden; }
    .reason, .note-item, .tl-step, .logic { overflow-wrap:break-word; }
    .chart-box { height:250px; }
  }
  @media (max-width:380px) {
    .kpis { grid-template-columns:repeat(2,1fr); }
    .strat-card { padding:12px; }
  }

  #pool-switch .ps-btn { cursor:pointer; font-size:13px; font-weight:800; padding:6px 14px;
    border-radius:20px; border:1.5px solid var(--border); color:var(--text-2); user-select:none; transition:all .15s; }
  #pool-switch .ps-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #pool-switch .ps-btn:hover:not(.on) { border-color:var(--accent); color:var(--accent); }
  #pool-switch.busy { opacity:.55; pointer-events:none; }
  #pool-switch.busy::after { content:'切换中…'; font-size:12px; color:var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div class="loading" id="loading">数据加载中…</div>
  <div id="content" style="display:none"></div>
</div>
<script src="assets/js/common.js?v=2"></script>
<script src="assets/js/rvui.js?v=2"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');
  const fmt = (v, d) => v == null ? '--' : Number(v).toFixed(d == null ? 2 : d);
  const pcl = v => v > 0 ? 'up' : (v < 0 ? 'down' : 'neutral');
  let S = null;
  const ORDER = ['aggressive', 'balanced', 'disciplined', 'mix'];
  const META = {
    aggressive: { badge: '#dc2626', icon: 'fire', label: '激进' },
    balanced: { badge: '#d97706', icon: 'scale-balanced', label: '稳健' },
    disciplined: { badge: '#2563eb', icon: 'shield-halved', label: '严守纪律' },
    mix: { badge: '#7c3aed', icon: 'layer-group', label: '合并·共识' },
  };
  const POOL_INFO = {
    six: { label: '6股精选', icon: 'bullseye', name: '🎯 6股精选', desc: '工业富联/长江电力/紫金矿业/万华化学/宁波银行/雅戈尔' },
    all: { label: '全池', icon: 'layer-group', name: '🗂 全池', desc: '全部自选 + ETF成分(复盘动态扩容)' },
    sprint: { label: '一周冲刺', icon: 'rocket', name: '🚀 一周冲刺', desc: 'AI主动选股 · 集中重仓 ≤2只 · 目标周+10%' },
  };
  let curPool = 'six';   // 当前查看池/盘（页顶 tab，仅展示层）
  let selKey = 'balanced';  // 当前选中账户卡
  let refreshTimer = null;
  let SP = null;   // sim_sprint.json 冲刺盘数据

  async function init() {
    try {
      S = await RV.API.fetch('sim_live.json');
      app.innerHTML = RV.ui.header('实时模拟盘 · 双池并行 + 冲刺盘',
        '🎯 6股精选 + 🗂 全池 并行策略 · 🚀 一周冲刺 AI重仓搏击', 'simlive', S.meta.created);
      loading.style.display = 'none';
      content.style.display = 'block';
      render();
      RV.ui.initSidebar();
    } catch (e) {
      app.innerHTML = RV.ui.header('实时模拟盘', '', 'simlive');
      loading.innerHTML = '数据加载失败：' + e.message;
      loading.style.display = 'block';
    }
  }
  init();
  // 预载冲刺盘数据（独立拉取，失败不影响主盘）
  RV.API.fetch('sim_sprint.json').then(j => { SP = j; }).catch(() => {});
  // 自动刷新：每 60s 重拉 sim_live.json → 重渲染，保持当前池/账户视角；页面隐藏时暂停
  async function autoRefresh() {
    if (document.hidden) return;
    try {
      S = await RV.API.fetch('sim_live.json');
      try { SP = await RV.API.fetch('sim_sprint.json'); } catch (e) {}
      render();
    } catch (e) { /* 网络瞬断跳过本轮 */ }
  }
  refreshTimer = setInterval(autoRefresh, 60000);

  /* 双池并行：无切换 API（两池常驻并行）。tab 只切查看。 */
  function book() { return (S.pools || {})[curPool] || S; }  // 兼容 v3 单池（顶层 accounts）
  function acct(key) { const b = book(); return (b.accounts && b.accounts[key]) || (key === 'mix' ? b.mix : null); }
  function mixAcct() { return book().mix || {}; }
  /* 闸门标签：open=等触发 / reduce=背离降档 / block=防守 */
  function gateTag(g) {
    if (g === 'block') return '<span class="tag tag-block" title="大盘闸门：不开新仓">防守</span>';
    if (g === 'reduce') return '<span class="tag tag-reduce" title="宏观利多但市场宽度极弱（背离）→ 买入门槛提高、仓位打折">降档</span>';
    return '<span class="tag tag-wait">等触发</span>';
  }
  window.gateTag = gateTag;

  /* 成交流水的 LLM 风控单元格：allow=通过 / avoid=否决 / fallback=LLM不可用放行 */
  function llmCell(l) {
    if (!l || !l.verdict) return '<span class="neutral" title="本笔未经过 LLM 闸门（历史成交）">--</span>';
    const map = { allow: ['#16a34a', '通过'], avoid: ['#dc2626', '否决'], };
    const src = l.src === 'fallback' ? '（LLM不可用放行）' : l.src === 'cache' ? '（同日已评）' : '';
    const col = l.verdict === 'avoid' ? '#dc2626' : l.verdict === 'allow' ? '#16a34a' : '#64748b';
    return `<span class="tag" style="background:${col}1a;color:${col}" title="${(l.note || '')}${src}">${map[l.verdict] ? map[l.verdict][1] : l.verdict}${src}</span>`;
  }
  window.llmCell = llmCell;
  function mixBook() { return book().mix || {}; }
  function eqOf(key) {
    // 账户净值 = 现金 + Σ持仓×现价（盘中用巡检 last，盘后用 last_close）
    // 合并·共识为真实账户（独立 5 万），与三子账户同口径；曲线取不到时回落现金
    const a = acct(key);
    if (!a) { const c = mixBook().equity_curve; return c.length ? c[c.length - 1].equity : 50000; }
    if (key === 'mix' && !(a.positions || []).length && !a.cash) { const c = mixBook().equity_curve; return c.length ? c[c.length - 1].equity : 50000; }
    const holdEq = a.positions.reduce((x, p) => x + p.shares * (p.last != null ? p.last : p.last_close != null ? p.last_close : p.cost), 0);
    return a.cash + holdEq;
  }
  function retOf(key) {
    const acc = acct(key);
    const base = (acc && acc.equity_curve) || mixBook().equity_curve || [];
    const lastEq = eqOf(key);
    if (!acc) return base.length ? (base[base.length - 1].equity / 50000 - 1) * 100 : 0;
    const prev = base.length ? base[base.length - 2] || base[base.length - 1] : null;
    // 当日收益 = (当前净值 / 上个已结算净值 - 1)；无历史则对起始 5 万
    const ref = prev ? prev.equity : 50000;
    return (lastEq / ref - 1) * 100;
  }

  function render() {
    if (curPool === 'sprint') return renderSprint();
    try { loadGateHist(); } catch (e) {}
    const cur = POOL_INFO[curPool];
    const cards = ORDER.map(k => card(k)).join('');
    content.innerHTML = `
      <div id="pool-switch" class="sec" data-nav="池" data-nav-icon="layer-group" style="padding:11px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="sec-title" style="margin:0"><span class="ti">${RV.ui.icon('layer-group')}</span>查看池 <span class="sec-chip" style="font-size:10.5px">双池并行 · 切tab只看数据不动账本</span></span>
        ${Object.keys(POOL_INFO).map(p => `<span class="ps-btn ${p === curPool ? 'on' : ''}" data-pool="${p}">${POOL_INFO[p].name}</span>`).join('')}
        <span class="sec-chip" id="ps-hint" style="font-size:11px">当前查看 <b>${cur.name}</b> · ${cur.desc}</span>
        <span class="sec-chip" id="ps-upd" style="font-size:10.5px">自动刷新·每60s</span>
      </div>
      <div id="ext-factors" class="sec" data-nav="外部市场因子" data-nav-icon="globe" style="display:none"></div>
      <div id="gate-hist" class="sec" data-nav="闸门历史" data-nav-icon="traffic-light" style="display:none"></div>
      <div id="ext-shadow" class="sec" data-nav="外部因子统计" data-nav-icon="chart-line" style="display:none"></div>
      <div id="llm-macro" class="sec" data-nav="LLM宏观观察" data-nav-icon="brain" style="display:none"></div>
      <div class="sec" style="padding:13px 18px;background:linear-gradient(90deg,var(--surface),#faf5ef)" data-nav="机制" data-nav-icon="timeline">
        <div class="sec-title"><span class="ti">${RV.ui.icon('timeline')}</span>盘中触发运行机制 <span class="sec-chip">不做盘后挂单</span></div>
        <div class="timeline">
          <div class="tl-step"><span class="tl-idx">①</span><span><b>大盘闸门三态</b>：<b>block</b>（上证空头/普涨过热/LLM宏观防御）不开新仓；<b>reduce 背离降档</b>（宏观利多 score≥60 但涨占比≤25%，政策面与盘面背离）→ 买入门槛 +6 分、仓位 ×0.6；否则 open。宏观数据过期（&gt;20h）不再参与多头判断</span></div>
          <div class="tl-step"><span class="tl-idx">①</span><span>双池（6股+全池）各自 <code>--plan</code> 按最近收盘信号生成各账户<b>回踩买点/止损/止盈</b>（激进回踩少、稳健2%、纪律3%）；<b>盘中每 30 分钟复盘刷新</b>（10:00–15:00）：最新信号/价格重算待触发买点，新走强股盘中即时入计划（v3.3/30min）</span></div>
          <div class="tl-step"><span class="tl-idx">②</span><span>盘中<b>每 2 分钟</b>（独立锁，不再被复盘重块排队）<code>--intraday</code> 拉实时快照，<b>两池并行</b>巡检：现价 ≤ 买点×(1+0.2%) 即买，破止损/到止盈即卖；盘中最低已触及但采样未抓到的买点 → <b>漏单留痕</b>（页面「漏单」标签 + 账本 miss_log）</span></div>
          <div class="tl-step"><span class="tl-idx">③</span><span><b>成交前 LLM 风控复核</b>（每轮候选合并 1 次请求，短超时 25s）：<b>买入</b> — 当日大幅杀跌/弱势下杀/逆风追高 → 否决；<b>卖出</b> — 硬止损强制成交（LLM 只能确认），软止盈/移动止盈若个股强势未破位 → 否决改为<b>继续持有</b>。同日同标的只评一次（缓存），LLM 不可用自动放行并熔断 10 分钟（不停盘）</span></div>
          <div class="tl-step"><span class="tl-idx">④</span><span>每笔记 <b>真实时分秒 + 成交价 + 当时涨跌幅 + LLM 复核意见 + 触发理由</b>，100 股整</span></div>
          <div class="tl-step"><span class="tl-idx">⑤</span><span>收盘 <code>--review</code> 市值按收盘更新 + 每账户自动自我复盘</span></div>
        </div>
      </div>
      <div class="strat-cards" data-nav="账户对比" data-nav-icon="layer-group">${cards}</div>
      <div id="detail"></div>
      <div class="sec" data-nav="操作逻辑" data-nav-icon="magnifying-glass-chart">
        <div class="sec-title"><span class="ti">${RV.ui.icon('magnifying-glass-chart')}</span>操作逻辑 · 分析点</div>
        <div style="font-size:12px;line-height:1.9">
          <div>· <b>双池并行：</b>页顶 tab 切换查看 <b>6股精选</b>（工业富联/长江电力/紫金矿业/万华化学/宁波银行/雅戈尔，抓个股新闻+消息面评审）与 <b>全池</b>（全部自选股 + 自选ETF前5成分股拆入，每日复盘动态；宏观闸门）——<b>两池常驻并行</b>，各持独立 5万×3 策略账户，互不共享资金/计划/持仓，盘中同步触发成交。切 tab 只看数据，不动账本。</div>
          <div>· <b>选股差异化(v3.2)：</b>三策略同一池但<b>评分标准不同</b>——激进=收益优先（60日动量/放量，避翻倍高位与主力出逃）；稳健=胜率优先（温和动量+回踩到位+主力净流入+不过热）；严守=最保守（深回踩企稳+主力不撤才买，RSI/乖离/弱趋势重罚）。各自按“复盘分+策略偏好”排序取 top8。</div>
          <div>· <b>何时买：</b>现价回踩到计划买点才触发；高开冲高 &gt;3% 不追</div>
          <div>· <b>何时卖：</b>破 ATR/保本止损、到止盈价、峰值回落8%（曾+8%以上，激进账户）</div>
          <div>· <b>风控：</b>大盘空头/普涨过热日不加新仓；每账户独立 5万、100股整倍数</div>
          <div>· <b>留证：</b>每笔 时分秒/价格/涨跌/理由/所属策略</div>
        </div>
      </div>
      <div class="sec" data-nav="复盘与版本" data-nav-icon="brain">
        <div class="sec-title"><span class="ti">${RV.ui.icon('brain')}</span>自我复盘 & 策略版本</div>
        <div class="chart-row">
          <div>
            ${ORDER.filter(k => k !== 'mix').map(k => revBlock(k)).join('')}
          </div>
          <div>
            <div class="sec-title" style="margin-top:0"><span class="ti">${RV.ui.icon('arrows-rotate')}</span>版本史</div>
            ${(S.version_history || []).length ? S.version_history.map(v => `<div class="note-item"><b>v${v.from} → v${v.to}</b> ${v.date}<div class="reason">${v.change}</div></div>`).join('') : '<div class="neutral">尚无变更（--strategy-log 记录）</div>'}
          </div>
        </div>
      </div>
      <footer style="text-align:center;color:var(--text-2);font-size:12px;padding:8px 0 4px">账本由 python3 sim_live.py 维护 · 模拟仅供学习研究 · 不构成投资建议</footer>`;
    ORDER.forEach(k => {
      const el = document.getElementById('sc-' + k);
      if (el) el.addEventListener('click', () => select(k));
    });
    RVX.enableCardTables('#content');
    document.querySelectorAll('#pool-switch .ps-btn').forEach(b =>
      b.addEventListener('click', () => {
        const p = b.dataset.pool;
        if (p && p !== curPool) { curPool = p; render(); }
      }));
    loadLlmMacro();
    loadExternal();
    loadExtShadow();
    loadGateHist();
    select(selKey);
  }

  /* ============ 一周冲刺盘（🚀 tab） ============ */
  function sprintEq() {
    if (!SP) return 50000;
    const ps = SP.positions || [];
    return (SP.cash || 0) + ps.reduce((x, p) => x + p.shares * (p.last != null ? p.last : p.cost), 0);
  }
  function renderSprint() {
    const cur = POOL_INFO.sprint;
    const noData = !SP;
    const cash = noData ? 0 : SP.cash || 0;
    const holds = noData ? [] : (SP.positions || []);
    const trades = noData ? [] : (SP.trades || []);
    const curve = noData ? [] : (SP.equity_curve || []);
    const eq = noData ? 50000 : sprintEq();
    const ret = (eq / 50000 - 1) * 100;
    const heldV = holds.reduce((x, p) => x + p.shares * p.cost, 0);
    const rule = noData ? {} : (SP.meta && SP.meta.rule) || {};
    const logs = noData ? [] : (SP.log || []).slice(-6).reverse();
    content.innerHTML = `
      <div id="pool-switch" class="sec" data-nav="盘" data-nav-icon="layer-group" style="padding:11px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="sec-title" style="margin:0"><span class="ti">${RV.ui.icon('layer-group')}</span>查看</span>
        ${Object.keys(POOL_INFO).map(p => `<span class="ps-btn ${p === curPool ? 'on' : ''}" data-pool="${p}">${POOL_INFO[p].name}</span>`).join('')}

  /* 闸门历史卡：按日闸门 + 连续 block 告警（宏观卡防御会导致长期不交易） */
  function loadGateHist() {
    const box = document.getElementById('gate-hist');
    if (!box) return;
    const gh = (S.meta || {}).gate_history || {};
    const days = Object.keys(gh).sort();
    if (!days.length) { return; }
    // 连续 block 天数（从最近往前数）
    let streak = 0;
    for (let i = days.length - 1; i >= 0; i--) {
      if (gh[days[i]].gate === 'block') streak++; else break;
    }
    const label = { open: '开放', reduce: '降档', block: '防守' };
    const color = { open: 'var(--up)', reduce: '#d97706', block: 'var(--down)' };
    const rows = days.slice(-14).reverse().map(d => {
      const g = gh[d];
      return `<tr><td>${d}</td><td style="color:${color[g.gate] || 'var(--text-2)'};font-weight:700">${label[g.gate] || g.gate}</td>
        <td class="neutral">${g.ts || ''}</td><td class="reason">${(g.why || '').slice(0, 70)}</td></tr>`;
    }).join('');
    box.style.display = 'block';
    if (streak >= 3) box.style.borderLeft = '4px solid var(--down)';
    box.innerHTML = `
      <div class="sec-title"><span class="ti">${RV.ui.icon('traffic-light')}</span>大盘闸门历史
        <span class="sec-chip" style="background:${color[gh[days[days.length - 1]].gate]};color:#fff;font-weight:800">今日 ${label[gh[days[days.length - 1]].gate]}</span>
        ${streak >= 3 ? `<span class="sec-chip" style="background:#fef2f2;color:#dc2626;font-weight:800">⚠ 连续 ${streak} 天防守</span>` : ''}
      </div>
      ${streak >= 3 ? '<div class="revbox" style="margin:0 0 8px;background:#fef2f2;border-color:#fecaca;color:#991b1b">⚠ 已连续 <b>' + streak + ' 个交易日</b>处于「防守」闸门（不开新仓）→ 请检查宏观 LLM 是否卡在防御判断（<code>macro_llm_data.json</code>），或市场确实处于弱势。</div>' : ''}
      <div style="overflow-x:auto"><table class="data-table card-table"><thead><tr><th>日期</th><th>闸门</th><th>判定时间</th><th>依据</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="reason" style="margin-top:6px;font-size:11px">日内棘轮：当天一旦 block 即维持到收盘（避免 LLM 宏观判断抖动导致闸门反复开关）。</div>`;
  }

  async function loadExternal() {
    const box = document.getElementById('ext-factors');
    if (!box) return;
    try {
      const e = await RV.API.fetch('external_data.json');
      const f = e.factors || {};
      const bias = e.sector_bias || {};
      const rp = e.risk_pref || {};
      const gen = (e.generatedAt || '').slice(0, 16);
      const ageH = gen ? (Date.now() - new Date(gen.replace(' ', 'T')).getTime()) / 3600000 : 0;
      const stale = ageH > 14;
      const toneColor = { risk_on: 'var(--up)', risk_off: 'var(--down)', neutral: 'var(--text-2)' }[rp.tone] || 'var(--text-2)';
      const order = ['oil','gold','silver','copper','yield','dxy','nasdaq','vix','sp500'];
      const rows = order.filter(k => f[k]).map(k => {
        const v = f[k], lv = v.level || 0;

        const tag = lv > 0 ? '利好' : (lv < 0 ? '利空' : '中性');

          <td style="color:${col};font-weight:700;font-size:11px">${v.market_effect || tag}</td></tr>`;

      const bs = Object.entries(bias).slice(0, 16).map(([sec, sc]) =>
        `<span class="tag" style="background:${sc>0?'#f0fdf4':'#fef2f2'};color:${sc>0?'#16a34a':'#dc2626'};margin:2px 3px 0 0">${sec} ${sc>0?'+':''}${sc.toFixed(1)}</span>`).join('');

      box.style.borderLeft = '4px solid ' + toneColor;
      box.innerHTML = `
        <div class="sec-title"><span class="ti">${RV.ui.icon('globe')}</span>外部市场因子
          <span class="sec-chip" style="background:${toneColor};color:#fff;font-weight:800">${rp.note || '—'} (${rp.score != null && rp.score > 0 ? '+' : ''}${rp.score != null ? rp.score : 0})</span>

        <div class="sec" data-nav="档位记录" data-nav-icon="flag">
          <div class="sec-title"><span class="ti">${RV.ui.icon('flag')}</span>每日档位 (regime)</div>
          ${(mx.equity_curve || []).slice(-40).reverse().map(x => `<div class="note-item"><span class="nd">${x.date}</span> <span class="sec-chip">${x.regime || '衡'}</span> 净值¥${fmt(x.equity)}（${RV.fmt.pct(x.daily_return)}）· 持仓${x.pos_count || 0}</div>`).join('') || '<div class="neutral">暂无</div>'}
        </div>
        <div class="sec" data-nav="共识规则" data-nav-icon="book">
          <div class="sec-title"><span class="ti">${RV.ui.icon('book')}</span>合并规则（A 方案）</div>
          <div class="logic" style="font-size:12px;line-height:1.9">
            <b>独立 5 万真账户</b>，不自建信号，汇总三子策略计划：<br>
            · <b>入场：</b>任一子策略给出买点即挂单，回踩线取<b>最浅</b>（最容易接到）<br>
            · <b>仓位：</b>按共识数加权 —— 1 个策略 ¥${fmt(50000 * 0.08)} / 2 个 ¥${fmt(50000 * 0.13)} / 3 个 ¥${fmt(50000 * 0.20)}，最多 6 只<br>
            · <b>风控：</b>止损取三者<b>最严</b>（最早离场）、止盈取<b>最先到</b>，保本/移动止盈沿用（最保守）<br>
            · <b>闸门：</b>任一子策略大盘闸门 block → 不开新仓<br>
            · 持仓取并集（同只被多策略看好 → 合并成一笔，按共识数加大仓位）
          </div>
        </div>
      </div>`;
    drawAccountChart('mix');
    RVX.enableCardTables('#detail');
  }

  function drawAccountChart(key) {
    const a = acct(key);
    const ec = a.equity_curve || [];
    const dates = ec.map(p => p.date), eq = ec.map(p => p.equity);
    const el = document.getElementById('eq-chart-' + key);
    if (!el || !dates.length) return;
    const c = echarts.init(el);
    const buyPts = [], sellPts = [];
    (a.trades || []).forEach(t => { const i = dates.indexOf(t.date); if (i >= 0) (t.action === 'buy' ? buyPts : sellPts).push([i, eq[i]]); });
    c.setOption({
      animation: false,
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' }, formatter(p) {
        const i = p[0].dataIndex; const dt = (a.trades || []).filter(t => t.date === dates[i]);
        let x = dates[i] + '<br>净值 ¥' + fmt(eq[i]) + '（' + RV.fmt.pct(ec[i].daily_return) + '）<br>持仓' + ec[i].pos_count + '只';
        if (dt.length) x += '<br><b>当日' + dt.length + '笔</b>' + dt.map(t => (t.action === 'buy' ? '🔺' : '🔻') + t.name + '@' + (t.time || '')).join('、');
        x += '<br><span style="color:var(--text-2)">点击看每笔</span>'; return x; } },
      grid: { left: 58, right: 20, top: 20, bottom: 24 },
      xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10 } },
      yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 10, formatter: v => '¥' + v } },
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 14, bottom: 0 }],
      series: [{ name: '净值', type: 'line', data: eq, showSymbol: false,
        lineStyle: { width: 2, color: META[key].badge }, areaStyle: { opacity: 0.07, color: META[key].badge },
        markPoint: { data: [
          ...buyPts.map(pt => ({ coord: pt, symbol: 'triangle', symbolSize: 10, itemStyle: { color: '#dc2626' }, label: { show: false } })),
          ...sellPts.map(pt => ({ coord: pt, symbol: 'triangle', symbolSize: 10, symbolRotate: 180, itemStyle: { color: '#16a34a' }, label: { show: false } })) ] } }]
    });
    c.on('click', p => { if (p && p.dataIndex != null) {
      const date = dates[p.dataIndex];
      const dayT = (a.trades || []).filter(t => t.date === date);
      const rows = dayT.length ? dayT.map(t => `<tr><td class="neutral">${t.time}</td><td>${t.action === 'buy' ? '<span class="tag tag-buy">买</span>' : '<span class="tag tag-sell">卖</span>'}</td><td style="font-weight:700">${t.name}</td><td>${fmt(t.price)}</td><td>${t.shares}</td><td>¥${fmt((t.price||0)*(t.shares||0))}</td><td class="${pcl(t.chg_at_fill)}">${t.chg_at_fill != null ? RV.fmt.pct(t.chg_at_fill) : '--'}</td><td class="reason">${(t.reason || '').slice(0, 40)}</td></tr>`).join('') : '<div class="neutral">当日无成交</div>';
      RVX.popupCard('#eq-chart-' + key, `<table class="data-table card-table"><thead><tr><th>时间</th><th>方向</th><th>股票</th><th>价</th><th>量</th><th>金额</th><th>涨跌</th><th>理由</th></tr></thead><tbody>${dayT.length ? rows : '<tr><td colspan="8" class="neutral">当日无成交</td></tr>'}</tbody></table>`, `<b>${date}</b> <span class="sec-chip">净值¥${fmt(eq[p.dataIndex])}</span>`, META[key].badge);
    } });
    window.addEventListener('resize', () => c.resize());
  }

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略说明 · 复盘/推荐/回测</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
.docs-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:18px; align-items:start; }
.doc-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.doc-card h3 { display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; margin-bottom:10px; }
.doc-card h3 .ic { color:var(--accent); font-size:15px; }
.doc-card h4 { font-size:13px; color:var(--accent); margin:14px 0 6px; }
.doc-card p, .doc-card li { font-size:13px; color:var(--text); line-height:1.7; }
.doc-card ul { padding-left:18px; margin:4px 0; }
.doc-card li { margin-bottom:4px; }
.doc-card code { background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:0 5px; font-size:12px; }
.doc-card .muted { color:var(--text-2); font-size:12px; }
.legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--text-2); margin-top:8px; }
.legend .lg { display:flex; align-items:center; gap:5px; }
.badge-mini { display:inline-block; padding:1px 7px; border-radius:5px; font-size:11px; font-weight:700; }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">加载中…</div></div>
<script src="assets/js/common.js?v=2"></script>
<script src="assets/js/rvui.js?v=2"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  try {
    const [review, rec, bt] = await Promise.all([
      RV.API.review(), RV.API.recommend(), RV.API.backtest()
    ]);
    const gen = (review && review.generatedAt) || '';
    const btStat = bt && bt.overall ? `${bt.overall.stocks ?? 0} 只标的 · 平均年化 ${bt.overall.avg_annual_return ? (bt.overall.avg_annual_return * 100).toFixed(1) + '%' : '--'} · 平均夏普 ${bt.overall.avg_sharpe ?? '--'}` : '--';
    const btYears = bt && bt.overall && bt.overall.avg_max_drawdown != null ? ' · 平均最大回撤 ' + (bt.overall.avg_max_drawdown * 100).toFixed(1) + '%' : '';

    const html = `
      ${RV.ui.header('策略说明', '复盘 / 推荐 / 回测 三大模块逻辑文档' + (gen ? ' · 数据更新于 ' + gen : ''), 'docs')}

      <div class="docs-grid">

        <div class="doc-card">
          <h3><span class="ic">${RV.ui.icon('clipboard-list')}</span>每日复盘 · 个股技术分析</h3>
          <p class="muted">src/analyzer.py · 覆盖自选 + 大盘池，逐股给出百分制评分与买卖点位</p>

          <h4>趋势七档判定（权重 30）</h4>
          <ul>
            <li>MA5/MA10/MA20 排列 → 强势多头 / 多头排列 / 弱势多头 / 盘整 / 弱势空头 / 空头排列 / 强势空头</li>
            <li>发散扩大（当周均线间距扩大）且乖离超过 ±5% 判定为强势档</li>
          </ul>

          <h4>六维百分制评分</h4>
          <ul>
            <li>趋势 30 + 乖离率 20 + 量能 15 + 均线支撑 10 + MACD 15 + RSI 10</li>
            <li><b>乖离率</b>：偏离 MA5 越近 0 越健康；正乖离 &gt;5% 直接降为 4 分（严禁追高），强势多头放宽 1.5 倍</li>
            <li><b>量能</b>：量比 &gt;1.5 放量、&lt;0.7 缩量；缩量回调 15 分最优，放量下跌 0 分</li>
            <li><b>支撑</b>：现价贴 MA5/MA10（±2% 内）各 +5 分</li>
            <li><b>MACD</b>：零上金叉 15 分 → 死叉/下穿零轴 0 分</li>
            <li><b>RSI12</b>（2026-08 趋势化修正）：强势 10、中性 6、超买 5、弱势 3、超卖 2——奖励强势，不再把超卖当买点</li>
          </ul>

          <h4>信号映射（含趋势过滤）</h4>
          <ul>
            <li>强买(≥80) / 买(≥60) / 观望(≥40) / 减仓(≥20) / 卖(&lt;20)</li>
            <li>买/强买信号若趋势仅「盘整/弱势空头」则降级为观望；空头排列直接给出卖出</li>
          </ul>

          <h4>买卖点位</h4>
          <ul>
            <li>理想买点 = MA5，次优买点 = MA10，止损 = MA20，止盈 = 20 日高点</li>
            <li>ATR 止损（2026-08 新增）：atr_stop = 收盘价 − 2×ATR14，波动自适应，与 MA20 并存展示</li>
          </ul>

          <h4>大盘温度计（2026-08-07 去偏）</h4>
          <p>上涨广度 45% + 平均涨跌指数分 35% + 买入信号占比 20%，≥70 强势 / ≥55 偏暖 / ≥40 震荡 / 偏弱；
          广度优先用<b>全市场涨跌家数</b>（东财，含沪深京），数据缺失时回退自选池广度</p>

          <h4>普涨过热日闸门（2026-08-07）</h4>
          <ul>
            <li>上涨家数占比 ≥65%（全市场或自选池任一）视为过热日</li>
            <li>过热日只有当日<b>跑赢沪深300</b>的买入信号保留，其余降为观望（理由标注"暂缓追高"）</li>
          </ul>
        </div>

        <div class="doc-card">
          <h3><span class="ic">${RV.ui.icon('bullseye')}</span>每日推荐 · 多因子横截面选股</h3>
          <p class="muted">src/screener.py · 技术分 + 横截面因子打分，输出 TopN</p>

          <h4>硬过滤（L1）</h4>
          <ul>
            <li>剔除 ST / 退市、价格 ≤ 0 的标的</li>
          </ul>

          <h4>横截面因子（池内百分位 0-100，2026-08 修正）</h4>
          <ul>
            <li><b>动量</b>：60 日趋势占 70%、当日涨跌占 30%（单日动量是噪音）；涨超 5% 追高惩罚、跌超 2% 破位惩罚</li>
            <li><b>价值</b>：PE / PB <b>板块内</b>分位（同行业才可比；板块样本&lt;5 回退全池分位）</li>
            <li><b>流动性</b>：成交额分位</li>
            <li><b>活跃度</b>：量比理想 2.0、换手理想 4%，偏离扣分</li>
            <li><b>稳定性</b>：基准 78，按大波动 / 高换手 / 极端量比扣分</li>
          </ul>

          <h4>综合打分</h4>
          <ul>
            <li>综合分 = 技术分 × 50% + 横截面分 × 50%</li>
            <li>横截面分 = 价值×30% + 流动性×15% + 稳定性×20% + 动量×20% + 活跃度×15%（动量降权，避免与技术分重复计费）</li>
            <li>评级：A ≥80 / B ≥60 / C ≥40 / D ≥20 / E</li>
          </ul>

          <h4>板块推荐（估值分位 + 估值档位）</h4>
          <ul>
            <li>板块分 = 跨板块 PE 分位×45% + 估值档位×35% + 当日动量×20%（绝对 PE 跨行业不可比，改分位制）</li>
            <li>再按板块映射到自选分类，取综合分 Top5 作为对应个股</li>
          </ul>

          <h4>当日购买原因</h4>
          <p>规则化组合：均线多头 + 技术信号 + 60 日涨幅区间 + 估值低位 + 距理想买点距离 + 止损位</p>
        </div>

        <div class="doc-card">
          <h3><span class="ic">${RV.ui.icon('flask')}</span>网格均值回归回测</h3>
          <p class="muted">src/grid_backtest.py · 均衡偏低均值线 + 不对称网格</p>
          <div class="muted" style="margin-bottom:8px">${btStat}${btYears}</div>

          <h4>均值线（公允价格锚）</h4>
          <ul>
            <li>近 3 年（750 交易日）滚动分位：PE-TTM 40% 分位、PB 60% 分位、ROE，加权几何平均</li>
            <li>无估值数据时退化为 750 日价格均线（price-only）</li>
          </ul>

          <h4>仓位规则（不对称网格，2026-08 优化）</h4>
          <ul>
            <li>均衡仓位 70%，每偏离一格：上涨抛 1%、下跌买 1.04%（斜率不对称偏防守）</li>
            <li><b>ATR 动态步长</b>：步长 = 1.2 × ATR14/收盘价（近 250 日中位数，夹在 1%~3%），替代固定 0.5%，大幅减少过度交易</li>
            <li>仓位范围 10% ~ 100%，越跌越买</li>
          </ul>

          <h4>半永久锁仓（2026-08 起真正生效）</h4>
          <ul>
            <li>偏离 ≤ -5%（dev_lock）后的加仓累入锁仓下限，反弹时仓位不低于下限（不回吐）</li>
            <li>偏离 ≥ +5%（dev_clear）解锁</li>
          </ul>

          <h4>ADX 趋势闸门（实验开关，默认关闭）</h4>
          <ul>
            <li>开启后 ADX &gt; 25 视为趋势市，冻结调仓（上行不减仓、下行不加仓）</li>
            <li>回测显示该闸门在低波 ETF 上过度冻结拖累收益，故默认关闭，参数实验中</li>
          </ul>

          <h4>交易与成本</h4>
          <ul>
            <li>dev 每跨越网格边界才调仓（避免频繁交易）</li>
            <li>单边成本 0.05%，现金无息；基准 = 满仓买入持有</li>
          </ul>

          <h4>绩效指标</h4>
          <ul>
            <li>年化收益、年化波动、夏普、最大回撤、Calmar、超额收益、交易次数、平均仓位</li>
          </ul>
        </div>

        <div class="doc-card">
          <h3><span class="ic">${RV.ui.icon('newspaper')}</span>宏观 · 政策与新闻情绪</h3>
          <p class="muted">src/macro.py · 新闻情感 + 政策主题映射 + 利好/风险提醒</p>

          <h4>数据源</h4>
          <ul>
            <li>东方财富财经频道新闻流（标题 + 摘要 + 发布时间，约 100 条，2 小时本地缓存）</li>
          </ul>

          <h4>情感打分（金融词典法）</h4>
          <ul>
            <li>利好/利空词库命中统计 → 比值映射到 [-10, 10] 分</li>
            <li>政策发布主体加权：国务院/证监会/央行 ×1.6，部委 ×1.2~1.4（央行/证监会等官方口径权重最高）</li>
            <li>风险事件词（处罚/立案/减持/关税/退市等）命中即判风险，含「调查显示」「关税退税」误报防护</li>
          </ul>

          <h4>主题 / 板块 / 个股三级映射</h4>
          <ul>
            <li>15 个主题（人工智能/半导体/新能源/军工/医药/消费/房地产/金融/资源等）→ 自选板块 → 自选股</li>
            <li>板块宏观分 = 命中的利好/风险新闻情绪加权和；个股共享所属板块宏观分</li>
          </ul>

          <h4>输出与反馈</h4>
          <ul>
            <li>宏观页：情绪温度（50 中性）、利好/风险提醒、主题情绪榜（注意力热度×净情绪）、板块/个股影响</li>
            <li><b>反馈</b>：复盘页与推荐页读取 macro_data.json，个股卡片与板块分组打「宏观利好 / 宏观风险」标签</li>
          </ul>
        </div>

        <div class="doc-card" style="border-color:var(--accent);">
          <h3><span class="ic">${RV.ui.icon('clipboard-check')}</span>项目审查与优化报告</h3>
          <p class="muted">2026-08-06 · 代码审查 + 回测对比 + 近半年窗口校验</p>
          <ul>
            <li>发现并修复：网格策略跑输持有、锁仓未生效、估值缓存无 TTL、RSI 打分反向、价值因子跨行业错配等</li>
            <li>回测结论：平均年化 2.58% → <b>3.07%</b>，平均回撤 -27.6% → <b>-26.2%</b>，交易次数减半</li>
            <li>诚实声明：优化后近半年仍平均跑输买入持有（-0.85%）——网格是辅助仓位工具，不是超额来源</li>
            <li>完整数据与待办清单见文档：<a href="docs/project-review-2026-08-06.md" target="_blank" rel="noopener">project-review-2026-08-06.md ↗</a></li>
          </ul>
        </div>
      </div>

      <footer>策略逻辑仅供参考，不构成投资建议 · 数据口径 MA5/10/20/60 · MACD(12,26,9) · RSI(6,12,24)</footer>`;
    app.innerHTML = html;
  } catch (e) {
    app.innerHTML = RV.ui.header('策略说明', '', 'docs') + RV.ui.error(e);
  }
})();
</script>
</body>
</html>

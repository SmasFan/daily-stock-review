    const overlay = document.getElementById('unifiedOverlay');
    function open(){ bar.classList.add('open'); overlay.classList.add('open'); }
    function close(){ bar.classList.remove('open'); overlay.classList.remove('open'); }
    btn.addEventListener('click', () => bar.classList.contains('open') ? close() : open());
    overlay.addEventListener('click', close);
    const links = bar.querySelectorAll('a');
    const current = location.pathname.split('/').pop();
    links.forEach(a => {
        const href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#')) {
            const target = href.split('/').pop();
            if (target === current) a.classList.add('active');
        }
    });
})();

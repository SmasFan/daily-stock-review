<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日复盘工作台</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
.entry-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
.entry-card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:28px 24px; text-decoration:none; color:var(--text); box-shadow:var(--shadow);
  transition:transform .15s, box-shadow .15s; display:block;
}
.entry-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
.entry-card .e-icon {
  font-size:22px; width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border-radius:12px; color:var(--accent); margin-bottom:14px;
}
.entry-card h3 { font-size:19px; font-weight:700; margin-bottom:8px; }
.entry-card p { font-size:13px; color:var(--text-2); }
.entry-card .e-stat { margin-top:14px; font-size:13px; font-weight:700; color:var(--accent); }
.hero { text-align:center; padding:44px 24px 28px; }
.hero h1 { font-size:32px; font-weight:800; letter-spacing:-1px; }
.hero p { color:var(--text-2); margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div class="hero">
    <h1><i class="fa-solid fa-chart-line" style="color:var(--accent)"></i> 每日复盘工作台</h1>
    <p>技术分析 · 多因子选股 · 网格回测 —— 一站式复盘</p>
    <p id="gen" style="font-size:12px"></p>
  </div>
  <div class="entry-grid" id="entries"><div class="loading">加载中…</div></div>
  <footer>数据由 <code>python run_review.py</code> 生成 · 仅供学习研究，不构成投资建议</footer>
</div>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  document.getElementById('app').innerHTML = RV.ui.header('每日复盘工作台', '', '');
  const box = document.getElementById('entries');
  const gen = document.getElementById('gen');
  let review = null, rec = null, bt = null, metals = null, holdings = null, tracking = null;
  try { review = await RV.API.review(); } catch (e) {}
  try { rec = await RV.API.recommend(); } catch (e) {}
  try { bt = await RV.API.backtest(); } catch (e) {}
  try { metals = await RV.API.metals(); } catch (e) {}
  try { holdings = await RV.API.holdings(); } catch (e) {}
  try { tracking = await RV.API.fetch('tracking_data.json'); } catch (e) {}
  if (review) gen.textContent = '数据更新于 ' + review.generatedAt;

  const cards = [];
  cards.push(`
    <a class="entry-card" href="review.html">
      <div class="e-icon">${RV.ui.icon('clipboard-list')}</div><h3>每日复盘</h3>
      <p>按板块分组的信号一览、趋势评分、买卖点位、大盘温度计</p>
      ${review ? `<div class="e-stat">${RV.ui.icon('temperature-high', 'fa-xs')} 温度 ${review.temperature.score}（${review.temperature.label}） · ${RV.ui.icon('arrow-trend-up', 'fa-xs')}${review.stats.up} ${RV.ui.icon('arrow-trend-down', 'fa-xs')}${review.stats.down}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="recommend.html">
      <div class="e-icon">${RV.ui.icon('bullseye')}</div><h3>每日推荐</h3>
      <p>多因子横截面打分 + 板块轮动，输出 Top 推荐与买卖点位</p>
      ${rec && rec.picks && rec.picks[0] ? `<div class="e-stat">${RV.ui.icon('crown', 'fa-xs')} 首推 ${rec.picks[0].name}（${rec.picks[0].rating} · ${rec.picks[0].total_score}分）</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="backtest.html">
      <div class="e-icon">${RV.ui.icon('flask')}</div><h3>网格回测</h3>
      <p>均衡偏低均值线 + 不对称网格，近 N 年收益/回撤/夏普验证</p>
      ${bt && bt.overall ? `<div class="e-stat">${RV.ui.icon('circle-check', 'fa-xs')} ${bt.overall.stocks ?? 0} 只标的 · 平均年化 ${bt.overall.avg_annual_return ? (bt.overall.avg_annual_return * 100).toFixed(1) + '%' : '--'}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="metals.html">
      <div class="e-icon">${RV.ui.icon('coins')}</div><h3>有色金属期货</h3>
      <p>SHFE 主力连续合约（铜/铝/锌/铅/镍/锡）行情 + 走势 + 技术因子，点击展开各品种</p>
      ${metals && metals.stats ? `<div class="e-stat">${RV.ui.icon('temperature-half', 'fa-xs')} 平均 ${RV.fmt.pct(metals.stats.avg_change)} · 领涨 ${metals.stats.leader}(${RV.fmt.pct(metals.stats.leader_change)})</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="holdings.html">
      <div class="e-icon">${RV.ui.icon('briefcase')}</div><h3>持仓跟踪</h3>
      <p>持仓实时行情、盈亏与网格操作提醒（均值线偏离度）</p>
      ${holdings && holdings.items ? `<div class="e-stat">${RV.ui.icon('circle-check', 'fa-xs')} ${holdings.items.length} 只持仓 · ${holdings.items.filter(h => (h.grid || {}).action_key === 'clear').length} 只超涨清仓信号</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="tracking.html">
      <div class="e-icon">${RV.ui.icon('route')}</div><h3>历史跟踪</h3>
      <p>每日推荐 Top10 按日折叠列表、日K弹窗与上榜稳定榜</p>
      ${tracking && tracking.total_days ? `<div class="e-stat">${RV.ui.icon('calendar-days', 'fa-xs')} ${tracking.total_days} 天快照 · ${(tracking.stable || []).length} 只上榜</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="docs.html">
      <div class="e-icon">${RV.ui.icon('book-open')}</div><h3>策略说明</h3>
      <p>复盘技术分析 / 推荐多因子选股 / 网格回测，三套逻辑详解</p>
      <div class="e-stat">${RV.ui.icon('circle-question', 'fa-xs')} 看看每个指标怎么算</div>
    </a>`);
  box.innerHTML = cards.join('');
})();
</script>
</body>
</html>

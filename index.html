<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日复盘工作台</title>
<link rel="stylesheet" href="assets/css/common.css?v=4">
<link rel="stylesheet" href="assets/css/smasfx.css?v=1">
<style>
.entry-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.entry-card {
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 12px 11px; text-decoration:none; color:var(--text); box-shadow:var(--shadow);
  transition:transform .15s, box-shadow .15s; display:block; min-width:0; overflow:hidden;
}
.entry-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
.entry-card .e-icon {
  font-size:15px; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border-radius:9px; color:var(--brand); margin-bottom:9px;
}
.entry-card h3 { font-size:14.5px; font-weight:650; margin-bottom:5px; }
.entry-card p { font-size:11.5px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.entry-card .e-stat { margin-top:9px; font-size:11px; font-weight:600; color:var(--brand); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero { padding:14px 2px 12px; }
.hero h1 { font-size:20px; font-weight:650; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; }
.hero p { color:var(--muted); margin-top:5px; font-size:12px; }
.hero #gen { font-size:11px; color:var(--dim); }
.sfx-strip { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:14px; }
.sfx-cell { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; box-shadow:var(--shadow); min-width:0; }
.sfx-cell .k { font-size:10.5px; color:var(--dim); }
.sfx-cell .v { font-size:18px; font-weight:650; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sfx-cell .s { font-size:10.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (min-width:720px){
  .entry-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .sfx-strip { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .hero { padding:20px 2px 16px; }
  .hero h1 { font-size:26px; }
  .entry-card { padding:18px 16px; }
  .entry-card .e-icon { width:40px; height:40px; font-size:18px; }
  .entry-card h3 { font-size:17px; }
  .entry-card p { font-size:12.5px; -webkit-line-clamp:3; }
}
@media (min-width:1100px){ .entry-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div class="hero">
    <h1><i class="fa-solid fa-chart-line" style="color:var(--brand)"></i> 每日复盘工作台</h1>
    <p>技术分析 · 多因子选股 · 网格回测 —— 一站式复盘</p>
    <p id="gen"></p>
  </div>
  <div class="sfx-strip" id="sfx-status"></div>
  <div class="entry-grid" id="entries"><div class="loading">加载中…</div></div>
  <footer>数据由 <code>python run_review.py</code> 生成 · 仅供学习研究，不构成投资建议</footer>
</div>
<script src="assets/js/common.js?v=3"></script>
<script src="assets/js/smasfx-nav.js?v=1"></script>
<script src="assets/js/rvui.js?v=2"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  document.getElementById('app').innerHTML = RV.ui.header('工作台', '', 'index');
  const box = document.getElementById('entries');
  const gen = document.getElementById('gen');
  let review = null, rec = null, bt = null, metals = null, holdings = null, tracking = null, inst = null, strat = null, macro = null, lowval = null, simAll = null, liveSim = null, usSim = null, industry = null;
  try { review = await RV.API.review(); } catch (e) {}
  try { rec = await RV.API.recommend(); } catch (e) {}
  try { bt = await RV.API.backtest(); } catch (e) {}
  try { metals = await RV.API.metals(); } catch (e) {}
  try { holdings = await RV.API.holdings(); } catch (e) {}
  try { tracking = await RV.API.fetch('tracking_data.json'); } catch (e) {}
  try { inst = await RV.API.institution(); } catch (e) {}
  try { strat = await RV.API.fetch('strategy_results.json'); } catch (e) {}
  try { macro = await RV.API.fetch('macro_data.json'); } catch (e) {}
  try { lowval = await RV.API.fetch('lowval_data.json'); } catch (e) {}
  try { industry = await RV.API.fetch('industry_track.json'); } catch (e) {}
  try { simAll = await RV.API.fetch('sim_trade.json'); } catch (e) {}  // = all 窗口，避免拉 5.5MB 整包
  try { liveSim = await RV.API.fetch('sim_live.json'); } catch (e) {}
  try { usSim = await RV.API.fetch('us-sim.json'); } catch (e) {}
  if (review) gen.textContent = '数据更新于 ' + review.generatedAt;

  const cards = [];
  cards.push(`
    <a class="entry-card" href="review.html">
      <div class="e-icon">${RV.ui.icon('clipboard-list')}</div><h3>每日复盘</h3>
      <p>按板块分组的信号一览、趋势评分、买卖点位、大盘温度计</p>
      ${review ? `<div class="e-stat">${RV.ui.icon('temperature-high', 'fa-xs')} 温度 ${review.temperature.score}（${review.temperature.label}） · ${RV.ui.icon('arrow-trend-up', 'fa-xs')}${review.stats.up} ${RV.ui.icon('arrow-trend-down', 'fa-xs')}${review.stats.down}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="recommend.html">
      <div class="e-icon">${RV.ui.icon('bullseye')}</div><h3>每日推荐</h3>
      <p>多因子横截面打分 + 板块轮动，输出 Top 推荐与买卖点位</p>
      ${rec && rec.picks && rec.picks[0] ? `<div class="e-stat">${RV.ui.icon('crown', 'fa-xs')} 首推 ${rec.picks[0].name}（${rec.picks[0].rating} · ${rec.picks[0].total_score}分）</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="lowval.html">
      <div class="e-icon">${RV.ui.icon('magnifying-glass-chart')}</div><h3>低估值选股</h3>
      <p>全市场扫描：好公司（ROE/毛利）+ 低估值（PE/PB低分位）+ 横盘蓄势（振幅/波动/均线粘合/缩量）</p>
      ${lowval && lowval.items && lowval.items[0] ? `<div class="e-stat">${RV.ui.icon('crown', 'fa-xs')} 首选 ${lowval.items[0].name}（${lowval.items[0].total_score}分 · PE ${lowval.items[0].pe_ttm != null ? RV.fmt.num(lowval.items[0].pe_ttm, 1) : '--'}） · 共 ${lowval.items.length} 只</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="institution.html">
      <div class="e-icon">${RV.ui.icon('landmark')}</div><h3>资金</h3>
      <p>全市场主力资金、板块/个股资金排行、龙虎榜机构席位、国家队与机构持股扫描、5年策略回测</p>
      ${inst && inst.overview ? `<div class="e-stat">${RV.ui.icon('arrow-trend-up', 'fa-xs')} 两市主力 ${inst.overview.main_net != null ? RV.fmt.amount(inst.overview.main_net) : '--'} · ${RV.ui.icon('landmark', 'fa-xs')} 机构命中 ${Object.values((inst.institution || {}).summary || {}).reduce((a, b) => a + b, 0)} 条${strat && strat.A_1d ? ' · 龙虎榜T+1胜率 ' + (strat.A_1d.win_rate * 100).toFixed(0) + '%' : ''}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="backtest.html">
      <div class="e-icon">${RV.ui.icon('flask')}</div><h3>网格回测</h3>
      <p>均衡偏低均值线 + 不对称网格，近 N 年收益/回撤/夏普验证</p>
      ${bt && bt.overall ? `<div class="e-stat">${RV.ui.icon('circle-check', 'fa-xs')} ${bt.overall.stocks ?? 0} 只标的 · 平均年化 ${bt.overall.avg_annual_return ? (bt.overall.avg_annual_return * 100).toFixed(1) + '%' : '--'}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="macro.html">
      <div class="e-icon">${RV.ui.icon('newspaper')}</div><h3>宏观</h3>
      <p>政策与财经新闻情感打分 + 主题/行业映射，利好与风险提醒，反馈个股与板块</p>
      ${macro && macro.overview ? `<div class="e-stat">${RV.ui.icon('temperature-half', 'fa-xs')} 情绪 ${macro.overview.temperature}（${macro.overview.temperature_label}） · ${RV.ui.icon('arrow-trend-up', 'fa-xs')}${macro.overview.bull_count} ${RV.ui.icon('triangle-exclamation', 'fa-xs')}${macro.overview.risk_count}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="sim.html">
      <div class="e-icon">${RV.ui.icon('gamepad')}</div><h3>模拟炒股</h3>
      <p>5万本金三策略回放：激进/稳健/严守纪律，多窗口（2024至今/政策牛/2025）收益对比</p>
      ${simAll && simAll.strategies ? (() => { const s = simAll.strategies; return `<div class="e-stat">${RV.ui.icon('medal', 'fa-xs')} 稳健 ${RV.fmt.pct(s.balanced.return_pct)} · 纪律 ${RV.fmt.pct(s.disciplined.return_pct)} · 激进 ${RV.fmt.pct(s.aggressive.return_pct)}</div>`; })() : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="sim_live.html">
      <div class="e-icon">${RV.ui.icon('stopwatch')}</div><h3>实时模拟盘</h3>
      <p>5万实盘节奏逐日操作：每日收盘决策/次日开盘成交、买卖原因与时间全记录、自学习复盘优化</p>
      ${liveSim && liveSim.meta ? (() => { try { const eq = liveSim.meta.start_cash || 50000; const r = 0; const act = (liveSim.accounts && Object.keys(liveSim.accounts)) || []; const pos = act.length ? act.map(k => liveSim.accounts[k].positions.length).reduce((a, b) => a + b, 0) : (liveSim.positions || []).length; const ver = liveSim.meta.strategy_version || liveSim.meta.strategy?.version || '--'; return `<div class="e-stat">${RV.ui.icon('stopwatch', 'fa-xs')} ${act.length ? act.length + ' 账户 · 持仓' + pos + ' · v' + ver : ''}</div>`; } catch (e) { return ''; } })() : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="us-sim.html">
      <div class="e-icon">${RV.ui.icon('chart-line')}</div><h3>美股模拟盘</h3>
      <p>100美元碎股模拟：趋势突破、ATR止损、实时行情、持仓盈亏与完整交易记录</p>
      ${usSim && usSim.account ? `<div class="e-stat">${RV.ui.icon('dollar-sign', 'fa-xs')} 权益 $${RV.fmt.num(usSim.account.equity, 2)} · 收益 ${RV.fmt.pct(usSim.account.ret_pct)} · 持仓 ${usSim.account.position_count} 只</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="metals.html">
      <div class="e-icon">${RV.ui.icon('coins')}</div><h3>有色金属期货</h3>
      <p>SHFE 主力连续合约（铜/铝/锌/铅/镍/锡）行情 + 走势 + 技术因子，点击展开各品种</p>
      ${metals && metals.stats ? `<div class="e-stat">${RV.ui.icon('temperature-half', 'fa-xs')} 平均 ${RV.fmt.pct(metals.stats.avg_change)} · 领涨 ${metals.stats.leader}(${RV.fmt.pct(metals.stats.leader_change)})</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="industry.html">
      <div class="e-icon">${RV.ui.icon('gem')}</div><h3>产业跟踪</h3>
      <p>染料·中间体涨价周期与钻石·超硬材料（AI 芯片金刚石散热）：产业逻辑、价格催化跟踪、证伪信号与成分股全览</p>
      ${industry && industry.groups ? `<div class="e-stat">${industry.groups.map(g => `${RV.ui.icon('arrow-trend-up', 'fa-xs')} ${g.name} ${RV.fmt.pct(g.stats.avg_change)}`).join(' · ')}</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="holdings.html">
      <div class="e-icon">${RV.ui.icon('briefcase')}</div><h3>持仓跟踪</h3>
      <p>持仓实时行情、盈亏与网格操作提醒（均值线偏离度）</p>
      ${holdings && holdings.items ? `<div class="e-stat">${RV.ui.icon('circle-check', 'fa-xs')} ${holdings.items.length} 只持仓 · ${holdings.items.filter(h => (h.grid || {}).action_key === 'clear').length} 只超涨清仓信号</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="tracking.html">
      <div class="e-icon">${RV.ui.icon('route')}</div><h3>历史跟踪</h3>
      <p>每日推荐 Top10 按日折叠列表、日K弹窗与上榜稳定榜</p>
      ${tracking && tracking.total_days ? `<div class="e-stat">${RV.ui.icon('calendar-days', 'fa-xs')} ${tracking.total_days} 天快照 · ${(tracking.stable || []).length} 只上榜</div>` : ''}
    </a>`);
  cards.push(`
    <a class="entry-card" href="docs.html">
      <div class="e-icon">${RV.ui.icon('book-open')}</div><h3>策略说明</h3>
      <p>复盘技术分析 / 推荐多因子选股 / 网格回测，三套逻辑详解</p>
      <div class="e-stat">${RV.ui.icon('circle-question', 'fa-xs')} 看看每个指标怎么算</div>
    </a>`);
  // 顶部状态条：首屏直接给四个关键读数（手机 2×2，桌面 1×4）
  const temp = review && review.temperature ? `${review.temperature.score} · ${review.temperature.label}` : '--';
  const tempSub = review && review.stats ? `涨 ${review.stats.up} / 跌 ${review.stats.down}` : '等待复盘数据';
  const first = rec && rec.picks && rec.picks[0] ? rec.picks[0] : null;
  const poolAll = liveSim && liveSim.pools && liveSim.pools.all ? liveSim.pools.all : null;
  const accObj = (poolAll && poolAll.accounts) || (liveSim && liveSim.accounts) || {};
  const acts = Object.keys(accObj);
  const posN = acts.length
    ? acts.map(k => ((accObj[k] || {}).positions || []).length).reduce((a, b) => a + b, 0)
    : ((liveSim && liveSim.positions) || []).length;
  const ver = liveSim && liveSim.meta
    ? (liveSim.meta.strategy_version || (liveSim.meta.strategy || {}).version || '--') : '--';
  const liveSub = `策略 ${ver}`;
  const usAcc = usSim && usSim.account ? usSim.account : null;
  const cells = [
    ['大盘温度', temp, tempSub],
    ['今日首推', first ? first.name : '--', first ? `${first.rating} · ${first.total_score}分` : '等待推荐数据'],
    ['实时模拟', acts.length ? `${acts.length} 账户` : '--', acts.length ? `${posN} 仓 · ${liveSub}` : liveSub],
    ['美股模拟', usAcc ? `$${RV.fmt.num(usAcc.equity, 2)}` : '--', usAcc ? `收益 ${RV.fmt.pct(usAcc.ret_pct)}` : '等待美股数据'],
  ];
  document.getElementById('sfx-status').innerHTML = cells.map(([k, v, s]) =>
    `<div class="sfx-cell"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  box.innerHTML = cards.join('');
})();
</script>
</body>
</html>

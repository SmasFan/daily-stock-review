<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期货 · 有色 & 面板周期</title>
<link rel="stylesheet" href="assets/css/common.css?v=3">
<style>
  /* 金属子项可折叠卡 */
  .metal-group { border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; background:var(--surface); }
  .metal-head { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; background:var(--surface); user-select:none; transition:background .15s; flex-wrap:wrap; }
  .metal-head:hover { background:var(--surface-2); }
  .metal-head .m-name { font-weight:800; font-size:15px; }
  .metal-head .m-en { font-size:11px; color:var(--text-2); margin-left:4px; }
  .metal-head .m-price { font-weight:700; font-variant-numeric:tabular-nums; margin-left:8px; }
  .metal-head .m-meta { margin-left:auto; display:flex; gap:14px; font-size:12px; color:var(--text-2); flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .metal-head .chev { transition:transform .2s; color:var(--text-2); font-size:12px; }
  .metal-group.open .chev { transform:rotate(90deg); }
  .metal-body { display:none; padding:16px; border-top:1px solid var(--border); }
  .metal-group.open .metal-body { display:block; }
  .metal-trend { display:inline-block; padding:2px 9px; border-radius:6px; font-size:11px; font-weight:700; }
  .metal-trend.t-bull { background:#fef2f2; color:#dc2626; }
  .metal-trend.t-bear { background:#f0fdf4; color:#16a34a; }
  .metal-trend.t-neut { background:#fffbeb; color:#d97706; }
  .metal-trend.t-na { background:var(--surface-2); color:var(--text-2); }
  .metal-chart { width:100%; height:240px; display:block; }
  .metal-factors { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:1px; background:var(--border); margin-top:14px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .mf-cell { background:var(--surface); padding:10px 8px; text-align:center; min-width:0; }
  .mf-v { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  .mf-l { font-size:10px; color:var(--text-2); margin-top:3px; }
  /* 复用大屏四方分钟度卡概览 */
  .idx-metal-quick { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .mq-card { padding:12px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); text-align:center; cursor:pointer; transition:box-shadow .15s,border-color .15s; }
  .mq-card:hover { box-shadow:var(--shadow-hover); border-color:var(--accent); }
  .mq-card.up { border-top:3px solid var(--up); }
  .mq-card.down { border-top:3px solid var(--down); }
  .mq-name { font-weight:800; font-size:14px; }
  .mq-pct { font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; margin-top:4px; }
  .mq-price { font-size:12px; color:var(--text-2); font-variant-numeric:tabular-nums; margin-top:2px; }
  @media (max-width:640px) { .metal-head .m-meta { margin-left:0; width:100%; justify-content:space-between; gap:6px; } }
  /* 有色股票推荐 */
  .stk-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .stk-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .stk-head .stk-name { font-weight:800; font-size:15px; }
  .stk-head .stk-link { font-size:11px; color:var(--text-2); }
  .stk-head .stk-score { font-weight:800; font-size:16px; }
  .stk-meta { font-size:12px; color:var(--text-2); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }
  .stk-meta b { color:var(--text); font-variant-numeric:tabular-nums; }
  .macro-tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }
  .macro-tag.bull { background:var(--buy-bg); color:var(--buy); }
  .macro-tag.risk { background:var(--sell-bg); color:var(--sell); }
  .macro-tag.neutral { background:var(--surface-2); color:var(--text-2); }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">数据加载中…</div></div>
<script src="assets/js/common.js?v=2"></script>
<script src="assets/js/rvui.js?v=2"></script>
<script src="assets/js/stockchart.js?v=3"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  let d = null;
  try { d = await RV.API.metals(); } catch (e) { app.innerHTML = RV.ui.header('期货', '', 'metals') + RV.ui.error(e); return; }

  const items = d.items || [];
  if (!items.length) {
    app.innerHTML = RV.ui.header('期货', '', 'metals', d.generatedAt) + RV.ui.empty('暂无期货数据，请先运行 python run_review.py --mode metals');
    return;
  }
  const stats = d.stats || {};
  const cls = RV.fmt.cls;

  function trendBadge(t) {
    const key = t.indexOf('多头') >= 0 ? 't-bull' : (t.indexOf('空头') >= 0 ? 't-bear' : (t === '数据不足' ? 't-na' : 't-neut'));
    return `<span class="metal-trend ${key}">${t}</span>`;
  }

  /* K线 + 均线图：收盘价折线 + MA5/MA20/MA60 + 量能条 */
  function metalChart(item, id) {
    const ch = item.chart || {};
    const dates = ch.dates || [], c = ch.closes || [], ma5 = ch.ma5 || [], ma20 = ch.ma20 || [], ma60 = ch.ma60 || [], v = ch.volumes || [];
    const n = c.length;
    if (n < 2) return RV.ui.empty('K线数据不足');
    const W = 860, H = 240, padL = 54, padR = 14, padT = 12, padB = 28;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    let max = -Infinity, min = Infinity;
    const series = [c, ma5, ma20, ma60];
    for (const arr of series) for (let i = 0; i < n; i++) { const x = arr[i]; if (x == null) continue; if (x > max) max = x; if (x < min) min = x; }
    let vmax = 0; for (let i = 0; i < n; i++) if (v[i] > vmax) vmax = v[i];
    max *= 1.03; min *= 0.97;
    const range = max - min || 1;
    const x = i => padL + innerW * i / (n - 1);
    const y = p => padT + innerH * (max - p) / range;
    const yv = val => padT + innerH - innerH * 0.18 * (val / (vmax || 1));
    function path(arr, gap) {
      const g = gap || 0; let p = ''; let started = false;
      for (let i = 0; i < n; i += g || 1) {
        const val = arr[i]; if (val == null) { started = false; continue; }
        p += (started ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(val).toFixed(1); started = true;
      }
      if ((n - 1) % (g || 1) !== 0) { const val = arr[n - 1]; if (val != null) p += 'L' + x(n - 1).toFixed(1) + ',' + y(val).toFixed(1); }
      return p;
    }
    const yN = 5, yTicks = []; for (let i = 0; i <= yN; i++) yTicks.push(min + range * i / yN);
    const years = dates.map(s => Number(s.slice(0, 4)));
    const y0 = years[0], y1 = years[years.length - 1];
    const xTicks = []; for (let yr = y0; yr <= y1; yr++) { const idx = years.indexOf(yr); if (idx >= 0) xTicks.push({ x: x(idx), label: yr }); }
    return `<div class="chart-wrap" data-c="${JSON.stringify(c)}" data-dt="${JSON.stringify(dates)}">
      <svg class="metal-chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
        <rect width="${W}" height="${H}" fill="#f9fafb"/>
        ${yTicks.map(val => `<line x1="${padL}" y1="${y(val).toFixed(1)}" x2="${W - padR}" y2="${y(val).toFixed(1)}" stroke="#eef0f3" stroke-width="1"/>
          <text x="${padL - 8}" y="${(y(val) + 4).toFixed(1)}" fill="#6b7280" font-size="11" text-anchor="end" font-variant-numeric="tabular-nums">${val.toFixed(0)}</text>`).join('')}
        ${xTicks.map(t => `<line x1="${t.x.toFixed(1)}" y1="${padT}" x2="${t.x.toFixed(1)}" y2="${padT + innerH}" stroke="#eef0f3" stroke-width="1" stroke-dasharray="3,3"/>
          <text x="${t.x.toFixed(1)}" y="${H - 8}" fill="#6b7280" font-size="11" text-anchor="middle">${t.label}</text>`).join('')}
        ${v.map((val, i) => { if (!val) return ''; return `<rect x="${(x(i) - 0.6).toFixed(1)}" y="${yv(val).toFixed(1)}" width="1.2" height="${(padT + innerH - yv(val)).toFixed(1)}" fill="#d1d5db" opacity="0.5"/>`; }).join('')}
        <path d="${path(ma60)}" fill="none" stroke="#a1a1aa" stroke-width="1.2" opacity="0.85"/>
        <path d="${path(ma20)}" fill="none" stroke="#f59e0b" stroke-width="1.4" opacity="0.85"/>
        <path d="${path(ma5)}" fill="none" stroke="#3b82f6" stroke-width="1.4" opacity="0.85"/>
        <path d="${path(c)}" fill="none" stroke="#c78d5a" stroke-width="2.1"/>
        <line class="hover-line" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" style="opacity:0"/>
        <circle class="hover-dot" r="4" fill="#c78d5a" style="opacity:0"/>
      </svg>
      <div class="chart-tip" style="position:absolute;pointer-events:none;opacity:0;background:#111827;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.7;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap">
        <div class="tip-date" style="margin-bottom:2px"></div>
        <div style="color:#c78d5a">收盘：<b class="tip-close"></b></div>
      </div>
      <div style="font-size:12px;color:var(--text-2);margin-top:6px">
        <span style="color:#c78d5a;font-weight:700">收盘</span> ·
        <span style="color:#3b82f6">MA5</span> · <span style="color:#f59e0b">MA20</span> · <span style="color:#a1a1aa">MA60</span> ·
        <span style="color:#d1d5db">柱=成交量</span> ·
        <span style="color:var(--text-2)">鼠标悬浮查看数值</span>
      </div>
    </div>`;
  }

  /* ===== 面板周期区块（LCD 景气度代理：面板厂股价） ===== */
  function panelChart(idx) {
    const dates = idx.dates || [], nav = idx.nav || [];
    const n = nav.length;
    if (n < 2) return RV.ui.empty('面板指数数据不足');
    const W = 860, H = 180, padL = 54, padR = 14, padT = 10, padB = 24;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    let max = -Infinity, min = Infinity;
    nav.forEach(v => { if (v == null) return; if (v > max) max = v; if (v < min) min = v; });
    max *= 1.02; min *= 0.98;
    const range = max - min || 1;
    const x = i => padL + innerW * i / (n - 1);
    const y = p => padT + innerH * (max - p) / range;
    let dpath = '', started = false;
    nav.forEach((v, i) => {
      if (v == null) { started = false; return; }
      dpath += (started ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
      started = true;
    });
    const yTicks = [];
    for (let i = 0; i <= 4; i++) yTicks.push(min + range * i / 4);
    const years = dates.map(s => Number(s.slice(0, 4)));
    const y0 = years[0], y1 = years[years.length - 1];
    const xTicks = [];
    for (let yr = y0; yr <= y1; yr++) { const idx2 = years.indexOf(yr); if (idx2 >= 0) xTicks.push({ x: x(idx2), label: yr }); }
    return `<div class="chart-wrap" style="position:relative">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
        <rect width="${W}" height="${H}" fill="#f9fafb"/>
        ${yTicks.map(val => `<line x1="${padL}" y1="${y(val).toFixed(1)}" x2="${W - padR}" y2="${y(val).toFixed(1)}" stroke="#eef0f3"/>
          <text x="${padL - 8}" y="${(y(val) + 4).toFixed(1)}" fill="#6b7280" font-size="11" text-anchor="end">${val.toFixed(2)}</text>`).join('')}
        ${xTicks.map(t => `<text x="${t.x.toFixed(1)}" y="${H - 8}" fill="#6b7280" font-size="11" text-anchor="middle">${t.label}</text>`).join('')}
        <path d="${dpath}" fill="none" stroke="#e8a33d" stroke-width="2.2"/>
        <path d="${dpath}" fill="rgba(232,163,61,0.12)" stroke="none" transform="translate(0,${H})" transform-origin="0 0" transform-box="view-box"/>
      </svg>
      <div style="font-size:12px;color:var(--text-2);margin-top:6px"><span style="color:#e8a33d;font-weight:700">面板板块等权净值</span>（京东方A/TCL科技/彩虹股份/深天马A/维信诺） · 归一化基准=250日前 · 周期位置：净值低于长期均线=底部区，冲高回落=顶部风险</div>
    </div>`;
  }

  function panelPosBar(pos) {
    const color = pos >= 70 ? '#dc2626' : (pos >= 40 ? '#d97706' : '#16a34a');
    const label = pos >= 70 ? '高位·顶部风险' : (pos >= 40 ? '中位' : '低位·机会区');
    return `<div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;min-width:60px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden">
        <div style="width:${pos}%;height:100%;background:${color}"></div>
      </div>
      <span style="font-size:11px;color:${color};font-weight:700;white-space:nowrap">${pos}% ${label}</span>
    </div>`;
  }

  /* 周期板块细分：按 category 分组渲染（有色/贵金属/锂电/黑色/能化/农产品） */
  const CATS = d.categories || {};
  const catQuick = Object.keys(CATS).map(cat => {
    const g = CATS[cat];
    const c = g.avg_change >= 0 ? 'up' : 'down';
    return `<div class="mq-card ${c}" data-jump-cat="${cat}">
      <div class="mq-name">${RV.ui.icon('layer-group', 'fa-xs')} ${cat}</div>
      <div class="mq-pct ${c}">${RV.fmt.pct(g.avg_change)}</div>
      <div class="mq-meta" style="font-size:10px;color:var(--text-2)">${g.count}品种 · ${g.up}涨${g.down}跌 · 领涨${g.leader}</div>
    </div>`;
  }).join('');

  /* 每个板块分组：组头统计 + 品种卡片（点击展开详情） */
  const catSections = Object.keys(CATS).map((cat, ci) => {
    const g = CATS[cat];
    const members = items.filter(m => m.category === cat);
    return `<div class="section" data-nav="${cat}" data-nav-icon="coins">
      <div class="section-title">
        <span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>${cat}</h2>
        <span class="sec-chip">${g.count}品种 · ${g.up}涨${g.down}跌 · 均${RV.fmt.pct(g.avg_change)}</span>
        <span class="sec-chip ${cls(g.avg_change)}">领涨 ${g.leader} ${RV.fmt.pct(g.leader_change)}</span>
      </div>
      ${members.map((m, i) => metalGroup(m, ci * 100 + i)).join('')}
    </div>`;
  }).join('');

  function panelSection() {
    const p = d.panel;
    if (!p || !p.stocks || !p.stocks.length) return '';
    const st = p.stats || {};
    const w = p.warning || {};
    const wlvl = w.level || 'normal';
    const sigList = (w.signals || []).map(s => `<span style="display:block;margin-top:3px">${RV.ui.icon('triangle-exclamation', 'fa-xs')} ${s}</span>`).join('');
    const banner = wlvl === 'alert'
      ? `<div class="regime-banner" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">${RV.ui.icon('triangle-exclamation', 'fa-xs')} <b>面板周期接近顶部！</b><span>${sigList}</span></div>`
      : wlvl === 'watch'
        ? `<div class="regime-banner" style="background:#fffbeb;border-color:#fde68a;color:#92400e">${RV.ui.icon('triangle-exclamation', 'fa-xs')} <b>面板周期需关注</b><span>${sigList}</span></div>`
        : `<div class="regime-banner" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534">${RV.ui.icon('circle-check', 'fa-xs')} <b>面板周期位置正常</b><span>滞涨/过热/高位信号均未触发</span></div>`;
    const cards = [
      RV.ui.summaryCard('layer-group', `${st.count ?? 0} 只`, '面板龙头'),
      RV.ui.summaryCard('arrow-trend-up', st.index_60d != null ? RV.fmt.pct(st.index_60d) : '--', '板块60日', st.index_60d > 0 ? 'up' : 'down'),
      RV.ui.summaryCard('gauge-high', `${st.avg_pos52 ?? '--'}%`, '平均52周位置', st.avg_pos52 >= 70 ? 'down' : 'up'),
      RV.ui.summaryCard('crown', `${st.best || '--'}（${st.best_score ?? '--'}分）`, '技术最强', 'up'),
    ].join('');
    const rows = p.stocks.map(s => `
      <tr>
        <td class="asset-name">${s.name}${RV.ui.heatBtn(s.code, s.name, 'stock')}<span class="stock-code">${s.code}</span></td>
        <td style="font-weight:700">${RV.fmt.num(s.close)}</td>
        <td>${RV.ui.pctBadge(s.change_pct)}</td>
        <td style="font-weight:800">${s.score}</td>
        <td>${RV.ui.signalBadge(s.signal_key, s.signal)}</td>
        <td class="${RV.fmt.cls(s.change_60d)}">${RV.fmt.pct(s.change_60d)}</td>
        <td>${panelPosBar(s.pos52)}</td>
      </tr>`).join('');
    return `<div class="section" data-nav="面板周期" data-nav-icon="layer-group">
      <div class="section-title"><span class="title-icon">${RV.ui.icon('layer-group')}</span><h2>面板周期（LCD 景气度代理）</h2><span class="sec-chip">${st.count ?? 0}只 · 52周位置</span></div>
      ${banner}
      <div class="summary-grid" style="margin-bottom:14px">${cards}</div>
      ${panelChart(p.index || {})}
      <div class="table-desktop" style="margin-top:12px"><div class="table-wrap"><table class="data-table">
        <thead><tr><th>面板厂</th><th>现价</th><th>涨跌</th><th>评分</th><th>信号</th><th>60日</th><th>52周位置</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>
      <div class="cards-mobile" style="margin-top:12px"><div class="mini-cards">${p.stocks.map(s => `
        <div class="mini-card"><div class="mini-head">
          <span class="mini-name">${s.name}${RV.ui.heatBtn(s.code, s.name, 'stock')}<span class="stock-code">${s.code}</span></span>
          <span class="mini-head-right">${RV.ui.pctBadge(s.change_pct)} ${RV.ui.signalBadge(s.signal_key, s.signal)}</span>
        </div>
        <div class="mini-kv">
          <span class="k">现价 / 评分</span><span class="v">${RV.fmt.num(s.close)} / ${s.score}</span>
          <span class="k">60日 / 距52周高</span><span class="v">${RV.fmt.pct(s.change_60d)} / ${RV.fmt.pct(s.dist_high)}</span>
        </div>
        <div style="padding:4px 12px 10px">${panelPosBar(s.pos52)}</div>
        </div>`).join('')}</div></div>
      <div style="font-size:11px;color:var(--text-2);margin-top:10px">${RV.ui.icon('circle-info', 'fa-xs')} ${p.note || ''}</div>
    </div>`;
  }

  function factorGrid(item) {
    const cell = (val, label, cls2) => `<div class="mf-cell"><div class="mf-v ${cls2 || ''}">${val}</div><div class="mf-l">${label}</div></div>`;
    const pct = v => (v == null ? '--' : RV.fmt.pct(v));
    const num = v => (v == null ? '--' : RV.fmt.num(v, 2));
    return `<div class="metal-factors">
      ${cell(pct(item.change), '今日涨跌', cls(item.change))}
      ${cell(pct(item.change5), '5日涨跌', cls(item.change5))}
      ${cell(pct(item.change20), '20日涨跌', cls(item.change20))}
      ${cell(pct(item.change60), '60日涨跌', cls(item.change60))}
      ${cell(num(item.ma5), 'MA5')}
      ${cell(num(item.ma20), 'MA20')}
      ${cell(num(item.ma60), 'MA60')}
      ${cell(pct(item.bias_ma5), 'MA5乖离', cls(item.bias_ma5))}
      ${cell(pct(item.bias_ma20), 'MA20乖离', cls(item.bias_ma20))}
      ${cell(pct(item.bias_ma60), 'MA60乖离', cls(item.bias_ma60))}
      ${cell(item.macd_status, 'MACD状态', item.macd_status === '金叉' ? 'up' : 'down')}
      ${cell(num(item.macd_bar), 'MACD柱', cls(item.macd_bar))}
      ${cell(num(item.rsi12), 'RSI12')}
      ${cell(item.rsi_status, 'RSI状态')}
      ${cell(num(item.high20), '20日高')}
      ${cell(num(item.low20), '20日低')}
      ${cell(item.pos20 + '%', '20日位置')}
      ${cell(num(item.high60), '60日高')}
      ${cell(num(item.low60), '60日低')}
      ${cell(item.pos60 + '%', '60日位置')}
      ${cell(pct(item.max_dd60), '60日最大回撤', 'down')}
      ${cell(num(item.volume), '今日成交量')}
    </div>`;
  }

  function metalGroup(item, idx) {
    const chg = item.change;
    return `<div class="metal-group" data-idx="${idx}" data-nav="${item.name}" data-nav-icon="coin">
      <div class="metal-head" data-toggle="${idx}">
        <i class="fa-solid fa-coins" style="color:var(--accent)"></i>
        <span class="m-name">${item.name}</span><span class="m-en">${item.en || ''} · ${item.exchange}</span>
        <span class="m-price">${item.price.toFixed(0)}<span style="font-size:11px;color:var(--text-2);font-weight:500"> ${item.unit}</span></span>
        ${RV.ui.pctBadge(chg)}
        ${trendBadge(item.trend_status)}
        <span class="m-meta">
          <span><i class="fa-solid fa-arrow-trend-up fa-xs"></i> MACD ${item.macd_status}</span>
          <span>RSI ${item.rsi12}</span>
          <span class="chev">${RV.ui.icon('chevron-right')}</span>
        </span>
      </div>
      <div class="metal-body">
        ${metalChart(item, 'm' + idx)}
        ${factorGrid(item)}
      </div>
    </div>`;
  }

  /* 头部概览 */
  const headCards = [
    RV.ui.summaryCard('temperature-half', `${(stats.avg_change ?? 0) >= 0 ? '+' : ''}${RV.fmt.num(stats.avg_change, 2)}%`, '今日平均涨跌', cls(stats.avg_change)),
    RV.ui.summaryCard('arrow-trend-up', `${stats.up ?? 0} 只`, '上涨品种', 'up'),
    RV.ui.summaryCard('arrow-trend-down', `${stats.down ?? 0} 只`, '下跌品种', 'down'),
    RV.ui.summaryCard('crown', `${stats.leader || '--'} <span style="font-size:13px;font-weight:600">(${RV.fmt.pct(stats.leader_change || 0)})</span>`, '领涨品种', 'up'),
    RV.ui.summaryCard('face-frown', `${stats.laggard || '--'} <span style="font-size:13px;font-weight:600">(${RV.fmt.pct(stats.laggard_change || 0)})</span>`, '领跌品种', 'down'),
  ].join('');

  /* 行情速览：方块卡片，点击直接展开对应金属 */
  const quick = items.map((m, i) => `
    <div class="mq-card ${cls(m.change)}" data-jump="${i}">
      <div class="mq-name">${m.name}</div>
      <div class="mq-pct ${cls(m.change)}">${RV.fmt.pct(m.change)}</div>
      <div class="mq-price">${m.price.toFixed(0)} ${m.unit}</div>
    </div>`).join('');

  /* ===== 有色股票推荐（含宏观影响） ===== */
  function macroTag(net, key) {
    const keys = key || [];
    const click = keys.length ? ` style="cursor:pointer" title="点击查看相关新闻（${keys.length} 条）"` : '';
    if (net == null) return `<span class="macro-tag neutral">宏观数据缺失</span>`;
    if (net > 0) return `<span class="macro-tag bull macro-click" data-keys='${JSON.stringify(keys).replace(/'/g, "&#39;")}'${click}>宏观偏多 +${RV.fmt.num(net, 0)}</span>`;
    if (net < 0) return `<span class="macro-tag risk macro-click" data-keys='${JSON.stringify(keys).replace(/'/g, "&#39;")}'${click}>宏观偏空 ${RV.fmt.num(net, 0)}</span>`;
    return `<span class="macro-tag neutral">宏观中性</span>`;
  }
  const stocks = d.stocks || [];
  const stkMacro = d.stock_macro || {};
  function stockDetail(it) {
    const rows = [
      ['综合分', it.total_score != null ? RV.fmt.num(it.total_score, 1) + ' → ' + it.signal + ' · ' + (it.rating || '') + '级' : '--', '技术分×50% + 横截面因子×50%（动量/流动性/活跃度/稳定性）'],
      ['技术分', it.tech_score != null ? RV.fmt.num(it.tech_score, 1) : '--', '趋势/乖离/量能/支撑/MACD/RSI 六维技术评分'],
      ['趋势', it.trend_status || '--', 'MA5/MA10/MA20 排列，多头排列加分、空头排列减分'],
      ['宏观净情绪', it.macro_net != null ? (it.macro_net > 0 ? '+' : '') + RV.fmt.num(it.macro_net, 1) : '--', '所属板块宏观净情绪（周期资源/新能源电力），±6 分内调整技术分'],
      ['宏观提醒', (it.macro_bulls || 0) + ' 利好 / ' + (it.macro_risks || 0) + ' 风险', '宏观页：政策与新闻词典法情绪加权，同板块共享'],
      ['主力净流', it.fund_net != null ? RV.fmt.amount(it.fund_net) : '--', '当日主力（超大单+大单）净流入，东财资金流'],
      ['关联期货', it.link || '--', '该股对应期货品种，期货走势联动'],
      ['买卖点位', '低吸 ' + (it.ideal_buy != null ? RV.fmt.num(it.ideal_buy) : '--') + ' · 止损 ' + (it.stop_loss != null ? RV.fmt.num(it.stop_loss) : '--'), 'MA5 理想买点、MA20 止损'],
    ];
    const keys = (it.macro_key || []).slice(0, 2).map(k =>
      `<span class="${k.kind === 'bull' ? 'up' : 'down'}">${k.kind === 'bull' ? '[利好]' : '[风险]'}</span> ${k.title.length > 24 ? k.title.slice(0, 24) + '…' : k.title}`).join('<br>');
    if (keys) rows.push(['关键提醒', keys, '所属板块近期命中的政策/新闻标题（详见宏观页）']);
    return rows.map(([k, v, d]) =>
      `<div class="it-row"><span class="k">${k}</span><span class="v">${v}</span></div>
       <div style="color:var(--text-2);font-size:11px;line-height:1.5;padding-bottom:4px">${d}</div>`).join('<hr>');
  }
  function stockCard(it) {
    const keys = (it.macro_key || []).map(k => `<span class="chip ${k.kind === 'bull' ? 'sector' : 'sector risk'} macro-click" data-keys='${JSON.stringify(it.macro_key || []).replace(/'/g, "&#39;")}' style="cursor:pointer" title="点击查看相关新闻">${k.title.length > 16 ? k.title.slice(0, 16) + '…' : k.title}</span>`).join('');
    return `<div class="stk-card">
      <div class="stk-head">
        <span class="stk-name">${it.name} ${RV.ui.infoDot(stockDetail(it), it.name + ' · 评分原因')}</span><span class="stk-link">${it.link || ''} · ${it.sector}</span>
        ${RV.ui.signalBadge(it.signal_key, it.signal)}
        <span class="stk-score ${cls(it.total_score - 50)}">${RV.fmt.num(it.total_score, 1)}分</span>
        <span class="rating-badge rating-${it.rating}">${it.rating}</span>
      </div>
      <div class="stk-meta">
        <span>现价 <b>${RV.fmt.num(it.price, 2)}</b></span>
        <span>今日 <b class="${cls(it.change_pct)}">${RV.fmt.pct(it.change_pct)}</b></span>
        <span>趋势 <b>${it.trend_status}</b></span>
        <span>技术分 <b>${it.tech_score}</b></span>
        <span>主力净流 ${it.fund_net != null ? '<b class="' + cls(it.fund_net) + '">' + RV.fmt.amount(it.fund_net) + '</b>' : '<b>--</b>'}</span>
        <span>${macroTag(it.macro_net, it.macro_key)}</span>
        ${it.ideal_buy ? `<span>低吸 <b>${RV.fmt.num(it.ideal_buy, 2)}</b></span><span>止损 <b>${RV.fmt.num(it.stop_loss, 2)}</b></span>` : ''}
      </div>
      ${keys ? `<div style="margin-top:8px">${keys}</div>` : ''}
    </div>`;
  }
  const stockHtml = `
    <div class="section" data-nav="有色股票推荐" data-nav-icon="chart-line">
      <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-line')}</span><h2>有色股票推荐</h2><span class="sec-chip">${stocks.length} 只 · 综合评分排序</span></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:12px">
        <span>宏观温度 <b style="color:var(--text)">${stkMacro.temperature ?? '--'}</b>（50中性）</span>
        <span>板块净情绪 <b style="color:var(--text)">${stkMacro.sector_net ?? '--'}</b></span>
        <span>利好 <b class="up">${stkMacro.sector_bulls ?? 0}</b> / 风险 <b class="down">${stkMacro.sector_risks ?? 0}</b></span>
        <span>${RV.ui.icon('location-crosshairs', 'fa-xs')} 宏观分来自 <a href="macro.html" style="color:var(--accent)">宏观页</a>（周期资源板块）</span>
      </div>
      ${stocks.map(stockCard).join('') || RV.ui.empty('暂无有色股票数据')}
      <div style="font-size:12px;color:var(--text-2);margin-top:8px">${RV.ui.icon('circle-info', 'fa-xs')} 综合分 = 技术分 50% + 横截面因子 50%（动量/流动性/活跃度/稳定性），宏观板块净情绪 ±6 分内调整技术分；评级 A&gt;B&gt;C&gt;D。</div>
    </div>`;

  /* ===== 有色股票历史跟踪 ===== */
  const trk = d.stock_tracking || { days: [], stable: [] };
  function trkRow(s) {
    const sgn = s.latest_signal;
    return `<tr>
      <td>${s.name}${s.sector ? '<span class="sec-chip" style="margin-left:6px">' + s.sector + '</span>' : ''}</td>
      <td>${s.count} 天 / ${s.rate}%</td>
      <td>${s.first_day || '--'}</td>
      <td>${s.latest_day || '--'}</td>
      <td>${s.cum_track_return != null ? `<span class="${cls(s.cum_track_return)}">${RV.fmt.pct(s.cum_track_return)}</span>` : '--'}</td>
      <td>${s.latest_track_return != null ? `<span class="${cls(s.latest_track_return)}">${RV.fmt.pct(s.latest_track_return)}</span>` : '--'}</td>
      <td>${sgn ? RV.ui.signalBadge(sgn, ({strong_buy:'强买',buy:'买入',watch:'观望',reduce:'减仓',sell:'卖出'})[sgn] || sgn) : '--'}</td>
    </tr>`;
  }
  const trackingHtml = `
    <div class="section" data-nav="有色跟踪" data-nav-icon="clock-rotate-left">
      <div class="section-title"><span class="title-icon">${RV.ui.icon('clock-rotate-left')}</span><h2>有色股票历史跟踪</h2><span class="sec-chip">${trk.days.length} 个交易日快照</span></div>
      <div class="tk-table-wrap"><table class="ret-table">
        <thead><tr><th>标的</th><th>上榜率</th><th>首次上榜</th><th>最近上榜</th><th>累计跟踪</th><th>最近跟踪</th><th>当前信号</th></tr></thead>
        <tbody>${trk.stable.map(trkRow).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-2)">暂无跟踪记录（运行 --mode metals 生成）</td></tr>'}</tbody>
      </table></div>
      <div style="font-size:12px;color:var(--text-2);margin-top:8px">${RV.ui.icon('circle-info', 'fa-xs')} 每天运行 metals 模式自动记录推荐快照；累计跟踪 = 首次上榜日收盘→最新，最近跟踪 = 最近上榜日收盘→最新。</div>
    </div>`;

  app.innerHTML = RV.ui.header('期货', '周期板块细分 · 有色/黑色/能化/农产品 · 面板周期', 'metals', d.generatedAt)
    + `<div class="section" data-nav="今日概览" data-nav-icon="gauge-high"><div class="section-title"><span class="title-icon">${RV.ui.icon('gauge-high')}</span><h2>今日概览</h2></div><div class="summary-grid">${headCards}</div></div>`
    + panelSection()
    + `<div class="section" data-nav="板块速览" data-nav-icon="coins"><div class="section-title"><span class="title-icon">${RV.ui.icon('coins')}</span><h2>周期板块速览（点击直达下方分组）</h2></div><div class="idx-metal-quick">${catQuick}</div></div>`
    + catSections
    + stockHtml
    + trackingHtml
    + '<footer>数据来源：新浪财经期货日线（主力连续合约，覆盖 SHFE/DCE/CZCE/INE/GFEX 五交易所） · 面板周期=面板厂股价代理（面板价格见顶信号以月度 TV 面板报价为准） · 不构成投资建议</footer>';

  /* 折叠交互 */
  app.querySelectorAll('.metal-head[data-toggle]').forEach(h => {
    h.addEventListener('click', () => {
      const g = h.parentElement;
      g.classList.toggle('open');
      if (g.classList.contains('open')) initChart(g);
    });
  });
  app.querySelectorAll('.mq-card[data-jump]').forEach(c => {
    c.addEventListener('click', () => {
      const i = c.getAttribute('data-jump');
      const g = app.querySelector(`.metal-group[data-idx="${i}"]`);
      if (!g) return;
      g.classList.add('open');
      initChart(g);
      g.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  /* 周期板块速览：点击滚动到对应分组 */
  app.querySelectorAll('.mq-card[data-jump-cat]').forEach(c => {
    c.addEventListener('click', () => {
      const cat = c.getAttribute('data-jump-cat');
      const sec = app.querySelector(`.section[data-nav="${cat}"]`);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  /* 数据更新于今日则默认展开第一个 */
  if (items.length) {
    const first = app.querySelector('.metal-group[data-idx="0"]');
    first.classList.add('open');
    initChart(first);
  }

  /* 侧边栏：扫描 data-nav 区块 + 点击自动展开对应金属 */
  RV.ui.initSidebar();
  // 宏观偏多/偏空标签：点击查看该股命中的宏观新闻（2026-08）
  document.body.addEventListener('click', ev => {
    const el = ev.target.closest('.macro-click');
    if (!el) return;
    ev.stopPropagation();
    let keys = [];
    try { keys = JSON.parse(el.getAttribute('data-keys') || '[]'); } catch (e) {}
    if (!keys.length) return;
    const card = el.closest('.stk-card');
    const name = card ? card.querySelector('.stk-name').textContent.trim() : '宏观';
    RV.ui.macroNewsModal({
      title: name + ' · 宏观新闻',
      bulls: keys.filter(k => k.kind !== 'risk').length,
      risks: keys.filter(k => k.kind === 'risk').length,
      key: keys,
    });
  });
  (function patchSidebar() {
    const nav = document.querySelector('.sidebar-nav');
    if (!nav) return;
    const sections = Array.from(document.querySelectorAll('[data-nav]')).filter(s => s.offsetParent !== null);
    nav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        const idx = +a.getAttribute('data-sidebar-target');
        const sec = sections[idx];
        if (sec && sec.classList.contains('metal-group')) {
          sec.classList.add('open');
          initChart(sec);
        }
      });
    });
  })();

  function initChart(group) {
    const wrap = group.querySelector('.chart-wrap');
    if (!wrap || wrap.dataset.inited) return;
    wrap.dataset.inited = '1';
    const svg = wrap.querySelector('svg.metal-chart');
    if (!svg) return;
    let c, dt; try { c = JSON.parse(wrap.dataset.c); dt = JSON.parse(wrap.dataset.dt); } catch (e) { return; }
    const n = c.length; if (n < 2) return;
    const W = svg.viewBox.baseVal.width, H = svg.viewBox.baseVal.height;
    const padL = 54, padR = 14, padT = 12, padB = 28;
    const IW = W - padL - padR, IH = H - padT - padB;
    let max = -Infinity, min = Infinity; for (let i = 0; i < n; i++) { if (c[i] > max) max = c[i]; if (c[i] < min) min = c[i]; }
    max *= 1.03; min *= 0.97; const range = max - min || 1;
    const sx = i => padL + IW * i / (n - 1);
    const sy = p => padT + IH * (max - p) / range;
    const hl = svg.querySelector('.hover-line');
    const dot = svg.querySelector('.hover-dot');
    const tip = wrap.querySelector('.chart-tip');
    const tD = tip.querySelector('.tip-date'), tC = tip.querySelector('.tip-close');
    svg.addEventListener('mousemove', e => {
      const rect = svg.getBoundingClientRect();
      const vx = (e.clientX - rect.left) / rect.width * W;
      const px = Math.max(0, Math.min(1, (vx - padL) / IW));
      const idx = Math.round(px * (n - 1));
      const X = sx(idx), Y = sy(c[idx]);
      hl.setAttribute('x1', X); hl.setAttribute('x2', X); hl.style.opacity = 1;
      dot.setAttribute('cx', X); dot.setAttribute('cy', Y); dot.style.opacity = 1;
      tD.textContent = '\uD83D\uDCC5 ' + dt[idx]; tC.textContent = c[idx].toFixed(2);
      tip.style.opacity = 1;
      const tw = tip.offsetWidth || 160;
      const left = (vx + tw + 16 > W) ? (vx - tw - 12) : (vx + 14);
      tip.style.left = (left / W * rect.width) + 'px'; tip.style.top = '8px';
    });
    svg.addEventListener('mouseleave', () => { hl.style.opacity = 0; dot.style.opacity = 0; tip.style.opacity = 0; });
  }
})();
</script>
</body>
</html>

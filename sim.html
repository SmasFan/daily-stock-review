<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟盘 · 5万过去两个月回放</title>
<link rel="stylesheet" href="assets/css/common.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  .sim-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .kpi .k-label { font-size:12px; color:var(--text-2); }
  .kpi .k-val { font-size:22px; font-weight:800; margin-top:6px; }
  .kpi .k-sub { font-size:11px; color:var(--text-2); margin-top:4px; }
  .section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:20px; }
  .section-title { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .section-title h2 { font-size:16px; font-weight:700; }
  .title-icon { color:var(--accent); }
  .data-table { width:100%; border-collapse:collapse; font-size:13px; }
  .data-table th { text-align:left; color:var(--text-2); font-weight:600; font-size:12px; padding:8px 10px; border-bottom:2px solid var(--border); white-space:nowrap; }
  .data-table td { padding:9px 10px; border-bottom:1px solid var(--border); }
  .data-table tr:hover td { background:var(--surface-2); }
  .up { color:var(--up); } .down { color:var(--down); } .neutral { color:var(--neutral); }
  .date-tag { font-size:12px; color:var(--text-2); background:var(--surface-2); border-radius:6px; padding:2px 8px; white-space:nowrap; }
  .chart-box { width:100%; height:380px; }
  .rule-list { font-size:13px; color:var(--text); line-height:2; }
  .rule-list li { margin-left:18px; }
  .note-item { padding:10px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .note-item:last-child { border-bottom:none; }
  .note-date { font-weight:700; }
  .tag { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:1px 8px; margin-right:6px; }
  .tag-buy { background:var(--buy-bg); color:var(--buy); }
  .tag-sell { background:var(--sell-bg); color:var(--sell); }
  .tag-warn { background:#fef3c7; color:#b45309; }
  .alpha { font-size:12px; font-weight:700; }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div class="loading" id="loading">数据加载中…</div>
  <div id="content" style="display:none"></div>
</div>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');
  try {
    const d = await RV.API.fetch('sim_trade.json');
    app.innerHTML = RV.ui.header('模拟炒股 · 过去两个月', '5万本金 · 逐日信号回放 · 无前视 · 次日开盘价成交', 'sim', d.generatedAt);
    loading.style.display = 'none';
    content.style.display = 'block';
    render(d);
  } catch (e) {
    app.innerHTML = RV.ui.header('模拟炒股', '', 'sim');
    loading.innerHTML = '数据加载失败：' + e.message + '（先运行 python3 build_sim.py）';
    loading.style.display = 'block';
  }

  function render(d) {
    const s = d.stats || {};
    const ret = d.return_pct;
    const bench = d.bench_return_pct;
    const alpha = d.alpha_pct;
    const html = `
      <div class="sim-kpis">
        <div class="kpi"><div class="k-label">期末净值</div><div class="k-val">¥${RV.fmt.money(d.final_equity)}</div><div class="k-sub">起始 ¥${RV.fmt.money(d.start_cash)} · ${d.start_date} → ${d.end_date}</div></div>
        <div class="kpi"><div class="k-label">总收益</div><div class="k-val ${RV.fmt.cls(ret)}">${RV.fmt.pct(ret)}</div><div class="k-sub">含未实现浮盈</div></div>
        <div class="kpi"><div class="k-label">上证同期</div><div class="k-val ${RV.fmt.cls(bench)}">${bench != null ? RV.fmt.pct(bench) : '--'}</div><div class="k-sub">同期基准</div></div>
        <div class="kpi"><div class="k-label">超额 alpha</div><div class="k-val ${RV.fmt.cls(alpha)}">${alpha != null ? RV.fmt.pct(alpha) : '--'}</div><div class="k-sub alpha">${RV.fmt.cls(alpha) === 'up' ? RV.ui.icon('arrow-trend-up', 'fa-xs') : RV.ui.icon('arrow-trend-down', 'fa-xs')} 跑${alpha > 0 ? '赢' : '输'}大盘</div></div>
        <div class="kpi"><div class="k-label">最大回撤</div><div class="k-val down">${RV.fmt.num(Math.abs(d.max_drawdown), 2)}%</div><div class="k-sub">期间最大回撤</div></div>
        <div class="kpi"><div class="k-label">整体胜率</div><div class="k-val">${s.overall_win_rate != null ? s.overall_win_rate + '%' : '--'}</div><div class="k-sub">已平仓${s.sell_times}笔（${s.win_trades}胜）+ 持仓${s.open_positions}只</div></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('chart-line')}</span><h2>净值曲线 vs 上证基准</h2></div>
        <div class="chart-box" id="eq-chart"></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('briefcase')}</span><h2>当前持仓</h2><span class="sec-chip" style="font-size:12px;color:var(--text-2)">浮盈 ${s.unrealized_pnl > 0 ? '+' : ''}${RV.fmt.num(s.unrealized_pnl)} 元</span></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>股票</th><th>买入日</th><th>股数</th><th>成本</th><th>现价</th><th>市值</th><th>浮盈亏</th></tr></thead>
          <tbody>${(d.positions || []).map(p => `
            <tr>
              <td style="font-weight:700">${p.name}</td>
              <td><span class="date-tag">${p.buy_date}</span></td>
              <td>${p.shares}</td>
              <td>${RV.fmt.num(p.cost)}</td>
              <td>${RV.fmt.num(p.price)}</td>
              <td>${RV.fmt.num(p.value)}</td>
              <td class="${RV.fmt.cls(p.pnl)}">${RV.fmt.pct(p.pnl_pct)} <span style="font-size:11px">(${p.pnl > 0 ? '+' : ''}${RV.fmt.num(p.pnl)})</span></td>
            </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-2)">空仓</td></tr>'}
          </tbody></table></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('receipt')}</span><h2>交易流水</h2><span class="sec-chip" style="font-size:12px;color:var(--text-2)">已实现盈亏 ${s.realized_pnl > 0 ? '+' : ''}${RV.fmt.num(s.realized_pnl)} 元 · 买卖均按次日开盘价</span></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>日期</th><th>方向</th><th>股票</th><th>价格</th><th>股数</th><th>盈亏</th><th>持有</th><th>操作理由</th></tr></thead>
          <tbody>${(d.trades || []).map(t => `
            <tr>
              <td><span class="date-tag">${t.date}</span></td>
              <td>${t.action === 'buy' ? '<span class="tag tag-buy">买入</span>' : '<span class="tag tag-sell">卖出</span>'}</td>
              <td style="font-weight:700">${t.name}</td>
              <td>${RV.fmt.num(t.price)}</td>
              <td>${t.shares}</td>
              <td class="${t.action === 'sell' ? RV.fmt.cls(t.pnl) : 'neutral'}">${t.action === 'sell' ? RV.fmt.pct(t.pnl_pct) : '--'}</td>
              <td>${t.action === 'sell' ? t.hold_days + '天' : '--'}</td>
              <td style="font-size:12px;color:var(--text-2)">${t.reason || ''}</td>
            </tr>`).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--text-2)">无交易</td></tr>'}
          </tbody></table></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('list-check')}</span><h2>操作判定 · 日志</h2></div>
        <div>
          ${(d.daily_notes || []).map(n => `
            <div class="note-item">
              <span class="note-date">${n.date}</span>
              <span class="tag tag-warn">广度 ${n.breadth}%</span>
              <span class="tag ${n.market === '买入' || n.market === '强烈买入' ? 'tag-buy' : (n.market === '卖出' || n.market === '减仓' ? 'tag-sell' : '')}">上证 ${n.market}${n.market_score != null ? ' ' + n.market_score + '分' : ''}</span>
              <div style="margin-top:6px">${n.notes.map(x => '· ' + x).join('<br>')}</div>
            </div>`).join('') || '<div style="color:var(--text-2)">无操作日</div>'}
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="title-icon">${RV.ui.icon('book')}</span><h2>模拟规则</h2></div>
        <ul class="rule-list">
          <li>初始资金 ¥50,000 · 区间 ${d.start_date} → ${d.end_date}（过去两个月逐交易日回放）</li>
          <li>股票池 35 只真股票（化工/化肥/券商银行/科技/资源），每交易日收盘用当日已有数据分析</li>
          <li>买入：评分 ≥68（强烈买入/买入）且乖离 MA5 &lt;5% 且大盘非空头且非普涨过热日（广度 &lt;65%）</li>
          <li>单票 ≤18% 仓位 · 最多同时持 5 只 · 保留 10% 现金</li>
          <li>止损：破 ATR 自适应止损（close-2×ATR14）卖出；信号转卖出/减仓即卖</li>
          <li>止盈：单票浮盈 ≥15% 落袋</li>
          <li>信号当日收盘产生 → 一律次日开盘价成交（无前视、含手续费+印花税）</li>
        </ul>
      </div>`;
    content.innerHTML = html;
    drawChart(d);
  }

  function drawChart(d) {
    const el = document.getElementById('eq-chart');
    const dates = d.equity_curve.map(p => p.date);
    const eq = d.equity_curve.map(p => p.equity);
    // 基准归一（首日=5万）
    const base0 = 50000;
    const firstBench = d.equity_curve.find(p => p.bench != null);
    const b0 = firstBench ? firstBench.bench : null;
    const bench = d.equity_curve.map(p => p.bench != null && b0 ? base0 * p.bench / b0 : null);
    // 买卖点
    const buyMarks = [], sellMarks = [];
    (d.trades || []).forEach(t => {
      const i = dates.indexOf(t.date);
      if (i < 0) return;
      if (t.action === 'buy') buyMarks.push({ coord: [i, eq[i]], name: t.name });
      else sellMarks.push({ coord: [i, eq[i]], name: t.name });
    });
    const chart = echarts.init(el);
    chart.setOption({
      animation: false,
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
        formatter(params) {
          const p = params[0];
          const i = p.dataIndex;
          return dates[i] + '<br>净值 ¥' + RV.fmt.num(eq[i]) +
            (bench[i] != null ? '<br>基准 ¥' + RV.fmt.num(bench[i]) : '') +
            (eq[i] >= 50000 ? '<br><b style="color:var(--up)">盈利中</b>' : '');
        } },
      legend: { data: ['模拟盘净值', '上证基准(归一)'], top: 0 },
      grid: { left: 60, right: 30, top: 36, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10 } },
      yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 10, formatter: v => '¥' + v } },
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 18, bottom: 0 }],
      series: [
        { name: '模拟盘净值', type: 'line', data: eq, showSymbol: false, lineStyle: { width: 2, color: '#c78d5a' },
          areaStyle: { opacity: 0.08, color: '#c78d5a' },
          markPoint: {
            data: [
              { coord: [dates.indexOf(d.end_date), eq[eq.length - 1]], symbol: 'circle', symbolSize: 8, itemStyle: { color: '#c78d5a' }, label: { show: false } },
              ...buyMarks.map(m => ({ coord: m.coord, value: m.name, symbol: 'triangle', symbolSize: 10, symbolRotate: 0, itemStyle: { color: '#dc2626' }, label: { show: false } })),
              ...sellMarks.map(m => ({ coord: m.coord, value: m.name, symbol: 'triangle', symbolSize: 10, symbolRotate: 180, itemStyle: { color: '#16a34a' }, label: { show: false } }))
            ]
          } },
        { name: '上证基准(归一)', type: 'line', data: bench, showSymbol: false, lineStyle: { width: 1.5, color: '#94a3b8', type: 'dashed' } }
      ]
    });
    window.addEventListener('resize', () => chart.resize());
  }
})();
</script>
</body>
</html>

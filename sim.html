<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟盘 · 三策略 5万回放</title>
<link rel="stylesheet" href="assets/css/common.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  .strat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin:20px 0; }
  .strat-card { background:var(--surface); border:2px solid var(--border); border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:border-color .15s, transform .15s; }
  .strat-card:hover { transform:translateY(-2px); }
  .strat-card.active { border-color:var(--accent); box-shadow:var(--shadow-hover); }
  .strat-card .sc-head { display:flex; align-items:center; gap:10px; }
  .strat-badge { font-size:12px; font-weight:800; border-radius:20px; padding:4px 12px; color:#fff; }
  .sb-agg { background:#dc2626; } .sb-bal { background:#d97706; } .sb-disc { background:#2563eb; }
  .strat-card h3 { font-size:17px; font-weight:800; }
  .sc-tagline { font-size:11.5px; color:var(--text-2); margin:6px 0 12px; }
  .sc-kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .sc-kpi .v { font-size:18px; font-weight:800; }
  .sc-kpi .l { font-size:10.5px; color:var(--text-2); margin-top:2px; }
  .sec-chip { font-size:11px; color:var(--text-2); background:var(--surface-2); padding:2px 8px; border-radius:6px; font-weight:600; }
  .up { color:var(--up); } .down { color:var(--down); } .neutral { color:var(--neutral); }
  .chart-box { width:100%; height:340px; }
  .chart-box.small { height:150px; margin-top:6px; }
  .logic-box { background:var(--surface-2); border-radius:10px; padding:14px 16px; font-size:13px; line-height:1.8; color:var(--text); border:1px solid var(--border); }
  .logic-box b { color:var(--accent); }
  .tag { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:1px 7px; }
  .tag-buy { background:#fef2f2; color:#dc2626; } .tag-sell { background:#f0fdf4; color:#16a34a; }
  .note-item { padding:9px 0; border-bottom:1px dashed var(--border); font-size:12.5px; }
  .note-item:last-child { border-bottom:none; }
  .note-date { font-weight:700; color:var(--text); }
  .sec-block { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; }
  .sec-title { font-size:15px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .sec-title .ti { color:var(--accent); }
  .data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .data-table th { text-align:left; color:var(--text-2); font-weight:600; font-size:11.5px; padding:7px 8px; border-bottom:2px solid var(--border); white-space:nowrap; }
  .data-table td { padding:8px; border-bottom:1px solid var(--border); }
  .data-table tr:hover td { background:var(--surface-2); }
  .hold-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .hold-pill { font-size:11.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:4px 10px; }
  .hold-pill .pn { font-weight:700; } .hold-pill .pp { font-weight:700; }
  .empty { color:var(--text-2); text-align:center; padding:18px; }

  .month-group { border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; background:var(--surface); }
  .month-head { display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; background:var(--surface-2); font-size:13px; user-select:none; }
  .month-head:hover { background:#f1e4d8; }
  .mg-caret { width:16px; color:var(--accent); }
  .month-body { overflow-x:auto; }
  .month-body .data-table { font-size:12px; }
  .month-body .data-table th { white-space:nowrap; }
  @keyframes hlflash { 0%{background:#fde68a;} 100%{background:transparent;} }
  .hl-flash td { animation: hlflash 2.2s ease 2; }
  .fmt-hint { font-size:11px; color:var(--text-2); margin-top:8px; }
  #eq-chart, #bar-chart { width:100%; }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
  <div class="loading" id="loading">数据加载中…</div>
  <div id="content" style="display:none"></div>
</div>
<script src="assets/js/common.js"></script>
<script>
/* 三策略展示顺序与视觉 meta */
const KEY_META = {
  aggressive: { badge: 'sb-agg', icon: 'fire' },
  balanced: { badge: 'sb-bal', icon: 'scale-balanced' },
  disciplined: { badge: 'sb-disc', icon: 'shield-halved' },
};
const ORDER = ['aggressive', 'balanced', 'disciplined'];
let current = 'balanced';
let charts = {};
let WDATA = null;      // sim_trade_all.json windows
let WIN_ORDER = [];     // [{key,label}]
let winKey = 'all';
(async function () {
  const app = document.getElementById('app');
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');
  let D = null;
  try {
    D = await RV.API.fetch('sim_trade.json');
    WDATA = await RV.API.fetch('sim_trade_all.json');
    WIN_ORDER = Object.keys(WDATA.windows).map(k => ({ key: k, label: WDATA.windows[k].label }));
    app.innerHTML = RV.ui.header('模拟炒股 · 三策略', '5万 · 多窗口回放 · 激进 / 稳健 / 严守纪律(保本)', 'sim', D.generatedAt);
    loading.style.display = 'none';
    content.style.display = 'block';
    renderAll();
  } catch (e) {
    app.innerHTML = RV.ui.header('模拟炒股 · 三策略', '', 'sim');
    loading.innerHTML = '数据加载失败：' + e.message + '（先运行 python3 build_sim.py）';
    loading.style.display = 'block';
  }

  function renderAll() {
    const d = WDATA.windows[winKey];
    const stratCards = ORDER.map(k => card(d.strategies[k], k)).join('') + mixCard(d.mixed);
    const winBtns = WIN_ORDER.map(w => `<button class="bt-range-btn ${w.key === winKey ? 'active' : ''}" data-wk="${w.key}">${w.label}</button>`).join('');
    content.innerHTML = `
      <div style="font-size:12px;color:var(--text-2);margin-bottom:8px">${RV.ui.icon('calendar', 'fa-xs')} 每窗口独立以 ¥${RV.fmt.money(WDATA.start_cash)} 起步回放 · 点卡片切换 / 上方按钮切窗口 · 竞价规则：高开>2%不追、低开>3%不接（激进3%/3.5%）</div>
      <div class="bt-range" style="margin-bottom:14px">${winBtns}</div>
      <div class="strat-cards">${stratCards}</div>
      <div id="detail"></div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('book')}</span>三策略规则对照</div>
        ${ORDER.map(k => `<div class="logic-box" style="margin-bottom:10px"><b>${d.strategies[k].label}</b>：${d.strategies[k].logic}</div>`).join('')}
        <div class="logic-box"><b>混合</b>：${(d.mixed || {}).logic || '动态按上证20日斜率在攻/守间调权重 + 等权对照'}</div>
        <div class="fmt-hint">${RV.ui.icon('circle-info', 'fa-xs')} 信号当日收盘产生 → 次日开盘价成交；开盘跳空过大不追/不接；含佣金+印花税。</div>
        <footer style="text-align:center;color:var(--text-2);font-size:12px;padding:10px 0 4px">数据由 <code>python3 build_sim.py</code> 生成 · 历史回放仅供学习研究 · 不构成投资建议</footer>
      </div>`;
    document.querySelectorAll('.bt-range-btn').forEach(b =>
      b.addEventListener('click', () => { winKey = b.dataset.wk; current = 'balanced'; renderAll(); }));
    ORDER.forEach(k => {
      document.getElementById('sc-' + k).addEventListener('click', () => select(k));
    });
    const mixEl = document.getElementById('sc-mix');
    if (mixEl) mixEl.addEventListener('click', () => select('mix'));
    select(current);
  }

  function mixCard(m) {
    if (!m) return '';
    const active = current === 'mix';
    return `<div class="strat-card mix-card ${active ? 'active' : ''}" id="sc-mix" style="border-color:${active ? '#7c3aed' : 'var(--border)'}">
      <div class="sc-head"><span class="strat-badge" style="background:#7c3aed">${RV.ui.icon('layer-group')} 混合(动态)</span><h3>三合一 · 择时分配</h3></div>
      <div class="sc-tagline">按上证20日斜率攻/守自动调权重 · 风险调整最优</div>
      <div class="sc-kpis">
        <div class="sc-kpi"><div class="v ${RV.fmt.cls(m.return_pct)}">${RV.fmt.pct(m.return_pct)}</div><div class="l">动态总收益</div></div>
        <div class="sc-kpi"><div class="v">¥${RV.fmt.money(50000 * (1 + m.return_pct / 100))}</div><div class="l">期末净值</div></div>
        <div class="sc-kpi"><div class="v down">${RV.fmt.num(Math.abs(m.max_drawdown), 2)}%</div><div class="l">最大回撤</div></div>
        <div class="sc-kpi"><div class="v ${RV.fmt.cls(m.equal_return_pct)}">${RV.fmt.pct(m.equal_return_pct)}</div><div class="l">等权对照</div></div>
        <div class="sc-kpi"><div class="v down">${RV.fmt.num(Math.abs(m.equal_max_drawdown), 2)}%</div><div class="l">等权回撤</div></div>
        <div class="sc-kpi"><div class="v">${(m.regime || []).filter(x => x === '攻').length}天</div><div class="l">攻(≥70%激进)</div></div>
      </div>
    </div>`;
  }

  function card(r, key) {
    const s = r.stats, meta = KEY_META[key];
    const clsRet = RV.fmt.cls(r.return_pct), clsMdd = r.max_drawdown < 0 ? 'down' : 'up';
    return `<div class="strat-card ${key === current ? 'active' : ''}" id="sc-${key}">
      <div class="sc-head"><span class="strat-badge ${meta.badge}">${RV.ui.icon(meta.icon)} ${r.label}</span><h3>${key === 'disciplined' ? '严守纪律 · 保本' : key === 'aggressive' ? '激进' : '稳健'}</h3></div>
      <div class="sc-tagline">${r.tagline}</div>
      <div class="sc-kpis">
        <div class="sc-kpi"><div class="v ${clsRet}">${RV.fmt.pct(r.return_pct)}</div><div class="l">总收益</div></div>
        <div class="sc-kpi"><div class="v">¥${RV.fmt.money(r.final_equity)}</div><div class="l">期末净值</div></div>
        <div class="sc-kpi"><div class="v ${clsMdd}">${RV.fmt.num(Math.abs(r.max_drawdown), 2)}%</div><div class="l">最大回撤</div></div>
        <div class="sc-kpi"><div class="v">${s.overall_win_rate}%</div><div class="l">整体胜率</div></div>
        <div class="sc-kpi"><div class="v">${RV.fmt.pct(r.alpha_pct)}</div><div class="l">超额(上证)</div></div>
        <div class="sc-kpi"><div class="v">${s.buy_times}/${s.sell_times}</div><div class="l">买卖次数</div></div>
      </div>
    </div>`;
  }

  function select(key) {
    current = key;
    document.querySelectorAll('.strat-card').forEach(el => el.classList.remove('active'));
    const sc = document.getElementById('sc-' + key);
    if (sc) sc.classList.add('active');
    if (key === 'mix') {
      renderMix(WDATA.windows[winKey]);
    } else {
      renderDetail(WDATA.windows[winKey].strategies[key]);
    }
  }

  /* ===== 混合视图（无持仓/交易，显示 dyn vs 等权 vs 上证 + regime 色带） ===== */
  function renderMix(d) {
    const m = d.mixed;
    const st = d.strategies;
    const el = document.getElementById('detail');
    el.innerHTML = `
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('chart-line')}</span>混合净值：动态择时 vs 静态等权 vs 上证</div>
        <div class="chart-box" id="mx-chart"></div>
        <div class="fmt-hint">${RV.ui.icon('hand-pointer', 'fa-xs')} 紫=动态择时（按上证20日斜率攻/守调权重）灰=等权 黄虚=上证；背景色带 红=攻(70%激进) 绿=守(70%纪律) 灰=衡 · 点击看当日组合明细</div>
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('layer-group')}</span>动态权重分布 & 各策略角色</div>
        ${regimeStats(m)}
        <div class="fmt-hint">${RV.ui.icon('arrows-split-up-and-left', 'fa-xs')} 攻：激进70/稳健20/纪律10 → 主吃上涨段；守：激进10/稳健20/纪律70 → 避险保本；衡：25/50/25。</div>
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('brain')}</span>逻辑</div>
        <div class="logic-box">${(m || {}).logic || ''}</div>
        <div style="margin-top:10px" class="data-table">
        <table><thead><tr><th>组合</th><th>总收益</th><th>最大回撤</th></tr></thead><tbody>
        <tr><td><b style="color:#7c3aed">动态混合</b></td><td class="${RV.fmt.cls(m.return_pct)}">${RV.fmt.pct(m.return_pct)}</td><td class="down">${RV.fmt.num(Math.abs(m.max_drawdown), 2)}%</td></tr>
        <tr><td>静态等权</td><td class="${RV.fmt.cls(m.equal_return_pct)}">${RV.fmt.pct(m.equal_return_pct)}</td><td class="down">${RV.fmt.num(Math.abs(m.equal_max_drawdown), 2)}%</td></tr>
        <tr><td>激进</td><td class="${RV.fmt.cls(st.aggressive.return_pct)}">${RV.fmt.pct(st.aggressive.return_pct)}</td><td class="down">${RV.fmt.num(Math.abs(st.aggressive.max_drawdown), 2)}%</td></tr>
        <tr><td>稳健</td><td class="${RV.fmt.cls(st.balanced.return_pct)}">${RV.fmt.pct(st.balanced.return_pct)}</td><td class="down">${RV.fmt.num(Math.abs(st.balanced.max_drawdown), 2)}%</td></tr>
        <tr><td>严守纪律</td><td class="${RV.fmt.cls(st.disciplined.return_pct)}">${RV.fmt.pct(st.disciplined.return_pct)}</td><td class="down">${RV.fmt.num(Math.abs(st.disciplined.max_drawdown), 2)}%</td></tr>
        <tr><td>上证基准</td><td class="${RV.fmt.cls(st.balanced.bench_return_pct)}">${RV.fmt.pct(st.balanced.bench_return_pct)}</td><td>--</td></tr>
        </tbody></table></div>
      </div>`;
    drawMixChart(d);
  }

  function regimeStats(m) {
    const regs = m.regime || [];
    const cnt = { '攻': 0, '衡': 0, '守': 0 };
    regs.forEach(x => { if (cnt[x] != null) cnt[x]++; });
    const tot = regs.length || 1;
    const bars = Object.entries(cnt).map(([k, v]) => {
      const c = k === '攻' ? '#dc2626' : (k === '守' ? '#16a34a' : '#94a3b8');
      return `<div style="display:inline-block;margin-right:18px"><b style="color:${c}">${k}</b> ${v}天(${(v / tot * 100).toFixed(0)}%)</div>`;
    }).join('');
    return `<div style="margin-bottom:8px">${bars}</div>`;
  }

  function drawMixChart(d) {
    const m = d.mixed;
    const dates = m.dates;
    const base = WDATA.start_cash;
    const b0 = d.strategies.balanced.equity_curve.find(p => p.bench != null);
    const bench = d.strategies.balanced.equity_curve.map(p => p.bench != null && b0 && b0.bench ? base * p.bench / b0.bench : null);
    const el = document.getElementById('mx-chart');
    if (!el) return;
    const c = echarts.init(el);
    // regime 色带
    const colors = { '攻': 'rgba(220,38,38,0.12)', '守': 'rgba(22,163,74,0.12)', '衡': 'rgba(148,163,184,0.08)' };
    const series = [];
    // 用 stack 实现色带：逐段同 regime 合并
    const segs = [];
    m.regime.forEach((r, i) => { const last = segs[segs.length - 1]; if (last && last.r === r) last.end = i + 1; else segs.push({ r, start: i, end: i + 1 }); });
    const maxEq = Math.max(...m.dyn, ...m.equal, ...(bench.filter(Boolean) || [base]));
    const minEq = Math.min(...m.dyn, ...m.equal, ...(bench.filter(Boolean) || [base]));
    const pad = (maxEq - minEq) * 0.1;
    segs.forEach(s => {
      series.push({
        name: 'regime-' + s.r, type: 'line', stack: 'bg',
        data: dates.map((_, i) => (i >= s.start && i < s.end ? 1 : null)),
        lineStyle: { opacity: 0 }, symbol: 'none',
        areaStyle: { color: colors[s.r] }, silent: true, tooltip: { show: false },
        markLine: undefined, z: 1, stackStrategy: 'all',
        yAxisIndex: 1,
      });
    });
    series.push({
      name: 'bgline', type: 'line', data: dates.map(() => minEq - pad), lineStyle: { opacity: 0 }, symbol: 'none', yAxisIndex: 1, silent: true, tooltip: { show: false }
    });
    const opt = {
      animation: false,
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
        formatter(params) {
          const p = params.find(x => x.seriesName === '动态');
          const i = p ? p.dataIndex : 0;
          return dates[i] + '<br>动态 ¥' + RV.fmt.num(m.dyn[i]) + '<br>等权 ¥' + RV.fmt.num(m.equal[i]) +
            (bench[i] != null ? '<br>上证 ¥' + RV.fmt.num(bench[i]) : '') + '<br><b>当日档位：' + (m.regime[i] || '') + '</b><br><span style="color:var(--text-2)">点击看贡献</span>';
        }
      },
      legend: { data: ['动态', '等权', '上证'], top: 0 },
      grid: { left: 62, right: 24, top: 34, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10 } },
      yAxis: [
        { type: 'value', scale: true, axisLabel: { fontSize: 10, formatter: v => '¥' + v } },
        { type: 'value', show: false, min: 0, max: 1 }
      ],
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 16, bottom: 0 }],
      series: [
        { name: '动态', type: 'line', data: m.dyn, showSymbol: false, lineStyle: { width: 2.4, color: '#7c3aed' }, z: 6,
          areaStyle: { color: 'rgba(124,58,237,0.06)' } },
        { name: '等权', type: 'line', data: m.equal, showSymbol: false, lineStyle: { width: 1.6, color: '#94a3b8', type: 'dashed' }, z: 5 },
        { name: '上证', type: 'line', data: bench, showSymbol: false, lineStyle: { width: 1.2, color: '#f59e0b', type: 'dotted' }, z: 4 },
        ...series
      ]
    };
    c.setOption(opt);
    c.on('click', (p) => { if (p && p.dataIndex != null) showMixDay(d, dates[p.dataIndex]); });
    window.__mxChart = c;
    window.__simMixDay = (dt) => showMixDay(d, dt);
    window.addEventListener('resize', () => c.resize());
  }

  /* ===== 图上浮层详情卡（点击任意点弹出；默认折叠可展开；不跳页） ===== */
  function showMixDay(d, date) {
    const i = d.mixed.dates.indexOf(date);
    if (i < 0) return;
    const m = d.mixed;
    // 三策略当日收益
    const gd = (k) => {
      const ec = d.strategies[k].equity_curve;
      return ec[i] ? ec[i].daily_return : 0;
    };
    const rA = gd('aggressive'), rB = gd('balanced'), rD = gd('disciplined');
    const reg = m.regime[i] || '衡';
    const w = reg === '攻' ? [0.7, 0.2, 0.1] : (reg === '守' ? [0.1, 0.2, 0.7] : [0.25, 0.5, 0.25]);
    const total = (w[0] * rA + w[1] * rB + w[2] * rD);
    const c = reg === '攻' ? '#dc2626' : (reg === '守' ? '#16a34a' : '#94a3b8');
    const detailBox = document.getElementById('detail');
    // 移除旧浮层
    const old = document.getElementById('chart-pop');
    if (old) old.remove();
    const chartSec = detailBox.querySelector('.sec-block');
    const dv = document.createElement('div');
    dv.id = 'chart-pop';
    dv.style.cssText = 'position:relative;z-index:20;margin-bottom:12px;border:1px solid var(--border);border-left:4px solid ' + c + ';border-radius:10px;background:var(--surface);padding:12px 14px;box-shadow:var(--shadow-hover)';
    dv.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <b>${date}</b>
        <span style="background:${c};color:#fff;border-radius:10px;padding:0 8px;font-size:11px;font-weight:700">${reg}（激进${Math.round(w[0] * 100)}/稳健${Math.round(w[1] * 100)}/纪律${Math.round(w[2] * 100)}）</span>
        <span class="sec-chip">动态 ¥${RV.fmt.num(m.dyn[i])}</span>
        <span class="sec-chip ${RV.fmt.cls(total)}">当日 ${RV.fmt.pct(total)}</span>
        <button id="pop-toggle" style="margin-left:auto;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer">${RV.ui.icon('chevron-down', 'fa-xs')} 展开明细</button>
        <button id="pop-close" style="border:none;background:none;color:var(--text-2);cursor:pointer;font-size:14px">${RV.ui.icon('xmark')}</button>
      </div>
      <div id="pop-body" style="display:none;margin-top:10px">
        <table class="data-table"><thead><tr><th>子策略</th><th>当日收益</th><th>权重</th><th>贡献</th></tr></thead><tbody>
          <tr><td style="font-weight:700">激进</td><td class="${RV.fmt.cls(rA)}">${RV.fmt.pct(rA)}</td><td>${Math.round(w[0] * 100)}%</td><td class="${RV.fmt.cls(w[0] * rA)}">${RV.fmt.pct(w[0] * rA)}</td></tr>
          <tr><td style="font-weight:700">稳健</td><td class="${RV.fmt.cls(rB)}">${RV.fmt.pct(rB)}</td><td>${Math.round(w[1] * 100)}%</td><td class="${RV.fmt.cls(w[1] * rB)}">${RV.fmt.pct(w[1] * rB)}</td></tr>
          <tr><td style="font-weight:700">严守纪律</td><td class="${RV.fmt.cls(rD)}">${RV.fmt.pct(rD)}</td><td>${Math.round(w[2] * 100)}%</td><td class="${RV.fmt.cls(w[2] * rD)}">${RV.fmt.pct(w[2] * rD)}</td></tr>
        </tbody></table>
        <div style="font-size:11px;color:var(--text-2);margin-top:6px">当日组合收益 = 各子策略收益×权重之和（${RV.fmt.pct(total)}）</div>
      </div>`;
    chartSec.after(dv);
    dv.querySelector('#pop-toggle').addEventListener('click', () => {
      const b = dv.querySelector('#pop-body');
      const on = b.style.display !== 'none';
      b.style.display = on ? 'none' : 'block';
      dv.querySelector('#pop-toggle').innerHTML = on ? RV.ui.icon('chevron-down', 'fa-xs') + ' 展开明细' : RV.ui.icon('chevron-up', 'fa-xs') + ' 收起明细';
    });
    dv.querySelector('#pop-close').addEventListener('click', () => dv.remove());
  }

  function renderDetail(r) {
    const el = document.getElementById('detail');
    el.innerHTML = `
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('chart-line')}</span>净值与每日收益</div>
        <div class="chart-box" id="eq-chart"></div>
        <div class="chart-box small" id="bar-chart"></div>
        <div class="fmt-hint">${RV.ui.icon('hand-pointer', 'fa-xs')} 上图净值曲线（橙=模拟盘，灰虚=上证基准）；下图每日收益柱（红=涨，绿=跌）。悬停看明细。</div>
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('calendar-days')}</span>分年收益 vs 上证</div>
        <table class="data-table"><thead><tr><th>年份</th>${(r.yearly || []).map(y => `<th>${y.year}</th>`).join('')}</tr></thead><tbody>
        <tr><td style="font-weight:700">${r.label}策略</td>${(r.yearly || []).map(y => `<td class="${RV.fmt.cls(y.ret)}">${RV.fmt.pct(y.ret)}</td>`).join('')}</tr>
        <tr><td style="color:var(--text-2)">上证</td>${(r.yearly || []).map(y => `<td class="${y.bench != null ? RV.fmt.cls(y.bench) : 'neutral'}">${y.bench != null ? RV.fmt.pct(y.bench) : '--'}</td>`).join('')}</tr>
        </tbody></table>
        <div class="fmt-hint">${RV.ui.icon('hand-pointer', 'fa-xs')} 年收益=每年末/年初净值；上证按同区间指数收盘；"全部"=整段区间收益</div>
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('briefcase')}</span>当前持仓 <span class="sec-chip">浮盈 ${r.stats.unrealized_pnl > 0 ? '+' : ''}¥${RV.fmt.num(r.stats.unrealized_pnl)}</span></div>
        ${(r.positions || []).length ? `<table class="data-table"><thead><tr><th>股票</th><th>买入日</th><th>股数</th><th>成本</th><th>现价</th><th>市值</th><th>浮盈亏</th></tr></thead><tbody>
          ${r.positions.map(p => `<tr><td style="font-weight:700">${p.name}</td><td><span class="date-tag">${p.buy_date}</span></td><td>${p.shares}</td><td>${RV.fmt.num(p.cost)}</td><td>${RV.fmt.num(p.price)}</td><td>¥${RV.fmt.num(p.value)}</td><td class="${RV.fmt.cls(p.pnl_pct)}">${RV.fmt.pct(p.pnl_pct)}（${p.pnl > 0 ? '+' : ''}¥${RV.fmt.num(p.pnl)}）</td></tr>`).join('')}
        </tbody></table>` : `<div class="empty">空仓（现金全部保留）</div>`}
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('arrows-rotate')}</span>持仓变化 · 每次交易 <span class="sec-chip">${r.trades.length} 笔（买${r.stats.buy_times}/卖${r.stats.sell_times}）</span> <span class="sec-chip">在图上点击该日 → 图上展开详情卡</span></div>
        <div id="trade-groups"></div>
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('brain')}</span>逻辑思考 · 每日操作与持仓</div>
        ${(r.daily_notes || []).map(n => `
          <div class="note-item">
            <span class="note-date">${n.date}</span>
            <span class="sec-chip">广度 ${n.breadth}%</span>
            <span class="sec-chip">上证 ${n.market}${n.market_score != null ? ' ' + n.market_score + '分' : ''}</span>
            ${n.notes.map(x => `<div style="margin:4px 0 2px 14px">· ${x}</div>`).join('')}
            ${n.holds && n.holds.length ? `<div class="hold-pills">${n.holds.map(h => `<span class="hold-pill"><span class="pn">${h.name}</span> ${h.shares}股 · 成本${RV.fmt.num(h.cost)} · 现${RV.fmt.num(h.px)}</span>`).join('')}</div>` : ''}
          </div>`).join('') || '<div class="empty">无操作日</div>'}
      </div>
      <div class="sec-block">
        <div class="sec-title"><span class="ti">${RV.ui.icon('lightbulb')}</span>策略逻辑</div>
        <div class="logic-box">${r.logic}</div>
      </div>`;
    renderTrades(r);
    drawCharts(r);
  }

  function drawCharts(r) {
    const dates = r.equity_curve.map(p => p.date);
    const eq = r.equity_curve.map(p => p.equity);
    const daily = r.equity_curve.map(p => p.daily_return);
    const b0 = r.equity_curve.find(p => p.bench != null);
    const base = WDATA.start_cash;
    const bench = r.equity_curve.map(p => p.bench != null && b0 && b0.bench ? base * p.bench / b0.bench : null);
    // 买卖 mark
    const buyPts = [], sellPts = [];
    (r.trades || []).forEach(t => { const i = dates.indexOf(t.date); if (i >= 0) (t.action === 'buy' ? buyPts : sellPts).push([i, eq[i]]); });

    const eqC = echarts.init(document.getElementById('eq-chart'));
    eqC.setOption({
      animation: false,
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
        formatter(params) { const p = params[0]; const i = p.dataIndex;
          const d = r.equity_curve[i];
          const t = (d.day_trades || []);
          let s = dates[i] + '<br>净值 ¥' + RV.fmt.num(eq[i]) + (bench[i] != null ? '<br>上证基准 ¥' + RV.fmt.num(bench[i]) : '') + '<br>持仓 ' + r.equity_curve[i].pos_count + ' 只';
          if (t.length) s += '<br><b style="color:#c78d5a">' + RV.ui.icon('arrows-rotate') + ' 当日' + t.length + '笔：</b>' + t.map(x => (x.action === 'buy' ? '🔺买' : '🔻卖') + x.name).join('、');
          s += '<br><span style="color:var(--text-2)">点击此处 → 图上展开当日明细卡</span>';
          return s; } },
      legend: { data: ['净值', '上证基准'], top: 0 },
      grid: { left: 62, right: 24, top: 34, bottom: 24 },
      xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10 } },
      yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 10, formatter: v => '¥' + v } },
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 16, bottom: 0 }],
      series: [
        { name: '净值', type: 'line', data: eq, showSymbol: false,
          lineStyle: { width: 2, color: '#c78d5a' }, areaStyle: { opacity: 0.08, color: '#c78d5a' },
          markPoint: { data: [
            { coord: [dates.length - 1, eq[eq.length - 1]], symbol: 'pin', symbolSize: 40, label: { formatter: RV.fmt.pct(r.return_pct), color: '#fff', fontSize: 9 }, itemStyle: { color: RV.fmt.cls(r.return_pct) === 'up' ? '#dc2626' : '#16a34a' } },
            ...buyPts.map(c => ({ coord: c, symbol: 'triangle', symbolSize: 9, itemStyle: { color: '#dc2626' }, label: { show: false } })),
            ...sellPts.map(c => ({ coord: c, symbol: 'triangle', symbolSize: 9, symbolRotate: 180, itemStyle: { color: '#16a34a' }, label: { show: false } }))
          ] } },
        { name: '上证基准', type: 'line', data: bench, showSymbol: false, lineStyle: { width: 1.4, color: '#94a3b8', type: 'dashed' } }
      ]
    });
    const barC = echarts.init(document.getElementById('bar-chart'));
    barC.setOption({
      animation: false,
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter(params) { const p = params[0]; const i = p.dataIndex; return dates[i] + '<br>日收益 ' + RV.fmt.pct(daily[i]) + '（净值 ¥' + RV.fmt.num(eq[i]) + '）'; } },
      grid: { left: 50, right: 20, top: 12, bottom: 20 },
      xAxis: { type: 'category', data: dates, axisLabel: { show: false } },
      yAxis: { type: 'value', axisLabel: { fontSize: 9, formatter: v => v + '%' } },
      dataZoom: [{ type: 'inside' }],
      series: [{ type: 'bar', data: daily.map(v => ({
        value: v, itemStyle: { color: v >= 0 ? '#dc2626' : '#16a34a', opacity: 0.75 } })), barWidth: '60%' }]
    });
    // 点击图上任意点 → 图上浮层展开详情卡（不跳转）
    const onClick = (params) => { if (params && params.dataIndex != null) showDay(r, dates[params.dataIndex]); };
    eqC.on('click', onClick);
    barC.on('click', onClick);
    Object.values(charts).forEach(c => { try { c.dispose(); } catch (e) {} });
    charts = { eqC, barC };
    window.__simCharts = charts;
    window.__simShowDay = (date) => showDay(r, date);
    window.addEventListener('resize', () => { eqC.resize(); barC.resize(); });
  }

  /* ---- 交易记录按月份分组折叠 ---- */
  function renderTrades(r) {
    const box = document.getElementById('trade-groups');
    if (!box) return;
    const trades = r.trades || [];
    if (!trades.length) { box.innerHTML = '<div class="empty">本期无交易（全程空仓观望）</div>'; return; }
    // 按 年-月 分组（保持时间序，每组内按日期倒序）
    const groups = {};
    trades.forEach(t => { const m = (t.date || '').slice(0, 7); (groups[m] = groups[m] || []).push(t); });
    const months = Object.keys(groups).sort();
    const expandAll = window.__expanded === true;
    box.innerHTML = months.map(m => {
      const g = groups[m];
      const buys = g.filter(t => t.action === 'buy').length;
      const sells = g.filter(t => t.action === 'sell').length;
      const monthPnl = g.filter(t => t.action === 'sell').reduce((a, t) => a + (t.pnl || 0), 0);
      const open = expandAll || m === months[months.length - 1];
      return `<div class="month-group">
        <div class="month-head" data-m="${m}">
          <span class="mg-caret">${open ? RV.ui.icon('chevron-down', 'fa-xs') : RV.ui.icon('chevron-right', 'fa-xs')}</span>
          <b>${m}</b>
          <span class="sec-chip">买${buys} / 卖${sells}</span>
          <span class="sec-chip ${RV.fmt.cls(monthPnl)}">月盈亏 ${monthPnl > 0 ? '+' : ''}¥${RV.fmt.num(monthPnl)}</span>
          <span style="margin-left:auto;font-size:11px;color:var(--text-2)">${open ? '点击收起' : '点击展开'}</span>
        </div>
        <div class="month-body" id="mb-${m}" style="display:${open ? 'block' : 'none'}">
          <table class="data-table"><thead><tr><th>成交日</th><th>方向</th><th>股票</th><th>时间</th><th>成交价</th><th>股数</th><th>较信号日</th><th>盈亏</th><th>持有</th><th>判定理由</th></tr></thead><tbody id="mt-${m}">
          ${g.slice().reverse().map(t => tradeRow(t)).join('')}
          </tbody></table>
        </div>
      </div>`;
    }).join('');
    box.querySelectorAll('.month-head').forEach(h => h.addEventListener('click', () => {
      const body = h.nextElementSibling;
      const on = body.style.display !== 'none';
      body.style.display = on ? 'none' : 'block';
      h.querySelector('.mg-caret').innerHTML = on ? RV.ui.icon('chevron-right', 'fa-xs') : RV.ui.icon('chevron-down', 'fa-xs');
      h.lastElementChild.textContent = on ? '点击展开' : '点击收起';
    }));
    // 展开全部按钮（底部独立容器见页面；此处若存在则绑定）
    const eb = document.getElementById('trade-expand-all');
    if (eb) eb.onclick = () => { window.__expanded = true; renderTrades(r); };
  }

  function tradeRow(t) {
    const vs = t.vs_sig_pct;
    return `<tr data-date="${t.date}">
      <td><span class="date-tag">${t.date}</span></td>
      <td>${t.action === 'buy' ? '<span class="tag tag-buy">买入</span>' : '<span class="tag tag-sell">卖出</span>'}</td>
      <td style="font-weight:700">${t.name}</td>
      <td style="color:var(--text-2)">${t.time || '--'}</td>
      <td>${RV.fmt.num(t.price)}</td>
      <td>${t.shares}</td>
      <td class="${vs != null ? RV.fmt.cls(vs) : 'neutral'}">${vs != null ? RV.fmt.pct(vs) : '--'}</td>
      <td class="${t.action === 'sell' ? RV.fmt.cls(t.pnl) : 'neutral'}">${t.action === 'sell' ? RV.fmt.pct(t.pnl_pct) : '--'}</td>
      <td>${t.action === 'sell' ? t.hold_days + '天' : '--'}</td>
      <td style="font-size:11.5px;color:var(--text-2)">${t.reason || ''}</td>
    </tr>`;
  }

  /* ---- 图点击 → 当日明细面板 ---- */
  function showDay(r, date) {
    const i = r.equity_curve.findIndex(p => p.date === date);
    if (i < 0) return;
    const d = r.equity_curve[i];
    const dayTrades = (d.day_trades || []);
    const holds = d.holds || [];
    const detailBox = document.getElementById('detail');
    if (!detailBox) return;
    // 移除旧浮层，保证只在图上弹一张
    const old = document.getElementById('chart-pop');
    if (old) old.remove();
    const chartSec = detailBox.querySelector('.sec-block');
    if (!chartSec) return;
    const dv = document.createElement('div');
    dv.id = 'chart-pop';
    const retCls = RV.fmt.cls(d.daily_return);
    const popColor = d.daily_return >= 0 ? '#dc2626' : '#16a34a';
    dv.style.cssText = 'position:relative;z-index:20;margin-bottom:12px;border:1px solid var(--border);border-left:4px solid ' + popColor + ';border-radius:10px;background:var(--surface);padding:12px 14px;box-shadow:var(--shadow-hover)';
    const net = (v, pre) => v != null ? RV.fmt.pct(v) : '--';
    dv.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <b>${date}</b>
        <span class="sec-chip">净值 ¥${RV.fmt.num(d.equity)}</span>
        <span class="sec-chip ${retCls}">当日 ${RV.fmt.pct(d.daily_return)}</span>
        <span class="sec-chip">持仓 ${d.pos_count} 只</span>
        <span class="sec-chip ${d.bench_chg != null ? RV.fmt.cls(d.bench_chg) : 'neutral'}">上证 ${d.bench_chg != null ? RV.fmt.pct(d.bench_chg) : '--'}</span>
        <span class="sec-chip">现金 ¥${RV.fmt.num(d.cash)}</span>
        ${dayTrades.length ? `<span class="tag tag-buy" style="font-size:11px">当日${dayTrades.length}笔交易</span>` : ''}
        <button id="pop-toggle" style="margin-left:auto;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer">${RV.ui.icon('chevron-down', 'fa-xs')} 展开明细</button>
        <button id="pop-close" style="border:none;background:none;color:var(--text-2);cursor:pointer;font-size:15px">${RV.ui.icon('xmark')}</button>
      </div>
      <div id="pop-body" style="display:none;margin-top:10px">
        ${dayTrades.length ? `<div style="font-weight:700;font-size:13px;margin:6px 0 4px">${RV.ui.icon('arrows-rotate', 'fa-xs')} 当日交易（${dayTrades.length}）</div>
        <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>方向</th><th>股票</th><th>时间</th><th>开盘</th><th>较信号日</th><th>盈亏</th><th>理由</th></tr></thead><tbody>
        ${dayTrades.map(t => `<tr>
          <td>${t.action === 'buy' ? '<span class="tag tag-buy">买入</span>' : '<span class="tag tag-sell">卖出</span>'}</td>
          <td style="font-weight:700">${t.name}</td><td>${t.time || '--'}</td><td>${RV.fmt.num(t.price)}</td>
          <td class="${t.vs_sig_pct != null ? RV.fmt.cls(t.vs_sig_pct) : 'neutral'}">${t.vs_sig_pct != null ? RV.fmt.pct(t.vs_sig_pct) : '--'}</td>
          <td class="${t.action === 'sell' ? RV.fmt.cls(t.pnl) : 'neutral'}">${t.action === 'sell' ? RV.fmt.pct(t.pnl_pct) : '--'}</td>
          <td style="font-size:11px;color:var(--text-2)">${t.reason || ''}</td></tr>`).join('')}
        </tbody></table></div>` : ''}
        ${holds.length ? `<div style="font-weight:700;font-size:13px;margin:10px 0 4px">${RV.ui.icon('briefcase', 'fa-xs')} 当日持仓（${holds.length}）</div>
        <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>股票</th><th>股数</th><th>成本</th><th>当日收盘</th><th>估算浮盈</th></tr></thead><tbody>
        ${holds.map(h => { const pnl = (h.px / h.cost - 1) * 100; return `<tr>
          <td style="font-weight:700">${h.name}</td><td>${h.shares}</td><td>${RV.fmt.num(h.cost)}</td><td>${RV.fmt.num(h.px)}</td>
          <td class="${RV.fmt.cls(pnl)}">${RV.fmt.pct(pnl)}</td></tr>`; }).join('')}
        </tbody></table></div>` : '<div style="color:var(--text-2);margin-top:6px">当日空仓</div>'}
      </div>`;
    // 插到净值图区块之后（紧贴图上，不需滚动到交易区）
    chartSec.after(dv);
    dv.querySelector('#pop-toggle').addEventListener('click', () => {
      const b = dv.querySelector('#pop-body');
      const on = b.style.display !== 'none';
      b.style.display = on ? 'none' : 'block';
      dv.querySelector('#pop-toggle').innerHTML = on ? RV.ui.icon('chevron-down', 'fa-xs') + ' 展开明细' : RV.ui.icon('chevron-up', 'fa-xs') + ' 收起明细';
    });
    dv.querySelector('#pop-close').addEventListener('click', () => dv.remove());
  }

  /* ---- 展开/收起全部月份（保留，页面按钮可复用） ---- */
})();
</script>
</body>
</html>
